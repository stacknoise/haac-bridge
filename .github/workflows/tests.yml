name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  PMD_VERSION: "7.28.0"
  # SHA-256 of pmd-dist-${PMD_VERSION}-bin.zip; update together with PMD_VERSION.
  PMD_SHA256: "f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2"

jobs:
  lint:
    name: ruff, bandit, code index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements_lint.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: bandit
        run: bandit -c pyproject.toml -r custom_components scripts
      - name: Code index up to date (concept 18.5)
        run: python scripts/code_index.py --check

  cpd:
    name: Copy-paste detection (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PMD
        run: |
          curl -sSfL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          echo "${PMD_SHA256}  pmd.zip" | sha256sum --check --strict
          unzip -q pmd.zip
      - name: CPD (fails from 100 duplicated tokens, concept 18.6)
        run: |
          "pmd-bin-${PMD_VERSION}/bin/pmd" cpd --language python --minimum-tokens 100 \
            --dir custom_components --dir scripts --format text

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements_test.txt
      - run: pytest -p no:cacheprovider --cov=custom_components.haac_bridge --cov-report=term-missing
