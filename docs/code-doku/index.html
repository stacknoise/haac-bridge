r not isinstance(raw[\"seq\"], int):\n            return None\n        code = raw[\"code\"]\n        flags = (raw[\"removed\"], raw[\"notify\"])\n        if (code is not None and not isinstance(code, str)) or not all(\n            isinstance(flag, bool) for flag in flags\n        ):\n            return None\n        entry = RunEntry(\n            schedule_id=str(raw[\"schedule_id\"]),\n            owner=str(raw[\"owner\"]),\n            name=str(raw[\"name\"]),\n            at=at,\n            result=RunResult(raw[\"result\"]),\n            code=code,\n            trigger=RunTrigger(raw[\"trigger\"]),\n            removed=flags[0],\n            notify=flags[1],\n        )\n    except KeyError, TypeError, ValueError:\n        return None\n    return LoggedRun(raw[\"seq\"], entry)\n\n\nclass ScheduleRunLog:\n    \"\"\"Keeps the runs of all schedules in memory and writes them to storage with a short delay.\n\n    `log_id` is new whenever the log starts empty, so an app that holds a cursor of an older log\n    knows to start over (concept 19.11).\n    \"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Create an empty log; call `async_load` before use.\"\"\"\n        self._store: Store[dict[str, Any]] = Store(\n            hass, RUN_LOG_STORE_VERSION, RUN_LOG_STORE_KEY, private=True\n        )\n        self.log_id = str(uuid.uuid4())\n        self._seq = 0\n        self._runs: list[LoggedRun] = []\n\n    async def async_load(self) -> None:\n        \"\"\"Read the log from storage; damaged entries are dropped, a missing file starts a new log.\"\"\"\n        stored = await self._store.async_load()\n        self._runs = []\n        if not isinstance(stored, dict) or not isinstance(stored.get(\"log_id\"), str):\n            self.log_id = str(uuid.uuid4())\n            self._seq = 0\n            return\n        self.log_id = stored[\"log_id\"]\n        seq = stored.get(\"seq\")\n        self._seq = seq if isinstance(seq, int) and not isinstance(seq, bool) else 0\n        for raw in stored.get(\"entries\", []):\n            if (run := _logged_run_from_dict(raw)) is None:\n                _LOGGER.warning(\"Dropping a damaged entry of the schedule run log\")\n                continue\n            self._runs.append(run)\n        self._seq = max([self._seq, *(run.seq for run in self._runs)])\n        self._prune(dt_util.utcnow())\n\n    @property\n    def last_seq(self) -> int:\n        \"\"\"Return the number of the newest entry of the log, 0 for a log that never had one.\"\"\"\n        return self._seq\n\n    def record(self, entry: RunEntry) -> None:\n        \"\"\"Append the entry of a finished or missed run and write the log soon.\n\n        A run that is missed twice (several starts before the next run) is logged once.\n        \"\"\"\n        if entry.result is RunResult.MISSED and any(\n            run.entry.result is RunResult.MISSED\n            and run.entry.schedule_id == entry.schedule_id\n            and run.entry.at == entry.at\n            for run in self._runs\n        ):\n            return\n        self._seq += 1\n        self._runs.append(LoggedRun(self._seq, entry))\n        self._prune(dt_util.utcnow())\n        self._store.async_delay_save(self._data_to_save, RUN_RESULT_SAVE_DELAY)\n\n    def runs_of(self, owner: str, after_seq: int = 0) -> list[dict[str, Any]]:\n        \"\"\"Return the owner's own entries with `seq` above `after_seq`, oldest first.\"\"\"\n        return [\n            run.to_dict() for run in self._runs if run.entry.owner == owner and run.seq > after_seq\n        ]\n\n    def last_seq_of(self, owner: str) -> int:\n        \"\"\"Return the number of the owner's newest entry, 0 if the owner has none.\"\"\"\n        return max((run.seq for run in self._runs if run.entry.owner == owner), default=0)\n\n    def owners(self) -> set[str]:\n        \"\"\"Return the owners that have entries in the log.\"\"\"\n        return {run.entry.owner for run in self._runs}\n\n    def remove_owners(self, owner_ids: set[str]) -> bool:\n        \"\"\"Delete all entries of these owners and write the log soon; return whether any existed.\"\"\"\n        kept = [run for run in self._runs if run.entry.owner not in owner_ids]\n        if len(kept) == len(self._runs):\n            return False\n        self._runs = kept\n        self._store.async_delay_save(self._data_to_save, RUN_RESULT_SAVE_DELAY)\n        return True\n\n    async def async_remove_file(self) -> None:\n        \"\"\"Forget all entries and delete the storage file when the config entry is removed.\"\"\"\n        self._runs = []\n        self._seq = 0\n        await self._store.async_remove()\n\n    def _prune(self, now: datetime) -> None:\n        \"\"\"Drop entries older than the retention and the oldest ones above the limit per owner.\"\"\"\n        oldest = now - RUN_LOG_RETENTION\n        kept = [run for run in self._runs if run.entry.at >= oldest]\n        per_owner: dict[str, int] = {}\n        newest_first: list[LoggedRun] = []\n        for run in reversed(kept):\n            count = per_owner.get(run.entry.owner, 0) + 1\n            per_owner[run.entry.owner] = count\n            if count <= MAX_RUN_LOG_PER_OWNER:\n                newest_first.append(run)\n        self._runs = newest_first[::-1]\n\n    def _data_to_save(self) -> dict[str, Any]:\n        \"\"\"Return the stored form of the log.\"\"\"\n        return {\n            \"log_id\": self.log_id,\n            \"seq\": self._seq,\n            \"entries\": [run.to_dict() for run in self._runs],\n        }\n","custom_components/haac_bridge/schedules/runner.py":"\"\"\"Runs one schedule: re-checks owner and exposure, switches the entities as the owner (concept 19.3).\"\"\"\n\nimport asyncio\nfrom collections.abc import Awaitable, Callable\nfrom dataclasses import dataclass\nfrom datetime import datetime\nimport logging\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import MISSED_RUN_GRACE\nfrom ..core.errors import ErrorCode, HaacBridgeError\nfrom ..core.runtime import RunLog, get_data\nfrom ..services.call_factory import async_execute\nfrom .model import (\n    LastRun,\n    Paused,\n    PauseReason,\n    RepeatFreq,\n    RunEntry,\n    RunOrigin,\n    RunResult,\n    RunTrigger,\n    Schedule,\n)\nfrom .store import ScheduleStore\n\n_LOGGER = logging.getLogger(__name__)\n\nRETRY_DELAY_SECONDS = 30\n\"\"\"Entities that are unavailable at run time are tried once more after this long (concept 19.3).\"\"\"\n\nUNAVAILABLE = \"unavailable\"\n\n\n@dataclass(frozen=True, slots=True)\nclass RunHooks:\n    \"\"\"What the runner asks the manager to do: remove schedules, re-plan one, announce a change.\n\n    `ends` tells whether the planned run of a schedule is its last one (concept 19.10).\n    \"\"\"\n\n    remove: Callable[[list[str]], Awaitable[None]]\n    replan: Callable[[str], Awaitable[None]]\n    changed: Callable[[str], None]\n    ready: Callable[[], bool]\n    ends: Callable[[str], bool]\n\n\nclass ScheduleRunner:\n    \"\"\"Executes schedules one at a time per schedule.\"\"\"\n\n    def __init__(\n        self, hass: HomeAssistant, store: ScheduleStore, hooks: RunHooks, run_log: RunLog\n    ) -> None:\n        \"\"\"Keep what a run needs; every run is reported to `run_log` (concept 19.11).\"\"\"\n        self._hass = hass\n        self._store = store\n        self._hooks = hooks\n        self._run_log = run_log\n        self._locks: dict[str, asyncio.Lock] = {}\n        self._tasks: set[asyncio.Task[None]] = set()\n        self._deferred: dict[str, datetime] = {}\n\n    @callback\n    def async_run_in_background(\n        self, schedule_id: str, triggered_by: str | None = None, client: str | None = None\n    ) -> None:\n        \"\"\"Start a run without waiting for it; the result arrives as a schedule change (concept 19.4).\"\"\"\n        task = self._hass.async_create_background_task(\n            self.async_run(schedule_id, triggered_by, client),\n            name=f\"haac_bridge run {schedule_id}\",\n        )\n        self._tasks.add(task)\n        task.add_done_callback(self._tasks.discard)\n\n    def is_running(self, schedule_id: str) -> bool:\n        \"\"\"Return True while a run of the schedule is going on (including its wait to retry).\"\"\"\n        lock = self._locks.get(schedule_id)\n        return lock is not None and lock.locked()\n\n    @callback\n    def async_run_deferred(self) -> None:\n        \"\"\"Start the runs that came due while the users were not loaded (review finding U2).\n\n        A run that waited longer than MISSED_RUN_GRACE is dropped and written to the run log as\n        `missed`, like a run missed while Home Assistant was down (concept 19.3, 19.11).\n        \"\"\"\n        now = dt_util.utcnow()\n        deferred, self._deferred = self._deferred, {}\n        for schedule_id, due in deferred.items():\n            if now - due > MISSED_RUN_GRACE:\n                _LOGGER.warning(\n                    \"Schedule %s was due at %s while the bridge reloaded; the run is skipped\",\n                    schedule_id,\n                    due.isoformat(),\n                )\n                self._log_missed(schedule_id, due)\n                continue\n            self.async_run_in_background(schedule_id)\n\n    @callback\n    def async_cancel_all(self) -> None:\n        \"\"\"Cancel the runs started in the background, e.g. one waiting to retry, when HA stops.\"\"\"\n        for task in list(self._tasks):\n            task.cancel()\n\n    async def async_run(\n        self, schedule_id: str, triggered_by: str | None = None, client: str | None = None\n    ) -> None:\n        \"\"\"Run a schedule now; a run of the same schedule that is still going on finishes first.\n\n        `triggered_by` is the HA user who started a manual run; the services run in that user's\n        context, so the logbook names them (review finding S10). Timed runs use the owner.\n        \"\"\"\n        lock = self._locks.setdefault(schedule_id, asyncio.Lock())\n        async with lock:\n            await self._async_run_locked(schedule_id, RunOrigin(triggered_by, client))\n        if self._store.get(schedule_id) is None:\n            self._locks.pop(schedule_id, None)\n\n    async def _async_run_locked(self, schedule_id: str, origin: RunOrigin) -> None:\n        \"\"\"Validate the owner and the exposure, then switch and record the result.\"\"\"\n        schedule = self._store.get(schedule_id)\n        if schedule is None:\n            return\n        if not self._hooks.ready():\n            self._deferred.setdefault(schedule_id, dt_util.utcnow())\n            _LOGGER.debug(\n                \"Schedule %s is due while the users are not loaded; it waits\", schedule_id\n            )\n            return\n        user = await self._hass.auth.async_get_user(schedule.owner)\n        exposure = get_data(self._hass).exposure\n        if user is None or not exposure.is_configured(user):\n            await self._hooks.remove([schedule.id])\n            return\n        if not user.is_active:\n            await self._async_pause(schedule.id, PauseReason.OWNER_INACTIVE)\n            return\n        targets = [entity for entity in schedule.entities if exposure.is_exposed(user, entity)]\n        if not targets:\n            failed = LastRun(dt_util.utcnow(), RunResult.FAILED, ErrorCode.SCH_RUN_FAILED.value)\n            self._log_run(schedule, failed, origin.triggered_by)\n            await self._async_pause(schedule.id, PauseReason.NO_ENTITIES, failed)\n            return\n        removes = self._removes_after_run(schedule, origin.triggered_by)\n        done = await self._async_switch_all(user, schedule, targets, origin)\n        result = _result(done, len(schedule.entities))\n        self._audit_result(schedule, result, done, len(schedule.entities), removed=removes)\n        await self._async_record(schedule, result, origin.triggered_by, removed=removes)\n        if removes:\n            await self._hooks.remove([schedule.id])\n\n    def _removes_after_run(self, schedule: Schedule, triggered_by: str | None) -> bool:\n        \"\"\"Return whether this run removes the schedule: the last planned run, or any run of a one-off.\n\n        A manual run (`triggered_by`) removes only a one-off schedule (concept 19.10).\n        \"\"\"\n        if triggered_by is None:\n            return self._hooks.ends(schedule.id)\n        return schedule.repeat.freq is RepeatFreq.ONCE\n\n    async def _async_switch_all(\n        self, user: User, schedule: Schedule, targets: list[str], origin: RunOrigin\n    ) -> int:\n        \"\"\"Switch the entities in parallel, the unavailable ones after a short wait; return how many worked.\"\"\"\n        ready = [entity for entity in targets if not self._is_unavailable(entity)]\n        later = [entity for entity in targets if entity not in ready]\n        done = await self._async_switch_many(user, schedule, ready, origin)\n        if later:\n            await self._async_wait_before_retry()\n            available = [entity for entity in later if not self._is_unavailable(entity)]\n            done += await self._async_switch_many(user, schedule, available, origin)\n        return done\n\n    async def _async_switch_many(\n        self, user: User, schedule: Schedule, entity_ids: list[str], origin: RunOrigin\n    ) -> int:\n        \"\"\"Switch the entities at the same time; return how many worked.\"\"\"\n        results = await asyncio.gather(\n            *(self._async_switch_one(user, schedule, entity_id, origin) for entity_id in entity_ids)\n        )\n        return sum(results)\n\n    async def _async_wait_before_retry(self) -> None:\n        \"\"\"Wait before unavailable entities are tried once more.\"\"\"\n        await asyncio.sleep(RETRY_DELAY_SECONDS)\n\n    async def _async_switch_one(\n        self, user: User, schedule: Schedule, entity_id: str, origin: RunOrigin\n    ) -> int:\n        \"\"\"Call the service for one entity, checked against the owner; return 1 if it worked, else 0.\n\n        The service runs in the context of the user who started a manual run, else of the owner\n        (review finding S10); the Activity page shows it either way (concept 21.4).\n        \"\"\"\n        data = get_data(self._hass)\n        try:\n            call = data.services.create(data.exposure, user, entity_id, schedule.action.value, {})\n            if origin.triggered_by is not None:\n                call = call.as_user(origin.triggered_by)\n        except HaacBridgeError as err:\n            _LOGGER.warning(\"%s while a schedule switched %s\", err.code, entity_id)\n            return 0\n        ok = True\n        try:\n            await async_execute(self._hass, call)\n        except HaacBridgeError as err:\n            _LOGGER.warning(\"%s while a schedule switched %s\", err.code, entity_id)\n            ok = False\n        data.audit.record(\n            data.audit_entries.schedule_switched(schedule, user, call, ok=ok, origin=origin)\n        )\n        return int(ok)\n\n    def _audit_result(\n        self, schedule: Schedule, result: RunResult, done: int, total: int, *, removed: bool\n    ) -> None:\n        \"\"\"Write the result of a run to the audit log (concept 21.3).\"\"\"\n        data = get_data(self._hass)\n        data.audit.record(\n            data.audit_entries.schedule_result(schedule, result.value, done, total, removed=removed)\n        )\n\n    def _audit_not_run(self, schedule: Schedule, reason: str) -> None:\n        \"\"\"Write a run that did not take place (missed, or the schedule was paused) to the audit log.\"\"\"\n        data = get_data(self._hass)\n        data.audit.record(data.audit_entries.schedule_not_run(schedule, reason))\n\n    def _is_unavailable(self, entity_id: str) -> bool:\n        \"\"\"Return True if the entity's state is `unavailable`.\"\"\"\n        state = self._hass.states.get(entity_id)\n        return state is not None and state.state == UNAVAILABLE\n\n    async def _async_record(\n        self, schedule: Schedule, result: RunResult, triggered_by: str | None, *, removed: bool\n    ) -> None:\n        \"\"\"Write the outcome of a run to the run log and store it on the schedule as it is now.\n\n        `removed` says the schedule is deleted after this run (concept 19.10).\n        \"\"\"\n        code = None if result is RunResult.OK else ErrorCode.SCH_RUN_FAILED.value\n        last_run = LastRun(dt_util.utcnow(), result, code)\n        self._log_run(schedule, last_run, triggered_by, removed=removed)\n        await self._async_update(schedule.id, last_run=last_run)\n\n    def _log_run(\n        self, schedule: Schedule, run: LastRun, triggered_by: str | None, *, removed: bool = False\n    ) -> None:\n        \"\"\"Append a run to the run log with the name and `notify` the schedule has now (concept 19.11).\"\"\"\n        trigger = RunTrigger.PLAN if triggered_by is None else RunTrigger.MANUAL\n        self._run_log.record(\n            RunEntry(\n                schedule_id=schedule.id,\n                owner=schedule.owner,\n                name=schedule.name,\n                at=run.at,\n                result=run.result,\n                code=run.code,\n                trigger=trigger,\n                removed=removed,\n                notify=schedule.notify,\n            )\n        )\n\n    def log_missed(self, schedule: Schedule, due: datetime, *, removed: bool) -> None:\n        \"\"\"Write a run HA missed to the run log; `removed` says the schedule is deleted after it.\"\"\"\n        self._log_run(schedule, LastRun(due, RunResult.MISSED), None, removed=removed)\n        self._audit_not_run(schedule, \"missed\")\n\n    def _log_missed(self, schedule_id: str, due: datetime) -> None:\n        \"\"\"Write a run that was skipped as `missed` to the run log and announce it (concept 19.11).\"\"\"\n        schedule = self._store.get(schedule_id)\n        if schedule is None:\n            return\n        self._log_run(schedule, LastRun(due, RunResult.MISSED), None)\n        self._audit_not_run(schedule, \"missed\")\n        self._hooks.changed(schedule_id)\n\n    async def _async_pause(\n        self, schedule_id: str, reason: PauseReason, last_run: LastRun | None = None\n    ) -> None:\n        \"\"\"Pause a schedule for a reason, optionally with a failed last run, and stop its timer.\"\"\"\n        paused = Paused(reason, dt_util.utcnow())\n        schedule = self._store.get(schedule_id)\n        if schedule is not None:\n            self._audit_not_run(schedule, f\"paused_{reason.value}\")\n        await self._async_update(schedule_id, paused=paused, last_run=last_run)\n        await self._hooks.replan(schedule_id)\n\n    async def _async_update(\n        self,\n        schedule_id: str,\n        *,\n        last_run: LastRun | None = None,\n        paused: Paused | None = None,\n    ) -> None:\n        \"\"\"Set `last_run` and `paused` (those that are given) on the current version and announce it.\"\"\"\n        current = self._store.get(schedule_id)\n        if current is None:\n            return\n        changes = {\n            name: value\n            for name, value in ((\"last_run\", last_run), (\"paused\", paused))\n            if value is not None\n        }\n        await self._store.async_replace(current.with_changes(**changes), delay=True)\n        self._hooks.changed(schedule_id)\n\n\ndef _result(done: int, total: int) -> RunResult:\n    \"\"\"Return `ok` if every entity worked, `partial` if some did and `failed` if none did.\"\"\"\n    if done == total:\n        return RunResult.OK\n    return RunResult.PARTIAL if done else RunResult.FAILED\n","custom_components/haac_bridge/schedules/runtime.py":"\"\"\"The typed config entry of HAAC Bridge: its runtime data is the schedule entity manager.\"\"\"\n\nfrom homeassistant.config_entries import ConfigEntry\n\nfrom .entities import ScheduleEntityManager\n\nHaacBridgeConfigEntry = ConfigEntry[ScheduleEntityManager]\n","custom_components/haac_bridge/schedules/skipping.py":"\"\"\"Skipped runs: a date rule that leaves out chosen dates (concept 19.12).\n\nLike `recurrence.py` this module needs only the standard library besides the rule it wraps.\n\"\"\"\n\nfrom datetime import date, timedelta\n\nfrom .recurrence import DateRule\n\nDAY = timedelta(days=1)\n\n\nclass SkippingRule:\n    \"\"\"A date rule without the dates the user skipped; every other date is the inner rule's.\"\"\"\n\n    def __init__(self, inner: DateRule, skipped: frozenset[date]) -> None:\n        \"\"\"Wrap the rule and remember the skipped dates (a few, at most `MAX_SKIPPED_DATES`).\"\"\"\n        self._inner = inner\n        self._skipped = skipped\n\n    def matches(self, day: date) -> bool:\n        \"\"\"Return whether the schedule runs on `day`: the rule says so and the date is not skipped.\"\"\"\n        return day not in self._skipped and self._inner.matches(day)\n\n    def next_date(self, after: date) -> date | None:\n        \"\"\"Return the first run date strictly after `after` that is not skipped, or None.\"\"\"\n        found = self._inner.next_date(after)\n        while found is not None and found in self._skipped:\n            found = self._inner.next_date(found)\n        return found\n\n    def previous_date(self, before: date) -> date | None:\n        \"\"\"Return the last run date on or before `before` that is not skipped, or None.\"\"\"\n        found = self._inner.previous_date(before)\n        while found is not None and found in self._skipped:\n            found = self._inner.previous_date(found - DAY)\n        return found\n","custom_components/haac_bridge/schedules/store.py":"\"\"\"Persistent storage of the schedules in `.storage/haac_bridge.schedules` (concept 19.2).\"\"\"\n\nfrom collections.abc import Iterable\nimport logging\nfrom typing import Any\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.storage import Store\n\nfrom ..const import RUN_RESULT_SAVE_DELAY, SCHEDULE_STORE_KEY, SCHEDULE_STORE_VERSION\nfrom ..core.errors import ErrorCode, ScheduleError\nfrom .model import Schedule, schedule_from_dict\n\n_LOGGER = logging.getLogger(__name__)\n\n\nclass ScheduleStore:\n    \"\"\"Holds all schedules in memory and writes them to storage after every change.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Create an empty store; call `async_load` before use.\"\"\"\n        self._store: Store[dict[str, Any]] = Store(\n            hass, SCHEDULE_STORE_VERSION, SCHEDULE_STORE_KEY, private=True\n        )\n        self._schedules: dict[str, Schedule] = {}\n        self._sorted: list[Schedule] | None = None\n        self._unreadable: list[Any] = []\n\n    async def async_load(self) -> None:\n        \"\"\"Read the schedules from storage.\n\n        A damaged entry is left out of the schedules and logged once, but kept as it is and written\n        back with every save, so a later version or a manual repair can still read it.\n        \"\"\"\n        stored = await self._store.async_load() or {}\n        self._schedules = {}\n        self._sorted = None\n        self._unreadable = []\n        for raw in stored.get(\"schedules\", []):\n            try:\n                schedule = schedule_from_dict(raw)\n            except ScheduleError as err:\n                _LOGGER.warning(\"%s: keeping an unreadable schedule in storage as it is\", err.code)\n                self._unreadable.append(raw)\n                continue\n            self._schedules[schedule.id] = schedule\n\n    @property\n    def unreadable_count(self) -> int:\n        \"\"\"Return how many stored entries could not be read and are kept unchanged.\"\"\"\n        return len(self._unreadable)\n\n    @property\n    def schedules(self) -> list[Schedule]:\n        \"\"\"Return all schedules, oldest first; sorted once per change, not on every access.\"\"\"\n        if self._sorted is None:\n            self._sorted = sorted(self._schedules.values(), key=lambda item: item.created_at)\n        return list(self._sorted)\n\n    def get(self, schedule_id: str) -> Schedule | None:\n        \"\"\"Return the schedule with this id, or None.\"\"\"\n        return self._schedules.get(schedule_id)\n\n    def by_owner(self, owner: str) -> list[Schedule]:\n        \"\"\"Return the schedules of one HA user, oldest first.\"\"\"\n        return [item for item in self.schedules if item.owner == owner]\n\n    async def async_add(self, schedule: Schedule) -> None:\n        \"\"\"Add a new schedule and save.\"\"\"\n        self._schedules[schedule.id] = schedule\n        await self._async_save()\n\n    async def async_replace(self, schedule: Schedule, *, delay: bool = False) -> None:\n        \"\"\"Replace an existing schedule as a whole and save; an unknown id raises HAB-SCH-003.\n\n        With `delay`, the write waits RUN_RESULT_SAVE_DELAY seconds and covers every change made\n        until then; Home Assistant writes it at the latest when it stops. Used for run results.\n        \"\"\"\n        if schedule.id not in self._schedules:\n            raise ScheduleError(ErrorCode.SCH_NOT_FOUND)\n        self._schedules[schedule.id] = schedule\n        if delay:\n            self._sorted = None\n            self._store.async_delay_save(self._data_to_save, RUN_RESULT_SAVE_DELAY)\n            return\n        await self._async_save()\n\n    async def async_remove(self, schedule_ids: Iterable[str]) -> list[Schedule]:\n        \"\"\"Remove the schedules with these ids, save once and return what was removed.\"\"\"\n        removed = [\n            self._schedules.pop(schedule_id)\n            for schedule_id in list(schedule_ids)\n            if schedule_id in self._schedules\n        ]\n        if removed:\n            await self._async_save()\n        return removed\n\n    async def async_apply_changes(\n        self, replace: Iterable[Schedule] = (), remove: Iterable[str] = ()\n    ) -> list[Schedule]:\n        \"\"\"Replace and remove schedules together with one save; return the removed schedules.\n\n        Schedules in `replace` that no longer exist are ignored.\n        \"\"\"\n        removed = [\n            self._schedules.pop(schedule_id)\n            for schedule_id in list(remove)\n            if schedule_id in self._schedules\n        ]\n        replaced = [item for item in replace if item.id in self._schedules]\n        for schedule in replaced:\n            self._schedules[schedule.id] = schedule\n        if removed or replaced:\n            await self._async_save()\n        return removed\n\n    async def _async_save(self) -> None:\n        \"\"\"Forget the sorted list and write all schedules to storage now (replaces a delayed write).\"\"\"\n        self._sorted = None\n        await self._store.async_save(self._data_to_save())\n\n    def _data_to_save(self) -> dict[str, Any]:\n        \"\"\"Return the stored form of all schedules, followed by the unreadable entries as they were.\"\"\"\n        return {\"schedules\": [*(item.to_dict() for item in self.schedules), *self._unreadable]}\n\n    async def async_remove_file(self) -> None:\n        \"\"\"Delete the storage file when the config entry of the bridge is removed.\"\"\"\n        self._schedules = {}\n        self._sorted = None\n        self._unreadable = []\n        await self._store.async_remove()\n","custom_components/haac_bridge/schedules/subscription.py":"\"\"\"Live subscription of one app connection to schedule changes (concept 19.4).\"\"\"\n\nfrom collections.abc import Callable\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.helpers.dispatcher import async_dispatcher_connect\n\nfrom ..const import SIGNAL_SCHEDULES_CHANGED\nfrom ..core.runtime import get_data\nfrom ..core.subscriptions import async_end_subscriptions_of\n\nSCHEDULES_CHANGED = \"schedules_changed\"\n\n\nclass ScheduleSubscription:\n    \"\"\"Sends `schedules_changed` with the new revision whenever the caller's schedules change.\"\"\"\n\n    def __init__(\n        self, hass: HomeAssistant, connection: ActiveConnection, msg_id: int, user: User\n    ) -> None:\n        \"\"\"Keep what is needed to compute the revision and send events; nothing is subscribed yet.\"\"\"\n        self._hass = hass\n        self._connection = connection\n        self._msg_id = msg_id\n        self._user = user\n        self._revision = \"\"\n        self._unsub: Callable[[], None] | None = None\n\n    @callback\n    def async_start(self) -> None:\n        \"\"\"Remember the current revision and start listening; a previous one of the connection ends.\"\"\"\n        async_end_subscriptions_of(self._connection, ScheduleSubscription)\n        self._revision = get_data(self._hass).schedules.revision_for(self._user)\n        self._unsub = async_dispatcher_connect(\n            self._hass, SIGNAL_SCHEDULES_CHANGED, self._async_on_changed\n        )\n\n    @callback\n    def async_stop(self) -> None:\n        \"\"\"Stop listening; called by HA when the app unsubscribes or the connection closes.\"\"\"\n        if self._unsub is not None:\n            self._unsub()\n            self._unsub = None\n\n    @callback\n    def _async_on_changed(self) -> None:\n        \"\"\"Send an event if the caller's view of the schedules changed.\"\"\"\n        data = get_data(self._hass)\n        revision = data.schedules.revision_for(self._user)\n        if revision == self._revision:\n            return\n        self._revision = revision\n        payload = {SCHEDULES_CHANGED: {\"revision\": revision}}\n        self._connection.send_message(data.responses.event(self._msg_id, payload))\n","custom_components/haac_bridge/schedules/triggers.py":"\"\"\"Trigger planners: when a schedule runs next and last ran (concept 19.3, 18.2 TriggerFactory).\"\"\"\n\nfrom collections.abc import Callable\nfrom datetime import date, datetime, timedelta, tzinfo\nfrom typing import NamedTuple, Protocol\n\nfrom homeassistant.const import SUN_EVENT_SUNRISE, SUN_EVENT_SUNSET\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.sun import get_astral_event_date\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import NEXT_RUNS_COUNT, UPCOMING_RUNS_LIMIT\nfrom ..core.errors import ErrorCode, ScheduleError\nfrom .model import Repeat, When, WhenType\nfrom .recurrence import DateRule, RecurrenceFactory\nfrom .skipping import SkippingRule\nfrom .wall_time import next_wall_run, previous_wall_run\n\nSUN_SEARCH_DAYS = 368\n\"\"\"Days a sun trigger looks ahead or back for an event before it gives up (concept 19.3 step 5).\n\nA year plus the days around it, so a yearly schedule is found from any day.\"\"\"\n\n\nclass UpcomingRun(NamedTuple):\n    \"\"\"One entry of `upcoming_runs`: when, on which local date and whether the user skipped it.\"\"\"\n\n    at: datetime\n    day: date\n    skipped: bool\n\n\nclass Trigger(Protocol):\n    \"\"\"Computes the runs of one schedule; None means no run can be computed.\"\"\"\n\n    def next_run(self, after: datetime) -> datetime | None:\n        \"\"\"Return the first run strictly after `after` (UTC), or None.\"\"\"\n\n    def previous_run(self, before: datetime) -> datetime | None:\n        \"\"\"Return the last run at or before `before` (UTC), or None.\"\"\"\n\n\nclass TimeTrigger:\n    \"\"\"A fixed wall-clock time on the dates of a rule.\"\"\"\n\n    def __init__(self, when: When, rule: DateRule, tz: tzinfo) -> None:\n        \"\"\"Remember the time, the date rule and the time zone of the planning.\"\"\"\n        if when.time is None:\n            raise ScheduleError(ErrorCode.SCH_INVALID)\n        self._rule = rule\n        self._at = when.time\n        self._tz = tz\n\n    def next_run(self, after: datetime) -> datetime | None:\n        \"\"\"Return the first run after `after`, DST-safe.\"\"\"\n        return next_wall_run(after, self._rule, self._at, self._tz)\n\n    def previous_run(self, before: datetime) -> datetime | None:\n        \"\"\"Return the last run at or before `before`, DST-safe.\"\"\"\n        return previous_wall_run(before, self._rule, self._at, self._tz)\n\n\nclass SunTrigger:\n    \"\"\"Sunrise or sunset plus an offset, on the dates of a rule, by the local date of the result.\"\"\"\n\n    def __init__(\n        self, hass: HomeAssistant, when: When, rule: DateRule, event: str, tz: tzinfo\n    ) -> None:\n        \"\"\"Remember the sun event, the offset, the date rule and the time zone.\"\"\"\n        self._hass = hass\n        self._rule = rule\n        self._event = event\n        self._offset = timedelta(minutes=when.offset_min)\n        self._tz = tz\n\n    def _instant(self, day_offset: int, today: datetime) -> datetime | None:\n        \"\"\"Return the run on the sun event of `today` plus `day_offset` days, or None.\"\"\"\n        day = today + timedelta(days=day_offset)\n        if not self._near_run_date(day.astimezone(self._tz).date()):\n            return None\n        event = get_astral_event_date(self._hass, self._event, day)\n        if event is None:\n            return None\n        instant = event + self._offset\n        if not self._rule.matches(instant.astimezone(self._tz).date()):\n            return None\n        return instant\n\n    def _near_run_date(self, day: date) -> bool:\n        \"\"\"Return whether the rule runs on `day` or a day next to it, so the sun need not be computed.\"\"\"\n        return any(self._rule.matches(day + timedelta(days=step)) for step in (-1, 0, 1))\n\n    def next_run(self, after: datetime) -> datetime | None:\n        \"\"\"Return the first run after `after`; None if the sun never gives one within a year.\"\"\"\n        for day_offset in range(-1, SUN_SEARCH_DAYS):\n            instant = self._instant(day_offset, after)\n            if instant is not None and instant > after:\n                return instant\n        return None\n\n    def previous_run(self, before: datetime) -> datetime | None:\n        \"\"\"Return the last run at or before `before`; None if there is none within a year.\"\"\"\n        for day_offset in range(1, -SUN_SEARCH_DAYS, -1):\n            instant = self._instant(day_offset, before)\n            if instant is not None and instant <= before:\n                return instant\n        return None\n\n\nclass TriggerFactory:\n    \"\"\"Creates the trigger planner that belongs to a schedule's `when` and `repeat` (concept 18.2).\"\"\"\n\n    def __init__(self, hass: HomeAssistant, recurrence: RecurrenceFactory | None = None) -> None:\n        \"\"\"Remember hass for the sun calculations and the factory of the date rules.\"\"\"\n        self._hass = hass\n        self._recurrence = recurrence or RecurrenceFactory()\n\n    def date_rule(\n        self, when: When, repeat: Repeat | None = None, skipped: frozenset[date] = frozenset()\n    ) -> DateRule:\n        \"\"\"Return the dates of a schedule without the skipped ones (concept 19.12).\n\n        Without `repeat` the schedule runs weekly on the weekdays of `when`.\n        \"\"\"\n        rule = self._recurrence.create(repeat or Repeat(), when.days)\n        return SkippingRule(rule, skipped) if skipped else rule\n\n    def create(\n        self, when: When, repeat: Repeat | None = None, skipped: frozenset[date] = frozenset()\n    ) -> Trigger:\n        \"\"\"Return the planner for this trigger, bound to the current HA time zone.\n\n        The skipped dates are left out of the runs.\n        \"\"\"\n        tz = dt_util.get_default_time_zone()\n        rule = self.date_rule(when, repeat, skipped)\n        builders: dict[WhenType, Callable[[], Trigger]] = {\n            WhenType.TIME: lambda: TimeTrigger(when, rule, tz),\n            WhenType.SUNRISE: lambda: SunTrigger(self._hass, when, rule, SUN_EVENT_SUNRISE, tz),\n            WhenType.SUNSET: lambda: SunTrigger(self._hass, when, rule, SUN_EVENT_SUNSET, tz),\n        }\n        return builders[when.type]()\n\n    def upcoming(\n        self,\n        when: When,\n        repeat: Repeat,\n        after: datetime,\n        count: int = NEXT_RUNS_COUNT,\n        skipped: frozenset[date] = frozenset(),\n    ) -> list[datetime]:\n        \"\"\"Return up to `count` runs after `after`, in order (concept 19.10 `next_runs`).\"\"\"\n        trigger = self.create(when, repeat, skipped)\n        runs: list[datetime] = []\n        while len(runs) < count and (found := trigger.next_run(runs[-1] if runs else after)):\n            runs.append(found)\n        return runs\n\n    def run_dates(self, when: When, repeat: Repeat, after: datetime) -> list[tuple[datetime, date]]:\n        \"\"\"Return the next runs of the rule with their local dates, skips ignored (concept 19.12).\n\n        At most `UPCOMING_RUNS_LIMIT` runs; these are the ones the user can skip.\n        \"\"\"\n        return [\n            (run, dt_util.as_local(run).date())\n            for run in self.upcoming(when, repeat, after, UPCOMING_RUNS_LIMIT)\n        ]\n\n    def upcoming_with_skips(\n        self, when: When, repeat: Repeat, after: datetime, skipped: frozenset[date]\n    ) -> list[UpcomingRun]:\n        \"\"\"Return the next runs including the skipped ones between them, each with its date and skip flag.\n\n        It ends after `NEXT_RUNS_COUNT` runs that will happen or at `UPCOMING_RUNS_LIMIT` entries.\n        \"\"\"\n        entries: list[UpcomingRun] = []\n        for run, day in self.run_dates(when, repeat, after):\n            entries.append(UpcomingRun(run, day, day in skipped))\n            if sum(not entry.skipped for entry in entries) >= NEXT_RUNS_COUNT:\n                break\n        return entries\n\n    def is_ended(\n        self, when: When, repeat: Repeat, after: datetime, skipped: frozenset[date] = frozenset()\n    ) -> bool:\n        \"\"\"Return whether the schedule has no run left after `after`, as the rule ends (concept 19.10).\n\n        A sun schedule without an event within a year is not ended: its rule still has dates.\n        \"\"\"\n        if self.create(when, repeat, skipped).next_run(after) is not None:\n            return False\n        today = after.astimezone(dt_util.get_default_time_zone()).date()\n        return self.date_rule(when, repeat, skipped).next_date(today) is None\n","custom_components/haac_bridge/schedules/wall_time.py":"\"\"\"Next and previous run of a fixed wall-clock time on the dates of a rule, DST-safe (concept 19.3 step 4).\n\nThis module needs only the standard library, so the time arithmetic can be tested on its own.\nHA's `find_next_time_expression_time` is not used: it skips the whole day when the wall time falls\ninto a DST gap, but a schedule must still run on that day.\n\"\"\"\n\nfrom datetime import UTC, date, datetime, time, timedelta, tzinfo\nfrom typing import TYPE_CHECKING\n\nif TYPE_CHECKING:\n    from .recurrence import DateRule\n\nCANDIDATE_DATES = 5\n\"\"\"Run dates looked at on each side of the time: the day before, the day and the next ones.\"\"\"\n\nDAY = timedelta(days=1)\n\nMAX_GAP_MINUTES = 180\n\"\"\"Longest DST gap (in minutes) the search steps through; real gaps are 30 or 60 minutes.\"\"\"\n\n\ndef _exists(local: datetime) -> bool:\n    \"\"\"Return whether the wall time exists in its zone (clocks going forward skip some).\"\"\"\n    back = local.astimezone(UTC).astimezone(local.tzinfo)\n    return back.replace(tzinfo=None) == local.replace(tzinfo=None)\n\n\ndef wall_instant(day: date, at: time, tz: tzinfo) -> datetime:\n    \"\"\"Return the UTC instant at which the wall time `at` is reached on `day` in `tz`.\n\n    A time that does not exist (clocks go forward) is reached at the first existing minute after\n    the gap; a time that occurs twice (clocks go back) is reached at its first occurrence.\n    \"\"\"\n    naive = datetime.combine(day, at)\n    local = naive.replace(tzinfo=tz)\n    for _ in range(MAX_GAP_MINUTES):\n        if _exists(local):\n            break\n        naive += timedelta(minutes=1)\n        local = naive.replace(tzinfo=tz)\n    return local.astimezone(UTC)\n\n\ndef next_wall_run(after: datetime, rule: DateRule, at: time, tz: tzinfo) -> datetime | None:\n    \"\"\"Return the first run strictly after `after` on a date of `rule`, or None if it has ended.\"\"\"\n    cursor = after.astimezone(tz).date() - 2 * DAY\n    for _ in range(CANDIDATE_DATES):\n        day = rule.next_date(cursor)\n        if day is None:\n            return None\n        instant = wall_instant(day, at, tz)\n        if instant > after:\n            return instant\n        cursor = day\n    return None\n\n\ndef previous_wall_run(before: datetime, rule: DateRule, at: time, tz: tzinfo) -> datetime | None:\n    \"\"\"Return the last run at or before `before` on a date of `rule`, or None if there is none.\"\"\"\n    cursor = before.astimezone(tz).date() + DAY\n    for _ in range(CANDIDATE_DATES):\n        day = rule.previous_date(cursor)\n        if day is None:\n            return None\n        instant = wall_instant(day, at, tz)\n        if instant <= before:\n            return instant\n        cursor = day - DAY\n    return None\n","custom_components/haac_bridge/sensor.py":"\"\"\"Sensor platform: the `next run` sensor of every schedule (concept 19.5).\"\"\"\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.entity_platform import AddEntitiesCallback\n\nfrom .schedules.entities import PLATFORM_SENSOR\nfrom .schedules.runtime import HaacBridgeConfigEntry\n\n\nasync def async_setup_entry(\n    hass: HomeAssistant, entry: HaacBridgeConfigEntry, async_add_entities: AddEntitiesCallback\n) -> None:\n    \"\"\"Create the sensors of the existing schedules and of those added later.\"\"\"\n    entry.runtime_data.async_setup_platform(PLATFORM_SENSOR, async_add_entities)\n","custom_components/haac_bridge/services/__init__.py":"\"\"\"Service calls: validated against the caller's exposure and executed with the caller's context.\"\"\"\n","custom_components/haac_bridge/services/audited_call.py":"\"\"\"The audited service call of `haac_bridge/call_service` (concept 21.3, 21.4).\"\"\"\n\nfrom dataclasses import dataclass\nimport time\nfrom typing import Any\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant\n\nfrom ..core.errors import ErrorCode, HaacBridgeError\nfrom ..core.runtime import get_data\nfrom .call_factory import ValidatedServiceCall, async_execute\n\n\n@dataclass(frozen=True, slots=True)\nclass ServiceRequest:\n    \"\"\"What a client asked for: the target, the service and its data, the device name and the source.\"\"\"\n\n    entity_id: str\n    service: str\n    service_data: dict[str, Any]\n    source: str\n    client: str | None = None\n\n\nasync def async_audited_call(hass: HomeAssistant, user: User, request: ServiceRequest) -> None:\n    \"\"\"Check and carry out a service call for the user, then record what happened.\n\n    A success is one audit entry (log line and Activity event). A refusal or a failure is logged once by\n    the command wrapper, which gets entity, service and device name from the error; only a failed\n    service also reaches the Activity page, a refusal never does (concept 21.4).\n    \"\"\"\n    data = get_data(hass)\n    call: ValidatedServiceCall | None = None\n    try:\n        call = data.services.create(\n            data.exposure, user, request.entity_id, request.service, request.service_data\n        )\n        started = time.monotonic()\n        await async_execute(hass, call)\n    except HaacBridgeError as err:\n        err.with_details(entity=request.entity_id, service=request.service, client=request.client)\n        if call is not None and err.code is ErrorCode.SVC_FAILED:\n            data.audit.record(data.audit_entries.call_failed(call, request.client, request.source))\n        raise\n    duration_ms = round((time.monotonic() - started) * 1000)\n    data.audit.record(\n        data.audit_entries.call_service(\n            user, call, source=request.source, client=request.client, duration_ms=duration_ms\n        )\n    )\n","custom_components/haac_bridge/services/call_factory.py":"\"\"\"ServiceCallFactory: validated service calls for haac_bridge/call_service (concept 10.3, 11.4, 18.2).\"\"\"\n\nimport asyncio\nfrom dataclasses import dataclass, replace\nfrom typing import Any\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.const import ATTR_ENTITY_ID\nfrom homeassistant.core import Context, HomeAssistant, split_entity_id\nfrom homeassistant.exceptions import HomeAssistantError, ServiceNotFound, Unauthorized\nimport voluptuous as vol\n\nfrom ..const import ALLOWED_SERVICES, SERVICE_TIMEOUT\nfrom ..core.errors import EntityNotFoundError, ErrorCode, InvalidServiceError, RequestError\nfrom ..core.runtime import get_data\nfrom ..exposure.exposure import Exposure\n\n\n@dataclass(frozen=True, slots=True)\nclass ValidatedServiceCall:\n    \"\"\"A service call that passed all checks; the target is always exactly one entity.\"\"\"\n\n    domain: str\n    service: str\n    data: dict[str, Any]\n    entity_id: str\n    user_id: str\n    context: Context\n\n    def as_user(self, user_id: str) -> ValidatedServiceCall:\n        \"\"\"Return the same call in a new context of another user, as for a manual run of a schedule.\"\"\"\n        return replace(self, context=Context(user_id=user_id))\n\n\nclass ServiceCallFactory:\n    \"\"\"Creates service calls only for exposed entities and services of the entity's own domain.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Keep hass for state and service lookups.\"\"\"\n        self._hass = hass\n\n    def create(\n        self,\n        exposure: Exposure,\n        user: User,\n        entity_id: str,\n        service: str,\n        data: dict[str, Any],\n    ) -> ValidatedServiceCall:\n        \"\"\"Return the validated call or raise the matching HAB error (SVC-001, ENT-001, ENT-002, SVC-002, WS-001).\n\n        An entity the user deactivated (concept 7.5) is refused with ENT-002 before the call is built; a\n        schedule run goes through here too, so it never switches a deactivated entity.\n        Only services in ALLOWED_SERVICES are carried out, and only with their listed data keys.\n        The call gets its own `Context` of the user; the same context goes into the Activity event\n        (concept 21.4).\n        \"\"\"\n        if not exposure.is_exposed(user, entity_id):\n            raise InvalidServiceError(ErrorCode.SVC_NOT_ALLOWED)\n        if self._hass.states.get(entity_id) is None:\n            raise EntityNotFoundError(ErrorCode.ENT_NOT_FOUND)\n        if get_data(self._hass).disabled.is_disabled(user.id, entity_id):\n            raise EntityNotFoundError(ErrorCode.ENT_DISABLED)\n        domain = split_entity_id(entity_id)[0]\n        allowed_keys = ALLOWED_SERVICES.get(domain, {}).get(service)\n        if allowed_keys is None or not self._hass.services.has_service(domain, service):\n            raise InvalidServiceError(ErrorCode.SVC_NOT_AVAILABLE)\n        if not data.keys() <= allowed_keys:\n            raise RequestError(ErrorCode.WS_INVALID_REQUEST)\n        context = Context(user_id=user.id)\n        return ValidatedServiceCall(domain, service, dict(data), entity_id, user.id, context)\n\n\nasync def async_execute(hass: HomeAssistant, call: ValidatedServiceCall) -> None:\n    \"\"\"Run the call in its own context, targeting only its entity; map HA errors to HAB codes.\n\n    A call that takes longer than SERVICE_TIMEOUT seconds is given up and counts as failed, so a\n    hanging integration never blocks the command or a schedule run (review finding U3).\n    \"\"\"\n    try:\n        async with asyncio.timeout(SERVICE_TIMEOUT):\n            await hass.services.async_call(\n                call.domain,\n                call.service,\n                call.data,\n                blocking=True,\n                context=call.context,\n                target={ATTR_ENTITY_ID: call.entity_id},\n            )\n    except TimeoutError as err:\n        raise InvalidServiceError(ErrorCode.SVC_FAILED) from err\n    except Unauthorized as err:\n        raise InvalidServiceError(ErrorCode.SVC_NOT_ALLOWED) from err\n    except ServiceNotFound as err:\n        raise InvalidServiceError(ErrorCode.SVC_NOT_AVAILABLE) from err\n    except (HomeAssistantError, vol.Invalid) as err:\n        raise InvalidServiceError(ErrorCode.SVC_FAILED) from err\n","custom_components/haac_bridge/switch.py":"\"\"\"Switch platform: the `enabled` switch of every schedule (concept 19.5).\"\"\"\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.entity_platform import AddEntitiesCallback\n\nfrom .schedules.entities import PLATFORM_SWITCH\nfrom .schedules.runtime import HaacBridgeConfigEntry\n\n\nasync def async_setup_entry(\n    hass: HomeAssistant, entry: HaacBridgeConfigEntry, async_add_entities: AddEntitiesCallback\n) -> None:\n    \"\"\"Create the switches of the existing schedules and of those added later.\"\"\"\n    entry.runtime_data.async_setup_platform(PLATFORM_SWITCH, async_add_entities)\n"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),F=JSON.parse(document.getElementById('files').textContent);
const T=D.types,byId={},byName={},users={};
T.forEach(t=>{byId[t.id]=t;(byName[t.name]=byName[t.name]||[]).push(t)});
T.forEach(t=>t.deps.forEach(d=>(users[d]=users[d]||[]).push(t.id)));
const LAYERS=D.projects.map(p=>p.name),sl=s=>s.replace(/\W+/g,'_');
const lay=t=>t.project,nsS=n=>n,sn=id=>id.split('|')[1];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const miOf=(loc,cc)=>Math.round(Math.max(0,(171-5.2*Math.log(Math.max(1,loc*8))-.23*cc-16.2*Math.log(Math.max(1,loc)))*100/171));
T.forEach(t=>t.meths.forEach(m=>m.mi=miOf(m.loc,m.cc)));
const ccC=c=>c>10?'bad':c>5?'warn':'ok', miC=m=>m>=55?'ok':m>=35?'warn':'bad', inC=i=>i>.8?'bad':i>.5?'warn':'ok';
const KI={object:['O','#2c8f6a'],module:['M','#8a6d1d'],file:['F','#8a6d1d'],class:['C','#2c6fa3'],interface:['I','#8553ad'],record:['R','#b8741a'],struct:['S','#17878c'],enum:['E','#6f777d']};
const kiHtml=t=>{const k=KI[t.kind]||KI.class;return `<span class="ki" style="background:${k[1]}" title="${t.kind}">${k[0]}</span>`};
const pick=w=>byName[w][0];
const typeLink=id=>`<a class="chip" data-go="${id}">${esc(sn(id))}</a>`;
/* Syntax */
const KW=new Set('abstract as async await base bool break case catch char checked class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly record ref return sealed short sizeof static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while when init required with get set yield partial global nint'.split(' '));
(D.kw||[]).forEach(w=>KW.add(w));
const hlc={};
function hlFile(p){
  if(hlc[p])return hlc[p];
  const src=F[p],re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#(?!\[)[^\n]*)|("""[\s\S]*?"""|\$?@?"(?:\\.|[^"\\\n])*"|@\$?"(?:[^"]|"")*"|'(?:\\.|[^'\\\n])')|(\b\d[\d_]*(?:\.\d+)?[fFdDmMlLuU]*\b)|([A-Za-z_]\w*)/g;
  const wrap=(c,s)=>s.split('\n').map(x=>`<span class="${c}">${esc(x)}</span>`).join('\n');
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+=wrap('c',m[1]);else if(m[2])out+=wrap('s',m[2]);else if(m[3])out+=wrap('n',m[3]);
    else{const w=m[4];out+=KW.has(w)?`<span class="k">${w}</span>`:(byName[w]&&/^[A-Z]/.test(w))?`<a class="tl" data-go="${pick(w).id}">${w}</a>`:w}
  }
  out+=esc(src.slice(last));return hlc[p]=out.split('\n');
}
function srcView(el,t,m,opt={}){
  if(!t){el.innerHTML='<div class="empty">Typ oder Methode wählen, dann erscheint hier der Quelltext.</div>';return}
  const L=hlFile(t.file),a=opt.from||1,b=opt.to||L.length;
  el.innerHTML=`<div class="src-h"><span>${esc(t.file)}</span><span class="muted">${m?`Methode ${esc(m.n)} · Zeilen ${m.l}–${m.e}`:`Typ ${esc(t.name)} · Zeilen ${t.l}–${t.e}`}</span></div><div class="code">`+
   L.slice(a-1,b).map((h,i)=>{const n=a+i;return `<div class="ln${n>=t.l&&n<=t.e&&!opt.from?' it':''}${m&&n>=m.l&&n<=m.e?' im':''}"><b>${n}</b><span>${h||' '}</span></div>`}).join('')+'</div>';
  const code=el.querySelector('.code'),tgt=(m?m.l:t.dl)-a;
  code.scrollTop=Math.max(0,(code.children[Math.max(0,tgt)]?.offsetTop||0)-30);
}
function metricTiles(t){
  return `<div class="tiles"><div class="tile"><b>${t.loc}</b><small>Codezeilen</small></div><div class="tile"><b class="${ccC(t.cc/Math.max(1,t.meths.length||1))}">${t.cc}</b><small>Komplexität (Σ CC)</small></div>
  <div class="tile"><b class="${miC(t.mi)}">${t.mi}</b><small>Wartbarkeit (0–100)</small></div><div class="tile"><b>${t.meths.length}</b><small>Methoden</small></div>
  <div class="tile"><b>${t.ce}</b><small>nutzt (Ce)</small></div><div class="tile"><b>${t.ca}</b><small>genutzt von (Ca)</small></div>
  <div class="tile"><b class="${inC(t.instab)}">${t.instab.toFixed(2)}</b><small>Instabilität</small></div><div class="tile"><b class="${t.tested?'ok':'bad'}">${t.tested?'ja':'nein'}</b><small>Test nennt Typ</small></div></div>`;
}
function depChips(t){
  const u=(users[t.id]||[]).slice().sort(),imp=t.deps.slice().sort();
  const grp=(ids,c)=>ids.length?ids.map(i=>`<a class="chip ${c}" data-go="${i}" title="${esc(byId[i].ns)}">${esc(sn(i))}<i>${lay(byId[i])}</i></a>`).join(''):'<span class="muted">keine</span>';
  return `<div class="sec">Nutzt (${imp.length})</div><div>${grp(imp,'imp')}</div><div class="sec">Wird genutzt von (${u.length})</div><div>${grp(u,'use')}</div>`;
}
function methodTable(t,curL){
  const rows=t.meths.slice().sort((a,b)=>a.l-b.l).map(m=>`<tr data-m="${m.l}" class="${curL===m.l?'cur':''}"><td><b>${esc(m.n)}</b><div class="muted mono" style="max-width:380px;overflow-wrap:anywhere">${esc(m.sig)}</div></td><td>${m.vis}</td><td>${m.loc}</td><td class="${ccC(m.cc)}">${m.cc} <span class="bar" style="width:${Math.min(60,m.cc*5)}px"></span></td><td class="${miC(m.mi)}">${m.mi}</td><td class="mono muted">${m.l}–${m.e}</td></tr>`).join('');
  return `<div class="scroll"><table><thead><tr><th>Methode</th><th>Sichtbar</th><th>LOC</th><th>CC</th><th>MI</th><th>Zeilen</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class=muted>Keine Methoden gefunden (z. B. Record, Enum oder Interface ohne Rumpf).</td></tr>'}</tbody></table></div>`;
}
/* Zustand und Navigation */
const S={id:D.start,line:null,group:null};
let cur='explorer';
function go(id,line){if(!byId[id])return;S.id=id;S.line=line||null;S.group=null;V[cur].sel&&V[cur].sel()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}});

/* ===== Variante A: Explorer ===== */
const TREE=LAYERS.map(L=>{const ts=T.filter(t=>lay(t)===L),m={};ts.forEach(t=>(m[t.ns]=m[t.ns]||[]).push(t));
  return{L,loc:ts.reduce((s,t)=>s+t.loc,0),n:ts.length,ns:Object.keys(m).sort().map(k=>({ns:k,ts:m[k].sort((a,b)=>a.name.localeCompare(b.name))}))}});
const A={open:new Set(['L:'+byId[D.start].project,'N:'+byId[D.start].ns,'T:'+D.start]),q:'',
 render(app){
  app.innerHTML=`<div class="va"><div class="card tree"><input class="srch" id="aq" placeholder="Typ oder Methode suchen …" aria-label="Suche" value="${esc(A.q)}"><div class="tree-b" id="atree"></div></div><div class="card det" id="adet"></div><div id="asrc" class="src"></div></div>`;
  document.getElementById('aq').oninput=e=>{A.q=e.target.value;A.tree()};
  document.getElementById('atree').onclick=e=>{const r=e.target.closest('.tr');if(!r)return;const k=r.dataset.k;
    if(k[0]==='M'){const [id,l]=k.slice(2).split('@');go(id,+l);return}
    if(k[0]==='T'){A.open.has(k)?A.open.delete(k):A.open.add(k);go(k.slice(2));A.tree();return}

  document.getElementById('adet').onclick=e=>{const r=e.target.closest('tr[data-m]');if(r){go(S.id,+r.dataset.m);return}const th=e.target.closest('th[data-s]');if(th){A.gs=th.dataset.s;A.group()}const mp=e.target.closest('[data-map]');if(mp){location.hash='map'}};

 },
 tree(){
  const q=A.q.trim().toLowerCase(),h=[],o=A.open,tm=t=>!q||t.name.toLowerCase().includes(q)||t.meths.some(m=>m.n.toLowerCase().includes(q));

    const lo=q||o.has('L:'+L.L);

    if(!lo)return;

      h.push(`<div class="tr l1${S.group&&S.group.k==='N'&&S.group.key===n.ns?' sel':''}" data-k="N:${n.ns}"><span class="car">${no?'▼':'▶'}</span><span class="nm">${esc(nsS(n.ns).replace(L.L+'.','').replace(L.L,'(Wurzel)'))}</span><span class="r">${n.ts.length}</span></div>`);
      if(!no)return;
      n.ts.forEach(t=>{const to=o.has('T:'+t.id)||(q&&t.meths.some(m=>m.n.toLowerCase().includes(q)));
        h.push(`<div class="tr l2${!S.group&&S.id===t.id&&!S.line?' sel':''}" data-k="T:${t.id}">${kiHtml(t)}<span class="nm">${esc(t.name)}</span><span class="r ${ccC(t.cc/Math.max(1,t.meths.length))}">${t.loc}</span></div>`);

 },

 gs:'loc',
 group(){
  const g=S.group;if(!g)return;const ts=g.k==='L'?T.filter(t=>lay(t)===g.key):T.filter(t=>t.ns===g.key);
  const col={name:(a,b)=>a.name.localeCompare(b.name),loc:(a,b)=>b.loc-a.loc,cc:(a,b)=>b.cc-a.cc,mi:(a,b)=>a.mi-b.mi,ce:(a,b)=>b.ce-a.ce,ca:(a,b)=>b.ca-a.ca};

   <div class="sec">Kennzahlen</div><div class="tiles"><div class="tile"><b>${ts.length}</b><small>Typen</small></div><div class="tile"><b>${ts.reduce((s,t)=>s+t.meths.length,0)}</b><small>Methoden</small></div><div class="tile"><b>${loc}</b><small>Codezeilen</small></div><div class="tile"><b>${cc}</b><small>Σ Komplexität</small></div><div class="tile"><b class="${miC(mi)}">${mi}</b><small>Ø Wartbarkeit</small></div><div class="tile"><b class="${un?'warn':'ok'}">${un}</b><small>ohne Testbezug</small></div></div>

 },

   <div class="sub">${esc(t.file)} · Zeilen ${t.l}–${t.e}</div>${t.doc?`<p>${esc(t.doc)}</p>`:''}
   ${t.bases.length?`<div class="sec">Basistypen und Schnittstellen</div>${t.bases.map(b=>byName[b]?typeLink(pick(b).id):`<span class="chip">${esc(b)}</span>`).join('')}`:''}
   <div class="sec">Kennzahlen</div>${metricTiles(t)}<p><button class="btn" data-map="1">Im Abhängigkeits-Graph zeigen</button></p><div class="sec">Methoden (${t.meths.length}) – Zeile anklicken zeigt den Quelltext</div>${methodTable(t,S.line)}${depChips(t)}`;
  srcView(document.getElementById('asrc'),t,m);
 }};

/* ===== Tab: Abhängigkeiten ===== */
const BANDS=D.bands;
const NS={},EDGES={};
T.forEach(t=>{const n=NS[t.ns]=NS[t.ns]||{ns:t.ns,L:lay(t),ts:[],loc:0};n.ts.push(t);n.loc+=t.loc});
T.forEach(t=>t.deps.forEach(d=>{const u=byId[d];if(u.ns===t.ns)return;const k=t.ns+'>'+u.ns;(EDGES[k]=EDGES[k]||{a:t.ns,b:u.ns,pairs:[]}).pairs.push([t.id,d])}));
const EL=Object.values(EDGES);
const OUT={},INN={};EL.forEach(e=>{(OUT[e.a]=OUT[e.a]||[]).push(e);(INN[e.b]=INN[e.b]||[]).push(e)});
const cyc=e=>!!EDGES[e.b+'>'+e.a],rank=ns=>D.rank[NS[ns].L],viol=e=>rank(e.a)>rank(e.b);
const G={mode:'ns',ns:null,focus:null,depth:1,all:false,
 render(app){
  if(!G.ns)G.ns=byId[S.id].ns;if(!G.focus)G.focus=S.id;
  app.innerHTML=`<div class="gv"><div><div class="ctl"><div class="seg" id="gmode" role="group" aria-label="Ansicht"><button data-mode="ns" aria-pressed="${G.mode==='ns'}">Namespaces</button><button data-mode="type" aria-pressed="${G.mode==='type'}">Typ im Fokus</button></div><span id="gctl"></span></div><div class="card scroll" id="gsvg" style="padding:6px"></div><div class="legend" id="gleg"></div></div><div class="card" id="gpanel" style="padding:12px 14px;max-height:calc(100vh - 150px);overflow:auto"></div></div>`;
  document.getElementById('gmode').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){G.mode=b.dataset.mode;G.render(app)}};
  G.draw();
 },
 sel(){if(G.mode==='ns')G.ns=byId[S.id].ns;G.focus=S.id;G.draw()},
 draw(){G.mode==='ns'?G.drawNs():G.drawType()},
 drawNs(){
  const wrap=document.getElementById('gsvg'),W=Math.max(560,wrap.clientWidth-14),NW=176,NH=26,GX=8,LBL=Math.max(104,Math.max(...BANDS.map(b=>b.length))*7+26),cols=Math.max(1,Math.floor((W-LBL-8)/(NW+GX)));
  const pos={};let y=0;const bands=[];
  BANDS.forEach(L=>{const ns=Object.keys(NS).filter(k=>NS[k].L===L).sort(),rows=Math.ceil(ns.length/cols)||1,h=rows*(NH+8)+12;bands.push({L,y,h});
    ns.forEach((k,i)=>{pos[k]={x:LBL+(i%cols)*(NW+GX),y:y+8+Math.floor(i/cols)*(NH+8)}});y+=h+10});
  const H=y,sel=G.ns,nb=new Set([sel]);(OUT[sel]||[]).forEach(e=>nb.add(e.b));(INN[sel]||[]).forEach(e=>nb.add(e.a));
  const cx=k=>pos[k].x+NW/2;
  const path=(e)=>{const a=pos[e.a],b=pos[e.b];let x1=cx(e.a),x2=cx(e.b),y1,y2,d;
    if(Math.abs(a.y-b.y)<2){y1=a.y;y2=b.y;const m=Math.min(60,20+Math.abs(x1-x2)/6);d=`M${x1},${y1} C${x1},${y1-m} ${x2},${y2-m} ${x2},${y2}`}
    else{const down=b.y>a.y;y1=a.y+(down?NH:0);y2=b.y+(down?0:NH);const m=Math.abs(y2-y1)/2;d=`M${x1},${y1} C${x1},${y1+(down?m:-m)} ${x2},${y2+(down?-m:m)} ${x2},${y2}`}return d};
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Namespace-Abhängigkeiten"><defs><marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--imp)"/></marker><marker id="au" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--use)"/></marker></defs>`;
  bands.forEach(b=>{svg+=`<rect x="0" y="${b.y}" width="${W}" height="${b.h}" rx="6" fill="var(--surface2)" opacity=".55"/><rect x="0" y="${b.y}" width="5" height="${b.h}" fill="var(--l-${sl(b.L)})"/><text x="14" y="${b.y+22}" style="font-family:var(--f-d);font-weight:700;font-size:14px">${b.L}</text>`});
  if(G.all)EL.forEach(e=>{svg+=`<path d="${path(e)}" fill="none" stroke="var(--muted)" stroke-width="${Math.min(3,.6+Math.sqrt(e.pairs.length)*.4)}" opacity=".16"/>`});
  EL.forEach(e=>{if(e.a!==sel&&e.b!==sel)return;const o=e.a===sel;svg+=`<path d="${path(e)}" fill="none" stroke="${o?'var(--imp)':'var(--use)'}" stroke-width="${1.2+Math.sqrt(e.pairs.length)*.7}" opacity=".85" marker-end="url(#${o?'ao':'au'})" ${cyc(e)?'stroke-dasharray="5 3"':''}><title>${esc(nsS(e.a))} → ${esc(nsS(e.b))}: ${e.pairs.length} Verweise</title></path>`});
  Object.keys(NS).forEach(k=>{const p=pos[k],n=NS[k],dim=!nb.has(k),lab=nsS(k).replace(n.L+'.','').replace(n.L,'(Wurzel)');
    svg+=`<g data-nsn="${k}" style="cursor:pointer" opacity="${dim?.4:1}"><title>${esc(nsS(k))} · ${n.ts.length} Typen · ${n.loc} LOC</title><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="5" fill="var(--surface)" stroke="${k===sel?'var(--yellow)':'var(--l-'+sl(n.L)+')'}" stroke-width="${k===sel?3:1.3}"/><text x="${p.x+8}" y="${p.y+17}">${esc(lab.length>24?lab.slice(0,23)+'…':lab)}</text><text x="${p.x+NW-8}" y="${p.y+17}" text-anchor="end" style="fill:var(--muted)">${n.ts.length}</text></g>`});

  const nc=EL.filter(e=>cyc(e)&&e.a<e.b).length,nv=EL.filter(viol).length;
  document.getElementById('gctl').innerHTML=`<label class="muted"><input type="checkbox" id="gall" ${G.all?'checked':''}> alle Verbindungen schwach einblenden</label>`;
  document.getElementById('gall').onchange=e=>{G.all=e.target.checked;G.drawNs()};
  document.getElementById('gleg').innerHTML=`<span><span class="sw" style="border-color:var(--imp)"></span> Auswahl nutzt</span><span><span class="sw" style="border-color:var(--use)"></span> nutzt die Auswahl</span><span>gestrichelt = gegenseitig (Zyklus)</span><span>Zahl im Kasten = Typen</span><span>Gesamt: ${Object.keys(NS).length} Namespaces, ${EL.length} Verbindungen, ${nc} gegenseitige Paare, ${nv} Verbindungen entgegen der Schichtung</span>`;

 },
 panelNs(){
  const n=NS[G.ns],o=(OUT[G.ns]||[]).slice().sort((a,b)=>b.pairs.length-a.pairs.length),i=(INN[G.ns]||[]).slice().sort((a,b)=>b.pairs.length-a.pairs.length);
  const row=(e,other,cls)=>{const t=byId[e.pairs[0][0]];return `<details><summary><span class="dot" style="color:var(--l-${sl(NS[other].L)})"></span> ${esc(nsS(other))} <b>${e.pairs.length}</b>${cyc(e)?' <span class="pill bad">Zyklus</span>':''}${viol(e)?' <span class="pill warn">gegen Schichtung</span>':''}</summary><div class="pairs">${e.pairs.slice(0,40).map(p=>`<div class="mono"><a data-focus="${p[0]}" class="chip ${cls}">${esc(sn(p[0]))}</a> → <a data-focus="${p[1]}" class="chip ${cls}">${esc(sn(p[1]))}</a></div>`).join('')}${e.pairs.length>40?`<div class="muted">… und ${e.pairs.length-40} weitere</div>`:''}</div></details>`};
  const inst=(o.length+i.length)?o.length/(o.length+i.length):0;
  const el=document.getElementById('gpanel');
  el.innerHTML=`<div class="sub muted mono">${n.L}</div><h3 style="font-size:22px;overflow-wrap:anywhere">${esc(nsS(n.ns))}</h3>
   <div class="tiles" style="margin-top:8px"><div class="tile"><b>${n.ts.length}</b><small>Typen</small></div><div class="tile"><b>${n.loc}</b><small>Codezeilen</small></div><div class="tile"><b>${o.length}</b><small>nutzt Namespaces</small></div><div class="tile"><b>${i.length}</b><small>genutzt von</small></div><div class="tile"><b class="${inC(inst)}">${inst.toFixed(2)}</b><small>Instabilität</small></div></div>
   <div class="sec" style="color:var(--imp)">Nutzt (${o.length}) – aufklappen zeigt die Typpaare</div>${o.map(e=>row(e,e.b,'imp')).join('')||'<span class="muted">keine</span>'}
   <div class="sec" style="color:var(--use)">Wird genutzt von (${i.length})</div>${i.map(e=>row(e,e.a,'use')).join('')||'<span class="muted">keine</span>'}
   <div class="sec">Typen (${n.ts.length})</div><div>${n.ts.slice().sort((a,b)=>b.loc-a.loc).map(t=>`<a class="chip" data-focus="${t.id}">${esc(t.name)}</a>`).join('')}</div>`;
  el.onclick=e=>{const f=e.target.closest('[data-focus]');if(f){e.preventDefault();G.focus=f.dataset.focus;G.mode='type';G.render(document.getElementById('app'))}};
 },
 drawType(){
  const wrap=document.getElementById('gsvg'),f=byId[G.focus],max=30;
  const cols={0:[f.id]},seen=new Set([f.id]);
  const grow=(from,dir)=>{const r=[];from.forEach(id=>(dir<0?users[id]||[]:byId[id].deps).forEach(x=>{if(!seen.has(x)){seen.add(x);r.push(x)}}));return r.sort()};
  cols[-1]=grow([f.id],-1);cols[1]=grow([f.id],1);
  if(G.depth>1){cols[-2]=grow(cols[-1],-1);cols[2]=grow(cols[1],1)}
  const cs=G.depth>1?[-2,-1,0,1,2]:[-1,0,1],NW=164,GX=56,R=26,rows=Math.max(...cs.map(c=>Math.min(max+1,(cols[c]||[]).length)),1),H=rows*R+50,W=cs.length*NW+(cs.length-1)*GX+20;
  const xs=c=>10+cs.indexOf(c)*(NW+GX),ys=(c,i)=>40+i*R,P={};
  cs.forEach(c=>(cols[c]||[]).slice(0,max).forEach((id,i)=>P[id]={c,x:xs(c),y:ys(c,i)}));
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Typ-Abhängigkeiten">`;
  const names={'-2':'Nutzer der Nutzer','-1':'Nutzt den Typ','0':'Fokus','1':'Wird genutzt','2':'Abhängigkeiten der Abhängigkeiten'};
  cs.forEach(c=>{const n=(cols[c]||[]).length;svg+=`<text x="${xs(c)}" y="16" style="fill:var(--muted);font-weight:600">${names[c]} (${n})</text>`;if(n>max)svg+=`<text x="${xs(c)}" y="${H-6}" style="fill:var(--muted)">+ ${n-max} weitere</text>`});
  Object.keys(P).forEach(a=>byId[a].deps.forEach(b=>{if(!P[b]||P[b].c!==P[a].c+1)return;const A_=P[a],B_=P[b],x1=A_.x+NW,y1=A_.y+11,x2=B_.x,y2=B_.y+11,m=(x1+x2)/2,foc=a===f.id||b===f.id,col=b===f.id?'var(--use)':a===f.id?'var(--imp)':'var(--muted)';

  document.getElementById('gq').onchange=e=>{const t=byName[e.target.value];if(t){G.focus=t[0].id;G.drawType()}};
  document.getElementById('gdep').onclick=e=>{const b=e.target.closest('[data-d]');if(b){G.depth=+b.dataset.d;G.drawType()}};

  document.getElementById('gpanel').innerHTML=`<div class="sub muted mono">${esc(nsS(f.ns))} · ${lay(f)}</div><h3 style="font-size:22px">${esc(f.name)} <span class="pill">${f.kind}</span></h3>${f.doc?`<p>${esc(f.doc)}</p>`:''}${metricTiles(f)}<p><a class="btn" href="#explorer" data-open="${f.id}" style="text-decoration:none;display:inline-block;margin-top:10px">Im Explorer öffnen</a> <button class="btn" data-nsjump="${f.ns}">Namespace im Graph</button></p>${depChips(f).replace(/data-go=/g,'data-fo2=')}`;
  const pn=document.getElementById('gpanel');pn.onclick=e=>{const o=e.target.closest('[data-open]');if(o){go(o.dataset.open);return}const j=e.target.closest('[data-nsjump]');if(j){G.ns=j.dataset.nsjump;G.mode='ns';G.render(document.getElementById('app'));return}const c=e.target.closest('[data-fo2]');if(c){e.preventDefault();G.focus=c.dataset.fo2;G.drawType()}};
 }};

/* ===== Start ===== */
const V={explorer:A,map:G},NAMES={explorer:['Explorer','Namespaces, Klassen, Methoden, Quelltext'],map:['Abhängigkeiten','Karte der Verbindungen']};
