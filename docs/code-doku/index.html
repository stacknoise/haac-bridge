*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;border-bottom:3px solid var(--yellow);margin-bottom:12px}
.brand{font:700 20px/1 var(--f-d);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--accent)} .brand small{font:500 12px var(--f-b);color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;text-align:left;min-width:0}
.tab span{font:600 14px var(--f-d)} .tab small{color:var(--muted);font-size:11px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .tab[aria-selected=true] small{color:inherit;opacity:.85}
.note{margin-left:auto;font-size:12px;color:var(--muted);max-width:420px}
.app{min-height:200px}
h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance}
.mono{font-family:var(--f-m);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--surface2);white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin:0 4px 4px 0;font:500 12px var(--f-m);background:var(--surface);cursor:pointer;text-decoration:none;max-width:100%}
.chip:hover{border-color:var(--accent)}
.chip.imp{border-left:4px solid var(--imp)} .chip.use{border-left:4px solid var(--use)}
.chip i{font-style:normal;color:var(--muted);font-size:10px}

tr[data-m]{cursor:pointer} tr.cur{background:var(--hl-m)}
.bar{display:inline-block;height:6px;border-radius:3px;background:currentColor;vertical-align:middle;min-width:2px}
.scroll{overflow:auto}
/* Quelltext */
.src{display:flex;flex-direction:column;min-height:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.src-h{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--surface);font:12px var(--f-m);flex-wrap:wrap}
.code{overflow:auto;position:relative;flex:1;min-height:160px;font:12px/1.55 var(--f-m);padding-block:6px}
.ln{display:grid;grid-template-columns:48px 1fr;min-width:max-content} .ln b{font-weight:400;color:var(--sc);text-align:right;padding-right:12px;user-select:none;opacity:.7} .ln>span{white-space:pre;padding-right:16px}
.ln.it{background:var(--hl-t)} .ln.im{background:var(--hl-m)}
.k{color:var(--sk)} .s{color:var(--ss)} .c,.cd{color:var(--sc);font-style:italic} .n{color:var(--sn)} .tl{color:var(--st);cursor:pointer;text-decoration:none} .tl:hover{text-decoration:underline}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;min-height:120px}
/* A: Explorer */
.va{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1.05fr) minmax(0,1.2fr);gap:12px;height:calc(100vh - 110px);min-height:520px}
.va>*{min-height:0;min-width:0}
.tree{display:flex;flex-direction:column;overflow:hidden}
.tree input,.srch{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 12px;font:13px var(--f-b);outline-offset:-2px}
.tree-b{overflow:auto;flex:1;padding:4px 0}
.tr{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-size:13px}
.tr:hover{background:var(--surface2)} .tr.sel{background:var(--hl-m)}
.tr .car{width:10px;color:var(--muted);font-size:9px;flex:none} .tr .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tr .r{color:var(--muted);font:11px var(--f-m)}
.tr.l0{font:600 13px var(--f-d);padding-top:6px} .tr.l1{padding-left:22px;color:var(--muted)} .tr.l2{padding-left:36px} .tr.l3{padding-left:56px;font:12px var(--f-m)}
.ki{display:inline-block;vertical-align:middle;width:16px;height:16px;border-radius:3px;font:700 10px/16px var(--f-m);text-align:center;color:#fff;flex:none}
.det{overflow:auto;padding:14px 16px}
.det h2{font-size:26px;overflow-wrap:anywhere} .det .sub{font:12px var(--f-m);color:var(--muted);overflow-wrap:anywhere}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-right:1px solid var(--line);font-size:12px} .seg button:last-child{border:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.legend{display:flex;align-items:center;gap:6px 16px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:3px solid;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 9px;font-size:12px} .btn:hover{border-color:var(--accent)}
svg text{font-family:var(--f-m);font-size:11px;fill:var(--ink)}
.gv{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px;align-items:start}
.gv details{border-bottom:1px solid var(--line);padding:3px 0} .gv summary{cursor:pointer;font-size:13px} .gv .pairs{padding:4px 0 6px 16px}

<script type="application/json" id="files">{"custom_components/haac_bridge/__init__.py":"\"\"\"HAAC Bridge: per-user entity exposure for the HA Android Client (concept 10).\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\nfrom homeassistant.auth import EVENT_USER_ADDED, EVENT_USER_REMOVED, EVENT_USER_UPDATED\nfrom homeassistant.config_entries import SOURCE_IMPORT, ConfigEntry\nfrom homeassistant.const import EVENT_HOMEASSISTANT_STOP, EVENT_STATE_CHANGED, Platform\nfrom homeassistant.core import (\n    Event,\n    EventStateChangedData,\n    HomeAssistant,\n    ServiceCall,\n    callback,\n    split_entity_id,\n)\nfrom homeassistant.helpers import entity_registry as er\nfrom homeassistant.helpers.dispatcher import async_dispatcher_send\nfrom homeassistant.helpers.reload import async_integration_yaml_config\nfrom homeassistant.helpers.service import async_register_admin_service\nfrom homeassistant.helpers.start import async_at_started\nfrom homeassistant.helpers.typing import ConfigType\nfrom homeassistant.loader import async_get_integration\n\nfrom .api import COMMANDS\nfrom .audit.factory import AuditEntryFactory\nfrom .audit.levels import merge_settings\nfrom .audit.log import AuditLog\nfrom .config.repairs import async_check_users, async_report_invalid_config\nfrom .config.schema import CONFIG_SCHEMA, parse_users\nfrom .config.ui_users import parse_ui_users, users_of\nfrom .const import (\n    API_VERSION,\n    CONF_LOGGING,\n    CONF_USER_ID,\n    CONF_USERS,\n    DOMAIN,\n    FEATURES,\n    SERVICE_RELOAD,\n    SIGNAL_EXPOSURE_CHANGED,\n    SUPPORTED_DOMAINS,\n)\nfrom .core.command import async_register_commands\nfrom .core.errors import ConfigError, ErrorCode\nfrom .core.runtime import DATA_KEY, HaacBridgeData, get_data\nfrom .disabling.manager import async_sweep as async_sweep_disabled\nfrom .disabling.store import DisabledStore\nfrom .entities.descriptor_factory import DescriptorFactory\nfrom .exposure.exposure import Exposure\nfrom .exposure.filter_factory import FilterFactory\nfrom .exposure.own_entities import own_entity_checker\nfrom .schedules.entities import ScheduleEntityManager\nfrom .schedules.manager import ScheduleManager\nfrom .schedules.runtime import HaacBridgeConfigEntry\nfrom .services.call_factory import ServiceCallFactory\n\n__all__ = [\"CONFIG_SCHEMA\", \"DOMAIN\"]\n\nPLATFORMS = [Platform.SWITCH, Platform.SENSOR]\n\"\"\"Platforms that carry the entities of the schedules (concept 19.5).\"\"\"\n\n\nasync def async_setup(hass: HomeAssistant, config: ConfigType) -> bool:\n    \"\"\"Create the factories and exposure, register the commands and the reload action.\"\"\"\n    integration = await async_get_integration(hass, DOMAIN)\n    filters = FilterFactory()\n    entries = parse_users(config)\n    yaml_logging = _logging_of(config)\n    disabled = DisabledStore(hass)\n    await disabled.async_load()\n    schedules = ScheduleManager(hass)\n    data = HaacBridgeData(\n        version=str(integration.version),\n        filters=filters,\n        descriptors=DescriptorFactory(hass),\n        services=ServiceCallFactory(hass),\n        exposure=Exposure(entries, filters, own_entity_checker(hass)),\n        schedules=schedules,\n        disabled=disabled,\n        run_log=schedules.run_log,\n        yaml_entries=entries,\n        yaml_logging=yaml_logging,\n        audit=AuditLog(hass),\n        audit_entries=AuditEntryFactory(),\n    )\n    data.audit.configure(merge_settings(yaml_logging, None))\n    hass.data[DATA_KEY] = data\n    await async_check_users(hass, data.issue_ids, entries, entries)\n    async_register_commands(hass, COMMANDS)\n    await _async_start_schedules(hass, data.schedules)\n    _async_listen_to_user_events(hass)\n    _async_follow_exposure_inputs(hass)\n    if DOMAIN in config and not hass.config_entries.async_entries(DOMAIN):\n        hass.async_create_task(\n            hass.config_entries.flow.async_init(DOMAIN, context={\"source\": SOURCE_IMPORT}, data={})\n        )\n\n    async def _async_reload(call: ServiceCall) -> None:\n        \"\"\"Handle the haac_bridge.reload action.\"\"\"\n        await async_reload(hass)\n\n    async_register_admin_service(hass, DOMAIN, SERVICE_RELOAD, _async_reload)\n    return True\n\n\ndef _logging_of(config: ConfigType) -> dict[str, Any]:\n    \"\"\"Return the `logging` block of a validated configuration; empty if the section is missing.\"\"\"\n    section: dict[str, Any] = config.get(DOMAIN) or {}\n    return dict(section.get(CONF_LOGGING) or {})\n\n\ndef _async_apply_logging(hass: HomeAssistant, options: Mapping[str, Any] | None) -> None:\n    \"\"\"Apply the log level and the Activity switch from the YAML block and the entry options (concept 21.2).\"\"\"\n    data = get_data(hass)\n    settings = merge_settings(data.yaml_logging, (options or {}).get(CONF_LOGGING))\n    if settings != data.audit.settings:\n        data.audit.record(\n            data.audit_entries.config_changed(\n                what=\"logging\", level=settings.level.value, activity=settings.activity\n            )\n        )\n    data.audit.configure(settings)\n\n\nasync def _async_start_schedules(hass: HomeAssistant, schedules: ScheduleManager) -> None:\n    \"\"\"Load the schedules, plan them once HA has started and cancel the timers when it stops.\"\"\"\n    await schedules.async_load()\n\n    async def _start(_hass: HomeAssistant) -> None:\n        \"\"\"Plan every schedule once Home Assistant is running.\"\"\"\n        await schedules.async_start()\n\n    async_at_started(hass, _start)\n\n    @callback\n    def _stop(_event: Event) -> None:\n        \"\"\"Cancel all schedule timers when Home Assistant stops.\"\"\"\n        schedules.async_stop()\n\n    hass.bus.async_listen_once(EVENT_HOMEASSISTANT_STOP, _stop)\n\n\ndef _async_follow_exposure_inputs(hass: HomeAssistant) -> None:\n    \"\"\"Clear the caches of the exposure when users, the entity registry or the set of entities change.\n\n    The listeners are callbacks, so they run before any task that reacts to the same event.\n    \"\"\"\n\n    @callback\n    def _users_changed(_event: Event) -> None:\n        \"\"\"A HA user was added, changed or removed.\"\"\"\n        get_data(hass).exposure.async_invalidate_users()\n\n    @callback\n    def _registry_changed(_event: Event) -> None:\n        \"\"\"An entity was created, removed or changed in the entity registry.\"\"\"\n        get_data(hass).exposure.async_invalidate_registry()\n\n    @callback\n    def _added_or_removed(event_data: EventStateChangedData) -> bool:\n        \"\"\"Return True for an entity of a v1 domain that appeared or disappeared.\"\"\"\n        return (\n            event_data[\"old_state\"] is None or event_data[\"new_state\"] is None\n        ) and split_entity_id(event_data[\"entity_id\"])[0] in SUPPORTED_DOMAINS\n\n    @callback\n    def _states_changed(_event: Event[EventStateChangedData]) -> None:\n        \"\"\"An entity appeared in or left the state machine.\"\"\"\n        get_data(hass).exposure.async_invalidate_states()\n\n    for event_type in (EVENT_USER_ADDED, EVENT_USER_UPDATED, EVENT_USER_REMOVED):\n        hass.bus.async_listen(event_type, _users_changed)\n    hass.bus.async_listen(er.EVENT_ENTITY_REGISTRY_UPDATED, _registry_changed)\n    hass.bus.async_listen(EVENT_STATE_CHANGED, _states_changed, event_filter=_added_or_removed)\n\n\ndef _async_listen_to_user_events(hass: HomeAssistant) -> None:\n    \"\"\"Follow the deletion and the change of HA users with their schedules (concept 19.6).\"\"\"\n\n    async def _removed(event: Event) -> None:\n        \"\"\"A HA user was deleted: delete their schedules and their UI entry.\"\"\"\n        await _async_user_removed(hass, event.data[\"user_id\"])\n\n    async def _updated(event: Event) -> None:\n        \"\"\"A HA user changed: pause their schedules if they are inactive, resume them otherwise.\"\"\"\n        await get_data(hass).schedules.async_sweep(event.data[\"user_id\"])\n\n    hass.bus.async_listen(EVENT_USER_REMOVED, _removed)\n    hass.bus.async_listen(EVENT_USER_UPDATED, _updated)\n\n\nasync def _async_user_removed(hass: HomeAssistant, user_id: str) -> None:\n    \"\"\"Delete the schedules and the UI entry of a deleted HA user (concept 19.6.1).\n\n    A YAML entry of that user cannot be edited; applying the configuration again reports it as HAB-CFG-002.\n    \"\"\"\n    await get_data(hass).schedules.async_remove_owner(user_id)\n    await get_data(hass).disabled.async_forget_user(user_id)\n    entry = next(iter(hass.config_entries.async_entries(DOMAIN)), None)\n    records = users_of(entry.options) if entry else []\n    if entry is None or not any(record[CONF_USER_ID] == user_id for record in records):\n        await _async_apply(hass)\n        return\n    remaining = [record for record in records if record[CONF_USER_ID] != user_id]\n    hass.config_entries.async_update_entry(entry, options={**entry.options, CONF_USERS: remaining})\n\n\nasync def async_reload(hass: HomeAssistant) -> None:\n    \"\"\"Re-read the YAML configuration and rebuild the exposure of all users.\"\"\"\n    data = get_data(hass)\n    config = await async_integration_yaml_config(hass, DOMAIN)\n    if config is None:\n        async_report_invalid_config(hass, data.issue_ids)\n        raise ConfigError(ErrorCode.CFG_INVALID)\n    data.yaml_entries = parse_users(config)\n    data.yaml_logging = _logging_of(config)\n    entry = next(iter(hass.config_entries.async_entries(DOMAIN)), None)\n    _async_apply_logging(hass, entry.options if entry else None)\n    await _async_apply(hass)\n    data.audit.record(\n        data.audit_entries.config_changed(\n            what=\"reload\", users=len(data.yaml_entries) + len(data.ui_entries)\n        )\n    )\n\n\nasync def _async_apply(hass: HomeAssistant, *, sweep: bool = True) -> None:\n    \"\"\"Rebuild the exposure from the YAML and UI entries and tell connected apps.\n\n    YAML entries come first, so a user who is configured in both places gets the YAML entry (concept 10.2).\n    With `sweep`, schedules of users who are no longer configured are deleted (concept 19.6.3).\n    \"\"\"\n    data = get_data(hass)\n    entries = [*data.yaml_entries, *data.ui_entries]\n    data.exposure = Exposure(entries, data.filters, own_entity_checker(hass))\n    await async_check_users(hass, data.issue_ids, entries, data.yaml_entries)\n    if sweep:\n        await data.schedules.async_sweep()\n        await async_sweep_disabled(hass)\n    async_dispatcher_send(hass, SIGNAL_EXPOSURE_CHANGED)\n\n\nasync def async_setup_entry(hass: HomeAssistant, entry: HaacBridgeConfigEntry) -> bool:\n    \"\"\"Take over the UI users, follow option changes and create the entities of the schedules.\"\"\"\n    data = get_data(hass)\n    data.ui_entries = parse_ui_users(entry.options)\n    _async_apply_logging(hass, entry.options)\n    data.schedules.users_ready = True\n    await _async_apply(hass)\n    entry.runtime_data = ScheduleEntityManager(hass, data.schedules, entry)\n    entry.runtime_data.async_sweep()\n    await hass.config_entries.async_forward_entry_setups(entry, PLATFORMS)\n    entry.async_on_unload(entry.add_update_listener(_async_options_updated))\n    data.schedules.runner.async_run_deferred()\n    data.audit.record(\n        data.audit_entries.startup(\n            version=data.version,\n            api_version=API_VERSION,\n            features=\",\".join(FEATURES),\n            users=len(data.yaml_entries) + len(data.ui_entries),\n            schedules=len(data.schedules.store.schedules),\n        )\n    )\n    return True\n\n\nasync def _async_options_updated(hass: HomeAssistant, entry: ConfigEntry) -> None:\n    \"\"\"Apply changed options of the entry without reloading the integration.\"\"\"\n    data = get_data(hass)\n    data.ui_entries = parse_ui_users(entry.options)\n    _async_apply_logging(hass, entry.options)\n    await _async_apply(hass)\n    data.audit.record(data.audit_entries.config_changed(what=\"options\", users=len(data.ui_entries)))\n\n\nasync def async_unload_entry(hass: HomeAssistant, entry: HaacBridgeConfigEntry) -> bool:\n    \"\"\"Unload the schedule entities and drop the UI users; the YAML users stay.\"\"\"\n    if not await hass.config_entries.async_unload_platforms(entry, PLATFORMS):\n        return False\n    data = get_data(hass)\n    data.schedules.users_ready = False\n    data.ui_entries = []\n    await _async_apply(hass, sweep=False)\n    return True\n\n\nasync def async_remove_entry(hass: HomeAssistant, entry: ConfigEntry) -> None:\n    \"\"\"Delete all schedules and their storage file when the entry is removed (concept 19.6).\"\"\"\n    await get_data(hass).schedules.async_wipe()\n","custom_components/haac_bridge/api/__init__.py":"\"\"\"The haac_bridge/* WebSocket commands, one module per command group (concept 11.2).\"\"\"\n\nfrom .areas import ws_areas\nfrom .entities import ws_entities_list, ws_entities_set_disabled, ws_subscribe_entities\nfrom .exposure import ws_exposure_revision\nfrom .history import ws_history, ws_statistics\nfrom .info import ws_info\nfrom .schedules import (\n    ws_schedules_create,\n    ws_schedules_delete,\n    ws_schedules_list,\n    ws_schedules_preview,\n    ws_schedules_revision,\n    ws_schedules_run_now,\n    ws_schedules_runs,\n    ws_schedules_skip_run,\n    ws_schedules_update,\n    ws_subscribe_schedules,\n)\nfrom .services import ws_call_service\n\nCOMMANDS = (\n    ws_info,\n    ws_exposure_revision,\n    ws_entities_list,\n    ws_entities_set_disabled,\n    ws_subscribe_entities,\n    ws_call_service,\n    ws_history,\n    ws_statistics,\n    ws_areas,\n    ws_schedules_revision,\n    ws_schedules_list,\n    ws_schedules_create,\n    ws_schedules_update,\n    ws_schedules_delete,\n    ws_schedules_run_now,\n    ws_schedules_preview,\n    ws_schedules_runs,\n    ws_schedules_skip_run,\n    ws_subscribe_schedules,\n)\n","custom_components/haac_bridge/api/areas.py":"\"\"\"Command haac_bridge/areas (concept 6.3, 11.2).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\n\nfrom ..areas.catalog import area_catalog\nfrom ..core.caller import require_user\nfrom ..core.command import bridge_command\nfrom ..core.runtime import get_data\n\n\n@bridge_command(\"haac_bridge/areas\")\nasync def ws_areas(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the HA floors and areas that hold entities exposed to the caller.\"\"\"\n    snapshot = get_data(hass).exposure.snapshot(hass, require_user(connection))\n    return area_catalog(hass, snapshot.entity_ids)\n","custom_components/haac_bridge/api/entities.py":"\"\"\"Commands haac_bridge/entities/list, entities/set_disabled and subscribe_entities (concept 7.5, 11.2, 11.3).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport homeassistant.helpers.config_validation as cv\nimport voluptuous as vol\n\nfrom ..core.caller import require_user\nfrom ..core.command import SubscriptionStarted, bridge_command\nfrom ..core.runtime import get_data\nfrom ..disabling.manager import async_set_disabled\nfrom ..entities.subscription import EntitySubscription\n\n\n@bridge_command(\"haac_bridge/entities/list\")\nasync def ws_entities_list(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the revision and the descriptors of all entities exposed to the caller, with `disabled`.\"\"\"\n    data = get_data(hass)\n    user = require_user(connection)\n    snapshot = data.exposure.snapshot(hass, user)\n    deactivated = data.disabled.entities_of(user.id)\n    descriptors = data.descriptors.create_many(snapshot.entity_ids, snapshot.names)\n    return {\n        \"revision\": snapshot.revision,\n        \"entities\": [\n            {**descriptor, \"disabled\": descriptor[\"entity_id\"] in deactivated}\n            for descriptor in descriptors\n        ],\n    }\n\n\n@bridge_command(\n    \"haac_bridge/entities/set_disabled\",\n    {vol.Required(\"entity_id\"): cv.entity_id, vol.Required(\"disabled\"): bool},\n)\nasync def ws_entities_set_disabled(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Deactivate or activate an exposed entity for the caller; reply with their list and the schedules changed.\"\"\"\n    return await async_set_disabled(\n        hass, require_user(connection), msg[\"entity_id\"], disabled=msg[\"disabled\"]\n    )\n\n\n@bridge_command(\"haac_bridge/subscribe_entities\")\nasync def ws_subscribe_entities(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> SubscriptionStarted:\n    \"\"\"Subscribe to the live states of the caller's exposed entities.\"\"\"\n    subscription = EntitySubscription(hass, connection, msg[\"id\"], require_user(connection))\n    initial = subscription.async_start()\n    connection.subscriptions[msg[\"id\"]] = subscription.async_stop\n    return SubscriptionStarted(initial)\n","custom_components/haac_bridge/api/exposure.py":"\"\"\"Command haac_bridge/exposure/revision (concept 11.2).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\n\nfrom ..core.caller import require_user\nfrom ..core.command import bridge_command\nfrom ..core.runtime import get_data\n\n\n@bridge_command(\"haac_bridge/exposure/revision\")\nasync def ws_exposure_revision(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the revision hash and entity count of the caller's exposed set.\"\"\"\n    snapshot = get_data(hass).exposure.snapshot(hass, require_user(connection))\n    return {\"revision\": snapshot.revision, \"entity_count\": len(snapshot.entity_ids)}\n","custom_components/haac_bridge/api/history.py":"\"\"\"Commands haac_bridge/history and haac_bridge/statistics (concept 10.3, 11.2).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport homeassistant.helpers.config_validation as cv\nimport voluptuous as vol\n\nfrom ..const import MAX_HISTORY_ENTITIES\nfrom ..core.caller import require_user\nfrom ..core.command import bridge_command\nfrom ..core.runtime import get_data\nfrom ..history.queries import (\n    PERIODS,\n    STATISTIC_TYPES,\n    TimeRange,\n    async_history,\n    async_statistics,\n    utc_datetime,\n)\n\nPERIOD_FIELDS = {\n    vol.Required(\"entity_ids\"): vol.All(\n        cv.ensure_list, [cv.entity_id], vol.Length(max=MAX_HISTORY_ENTITIES)\n    ),\n    vol.Required(\"start\"): utc_datetime,\n    vol.Optional(\"end\"): utc_datetime,\n}\n\n\ndef _exposed_request(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> tuple[list[str], TimeRange]:\n    \"\"\"Return the requested entities the caller may see (none for a future period) and the period.\"\"\"\n    period = TimeRange(msg[\"start\"], msg.get(\"end\"))\n    user = require_user(connection)\n    if period.in_future:\n        return [], period\n    return get_data(hass).exposure.filter_exposed(user, msg[\"entity_ids\"]), period\n\n\n@bridge_command(\n    \"haac_bridge/history\",\n    {**PERIOD_FIELDS, vol.Optional(\"minimal_response\", default=False): bool},\n)\nasync def ws_history(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the state history of the requested entities that are exposed to the caller.\"\"\"\n    entity_ids, period = _exposed_request(hass, connection, msg)\n    if not entity_ids:\n        return {}\n    return await async_history(hass, entity_ids, period, msg[\"minimal_response\"])\n\n\n@bridge_command(\n    \"haac_bridge/statistics\",\n    {\n        **PERIOD_FIELDS,\n        vol.Optional(\"period\", default=\"hour\"): vol.In(PERIODS),\n        vol.Optional(\"types\", default=list(STATISTIC_TYPES)): vol.All(\n            cv.ensure_list, [vol.In(STATISTIC_TYPES)]\n        ),\n    },\n)\nasync def ws_statistics(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return long-term statistics of the requested entities that are exposed to the caller.\"\"\"\n    entity_ids, period = _exposed_request(hass, connection, msg)\n    if not entity_ids:\n        return {}\n    return await async_statistics(hass, entity_ids, period, msg[\"period\"], msg[\"types\"])\n","custom_components/haac_bridge/api/info.py":"\"\"\"Command haac_bridge/info (concept 11.2, 11.4).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.const import __version__ as HA_VERSION\nfrom homeassistant.core import HomeAssistant\n\nfrom ..const import API_VERSION, FEATURES, SUPPORTED_DOMAINS\nfrom ..core.caller import require_user\nfrom ..core.command import bridge_command\nfrom ..core.runtime import get_data\nfrom ..instance.addresses import async_instance_identity\n\n\n@bridge_command(\"haac_bridge/info\")\nasync def ws_info(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return bridge, API and HA version, supported domains, instance ID and addresses.\"\"\"\n    require_user(connection)\n    return {\n        \"bridge_version\": get_data(hass).version,\n        \"api_version\": API_VERSION,\n        \"domains\": list(SUPPORTED_DOMAINS),\n        \"features\": list(FEATURES),\n        \"ha_version\": HA_VERSION,\n        **await async_instance_identity(hass),\n    }\n","custom_components/haac_bridge/api/schedules.py":"\"\"\"Commands haac_bridge/schedules/* and haac_bridge/subscribe_schedules (concept 11.2, 19.4).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport voluptuous as vol\n\nfrom ..audit.client import CLIENT_FIELD\nfrom ..core.caller import require_user\nfrom ..core.command import SubscriptionStarted, bridge_command\nfrom ..core.runtime import get_data\nfrom ..schedules.subscription import ScheduleSubscription\n\nSCHEDULE_FIELDS = {\n    vol.Optional(\"name\"): object,\n    vol.Optional(\"when\"): object,\n    vol.Optional(\"action\"): object,\n    vol.Optional(\"entities\"): object,\n    vol.Optional(\"enabled\"): object,\n    vol.Optional(\"repeat\"): object,\n    vol.Optional(\"notify\"): object,\n}\n\"\"\"Content of a schedule; checked in detail by the manager so a bad value gives HAB-SCH-001.\"\"\"\n\n\ndef _fields(msg: dict[str, Any]) -> dict[str, Any]:\n    \"\"\"Return the schedule fields of a request without the transport keys.\"\"\"\n    return {\n        key: value\n        for key, value in msg.items()\n        if key in {\"name\", \"when\", \"action\", \"entities\", \"enabled\", \"repeat\", \"notify\"}\n    }\n\n\n@bridge_command(\"haac_bridge/schedules/revision\")\nasync def ws_schedules_revision(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the revision and scope of the schedules the caller can see.\"\"\"\n    manager = get_data(hass).schedules\n    user = require_user(connection)\n    return {\"revision\": manager.revision_for(user), \"scope\": manager.scope_of(user)}\n\n\n@bridge_command(\"haac_bridge/schedules/list\")\nasync def ws_schedules_list(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the schedules the caller can see, with the next run of each.\"\"\"\n    return await get_data(hass).schedules.async_list(require_user(connection))\n\n\n@bridge_command(\n    \"haac_bridge/schedules/create\",\n    {\n        vol.Required(\"name\"): object,\n        vol.Required(\"when\"): object,\n        vol.Required(\"action\"): object,\n        vol.Required(\"entities\"): object,\n        vol.Optional(\"enabled\"): object,\n        vol.Optional(\"repeat\"): object,\n        vol.Optional(\"notify\"): object,\n    },\n)\nasync def ws_schedules_create(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Create a schedule owned by the caller and return it.\"\"\"\n    manager = get_data(hass).schedules\n    user = require_user(connection)\n    schedule = await manager.async_create(user, _fields(msg))\n    return await manager.async_describe(schedule, user)\n\n\n@bridge_command(\n    \"haac_bridge/schedules/update\",\n    {vol.Required(\"schedule_id\"): str, vol.Required(\"updated_at\"): str, **SCHEDULE_FIELDS},\n)\nasync def ws_schedules_update(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Change a schedule the caller may edit and return it; the version must be the edited one.\"\"\"\n    manager = get_data(hass).schedules\n    user = require_user(connection)\n    schedule = await manager.async_update(user, msg[\"schedule_id\"], msg[\"updated_at\"], _fields(msg))\n    return await manager.async_describe(schedule, user)\n\n\n@bridge_command(\n    \"haac_bridge/schedules/preview\",\n    {vol.Required(\"when\"): object, vol.Optional(\"repeat\"): object},\n)\nasync def ws_schedules_preview(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the next runs of a draft schedule without saving it.\"\"\"\n    require_user(connection)\n    planner = get_data(hass).schedules.planner\n    return {\n        \"next_runs\": [run.isoformat() for run in planner.preview(msg[\"when\"], msg.get(\"repeat\"))]\n    }\n\n\n@bridge_command(\n    \"haac_bridge/schedules/skip_run\",\n    {vol.Required(\"schedule_id\"): str, vol.Required(\"date\"): str, vol.Required(\"skip\"): bool},\n)\nasync def ws_schedules_skip_run(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Skip the run of one date of a schedule or take it up again, and return the schedule.\"\"\"\n    manager = get_data(hass).schedules\n    user = require_user(connection)\n    schedule = await manager.async_skip_run(user, msg[\"schedule_id\"], msg[\"date\"], skip=msg[\"skip\"])\n    return await manager.async_describe(schedule, user)\n\n\n@bridge_command(\n    \"haac_bridge/schedules/runs\",\n    {vol.Optional(\"log_id\"): str, vol.Optional(\"after_seq\"): vol.All(int, vol.Range(min=0))},\n)\nasync def ws_schedules_runs(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Return the caller's own run log entries after the cursor; a different `log_id` returns all.\"\"\"\n    return get_data(hass).schedules.runs_for(\n        require_user(connection), msg.get(\"log_id\"), msg.get(\"after_seq\", 0)\n    )\n\n\n@bridge_command(\"haac_bridge/schedules/delete\", {vol.Required(\"schedule_id\"): str})\nasync def ws_schedules_delete(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> None:\n    \"\"\"Delete a schedule the caller may edit; an unknown id is not an error.\"\"\"\n    await get_data(hass).schedules.async_delete(require_user(connection), msg[\"schedule_id\"])\n\n\n@bridge_command(\n    \"haac_bridge/schedules/run_now\",\n    {vol.Required(\"schedule_id\"): str, vol.Optional(\"client\"): CLIENT_FIELD},\n)\nasync def ws_schedules_run_now(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> None:\n    \"\"\"Start one run of a schedule now without changing its plan; the result follows as an event.\"\"\"\n    await get_data(hass).schedules.async_run_now(\n        require_user(connection), msg[\"schedule_id\"], msg.get(\"client\")\n    )\n\n\n@bridge_command(\"haac_bridge/subscribe_schedules\")\nasync def ws_subscribe_schedules(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> SubscriptionStarted:\n    \"\"\"Subscribe to `schedules_changed` events for the schedules the caller can see.\"\"\"\n    subscription = ScheduleSubscription(hass, connection, msg[\"id\"], require_user(connection))\n    subscription.async_start()\n    connection.subscriptions[msg[\"id\"]] = subscription.async_stop\n    return SubscriptionStarted()\n","custom_components/haac_bridge/api/services.py":"\"\"\"Command haac_bridge/call_service (concept 10.3, 11.2, 11.4).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport homeassistant.helpers.config_validation as cv\nimport voluptuous as vol\n\nfrom ..audit.client import CLIENT_FIELD, source_of\nfrom ..core.caller import require_user\nfrom ..core.command import bridge_command\nfrom ..services.audited_call import ServiceRequest, async_audited_call\n\n\n@bridge_command(\n    \"haac_bridge/call_service\",\n    {\n        vol.Required(\"entity_id\"): cv.entity_id,\n        vol.Required(\"service\"): cv.slug,\n        vol.Optional(\"service_data\", default=dict): dict,\n        vol.Optional(\"client\"): CLIENT_FIELD,\n    },\n)\nasync def ws_call_service(\n    hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n) -> None:\n    \"\"\"Call a service of an exposed entity's domain on that entity only, and record it (concept 21).\"\"\"\n    request = ServiceRequest(\n        entity_id=msg[\"entity_id\"],\n        service=msg[\"service\"],\n        service_data=msg[\"service_data\"],\n        source=source_of(hass, connection),\n        client=msg.get(\"client\"),\n    )\n    await async_audited_call(hass, require_user(connection), request)\n","custom_components/haac_bridge/areas/__init__.py":"\"\"\"HA floors and areas of the exposed entities, for the app's import wizard.\"\"\"\n","custom_components/haac_bridge/areas/catalog.py":"\"\"\"Floors and areas that contain exposed entities (concept 6.3, 11.2).\"\"\"\n\nfrom collections import Counter\nfrom collections.abc import Iterable\nfrom typing import Any\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers import (\n    area_registry as ar,\n    device_registry as dr,\n    entity_registry as er,\n    floor_registry as fr,\n)\n\n\ndef _area_of(entity: er.RegistryEntry, devices: dr.DeviceRegistry) -> str | None:\n    \"\"\"Return the area of an entity: its own, else the area of its device.\"\"\"\n    if entity.area_id is not None:\n        return entity.area_id\n    if entity.device_id is None:\n        return None\n    device = devices.async_get(entity.device_id)\n    return device.area_id if device else None\n\n\ndef _entity_counts(hass: HomeAssistant, entity_ids: Iterable[str]) -> Counter[str]:\n    \"\"\"Count the given entities per area ID; entities without an area are left out.\"\"\"\n    entities = er.async_get(hass)\n    devices = dr.async_get(hass)\n    counts: Counter[str] = Counter()\n    for entity_id in entity_ids:\n        entry = entities.async_get(entity_id)\n        if entry is not None and (area_id := _area_of(entry, devices)) is not None:\n            counts[area_id] += 1\n    return counts\n\n\ndef area_catalog(hass: HomeAssistant, entity_ids: Iterable[str]) -> dict[str, Any]:\n    \"\"\"Return the areas that hold at least one of the entities, and the floors those areas are on.\n\n    Areas are sorted by name; floors by level (floors without a level last), then name. Only names,\n    levels and entity counts are returned, never entity IDs.\n    \"\"\"\n    counts = _entity_counts(hass, entity_ids)\n    areas = [\n        {\n            \"area_id\": area.id,\n            \"name\": area.name,\n            \"floor_id\": area.floor_id,\n            \"entity_count\": counts[area.id],\n        }\n        for area in sorted(ar.async_get(hass).async_list_areas(), key=lambda a: a.name.casefold())\n        if area.id in counts\n    ]\n    floor_ids = {area[\"floor_id\"] for area in areas if area[\"floor_id\"] is not None}\n    floors = sorted(\n        (\n            {\"floor_id\": floor.floor_id, \"name\": floor.name, \"level\": floor.level}\n            for floor in fr.async_get(hass).async_list_floors()\n            if floor.floor_id in floor_ids\n        ),\n        key=lambda f: (f[\"level\"] is None, f[\"level\"] or 0, f[\"name\"].casefold()),\n    )\n    return {\"floors\": floors, \"areas\": areas}\n","custom_components/haac_bridge/audit/__init__.py":"\"\"\"Audit log and Activity entries: what the bridge did, for whom and with what result (concept 21).\"\"\"\n","custom_components/haac_bridge/audit/client.py":"\"\"\"The device name the app sends and the source of a call (concept 21.3, 21.5).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport voluptuous as vol\n\nfrom ..const import APP_CLIENT_ID, MAX_CLIENT_LENGTH\n\n\ndef _printable(value: str) -> str:\n    \"\"\"Voluptuous validator: reject a device name with control characters.\"\"\"\n    if not value.isprintable():\n        raise vol.Invalid(\"the device name has control characters\")\n    return value\n\n\nCLIENT_FIELD: Any = vol.All(str, vol.Strip, vol.Length(min=1, max=MAX_CLIENT_LENGTH), _printable)\n\"\"\"Request field `client`: the device name, 1 to 40 printable characters (concept 21.5).\"\"\"\n\n\ndef source_of(hass: HomeAssistant, connection: ActiveConnection) -> str:\n    \"\"\"Return `app` if the connection's refresh token belongs to the HAAC app, else `other`.\"\"\"\n    token = hass.auth.async_get_refresh_token(connection.refresh_token_id)\n    return \"app\" if token is not None and token.client_id == APP_CLIENT_ID else \"other\"\n","custom_components/haac_bridge/audit/describe.py":"\"\"\"Activity text of a `haac_bridge_action` event (concept 21.4).\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\nACTION_CALL = \"call_service\"\nACTION_SCHEDULE = \"schedule_run\"\nACTION_SKIPPED = \"schedule_skipped\"\n\n_VERBS = {\n    \"turn_on\": (\"turned on\", \"turn on\"),\n    \"turn_off\": (\"turned off\", \"turn off\"),\n    \"toggle\": (\"toggled\", \"toggle\"),\n}\n_VALUE_KEYS = (\n    \"temperature\",\n    \"hvac_mode\",\n    \"humidity\",\n    \"fan_mode\",\n    \"preset_mode\",\n    \"swing_mode\",\n    \"swing_horizontal_mode\",\n)\n\n\ndef _phrases(service: str) -> tuple[str, str]:\n    \"\"\"Return the past tense (\"turned on\") and the plain form (\"turn on\") of a service.\"\"\"\n    plain = service.replace(\"_\", \" \")\n    return _VERBS.get(service, (plain, plain))\n\n\ndef _value_of(data: Mapping[str, Any]) -> str | None:\n    \"\"\"Return the value a climate call set, e.g. `21.5` or `heat`, or None.\"\"\"\n    for key in _VALUE_KEYS:\n        if key in data:\n            return str(data[key])\n    low, high = data.get(\"target_temp_low\"), data.get(\"target_temp_high\")\n    return f\"{low} to {high}\" if low is not None and high is not None else None\n\n\ndef _origin(event: Mapping[str, Any]) -> str:\n    \"\"\"Return who acted: \"via HAAC app (Pixel 8)\" or \"by a schedule\".\"\"\"\n    if event.get(\"action\") == ACTION_SCHEDULE:\n        return \"by a schedule\"\n    if event.get(\"source\") != \"app\":\n        return \"via HAAC Bridge\"\n    client = event.get(\"client\")\n    return f\"via HAAC app ({client})\" if client else \"via HAAC app\"\n\n\ndef describe(event: Mapping[str, Any]) -> str:\n    \"\"\"Return the message the Activity page shows for an event.\"\"\"\n    if event.get(\"action\") == ACTION_SKIPPED:\n        return \"HAAC schedule did not run\"\n    past, plain = _phrases(str(event.get(\"service\", \"\")))\n    if event.get(\"result\") != \"ok\":\n        return f\"{plain} failed {_origin(event)}\"\n    value = _value_of(event.get(\"data\") or {})\n    return f\"{past}{f' to {value}' if value else ''} {_origin(event)}\"\n","custom_components/haac_bridge/audit/entry.py":"\"\"\"AuditEntry: one thing the bridge did, as a log line and optionally an Activity event (concept 21.3).\"\"\"\n\nfrom dataclasses import dataclass\nfrom typing import Any\n\nfrom homeassistant.core import Context\n\n\n@dataclass(frozen=True, slots=True)\nclass AuditEntry:\n    \"\"\"What `AuditLog.record` writes: the log line (fields in order), and the Activity event if there is one.\n\n    `log` is False for a failure that the command wrapper or the schedule runner already logs once.\n    `context` ties the Activity event to the service call that caused it.\n    \"\"\"\n\n    action: str\n    level: int\n    fields: tuple[tuple[str, Any], ...] = ()\n    log: bool = True\n    activity: dict[str, Any] | None = None\n    context: Context | None = None\n","custom_components/haac_bridge/audit/factory.py":"\"\"\"AuditEntryFactory: one audit entry per kind of action (concept 18.2, 21.3).\"\"\"\n\nimport logging\nfrom typing import TYPE_CHECKING, Any\n\nfrom homeassistant.auth.models import User\n\nfrom .describe import ACTION_CALL, ACTION_SCHEDULE, ACTION_SKIPPED\nfrom .entry import AuditEntry\n\nif TYPE_CHECKING:\n    from ..schedules.model import RunOrigin, Schedule\n    from ..services.call_factory import ValidatedServiceCall\n\n\ndef user_label(user: User) -> str:\n    \"\"\"Return `name(first 8 characters of the id)`, which tells users with the same name apart.\"\"\"\n    return f\"{user.name}({user.id[:8]})\"\n\n\ndef _activity(\n    action: str, result: str, call: ValidatedServiceCall, *, client: str | None, source: str | None\n) -> dict[str, Any]:\n    \"\"\"Return the data of a `haac_bridge_action` event; `service_data` only for a success (concept 21.4).\"\"\"\n    event: dict[str, Any] = {\n        \"action\": action,\n        \"result\": result,\n        \"entity_id\": call.entity_id,\n        \"service\": call.service,\n    }\n    for key, value in ((\"client\", client), (\"source\", source)):\n        if value is not None:\n            event[key] = value\n    if call.data and result == \"ok\":\n        event[\"data\"] = call.data\n    return event\n\n\nclass AuditEntryFactory:\n    \"\"\"Creates the audit entry for each kind of action, with its level and its Activity event.\"\"\"\n\n    def call_service(\n        self,\n        user: User,\n        call: ValidatedServiceCall,\n        *,\n        source: str,\n        client: str | None,\n        duration_ms: int,\n    ) -> AuditEntry:\n        \"\"\"Return the entry of a successful `haac_bridge/call_service`.\"\"\"\n        return AuditEntry(\n            \"call_service\",\n            logging.INFO,\n            (\n                (\"user\", user_label(user)),\n                (\"source\", source),\n                (\"client\", client),\n                (\"entity\", call.entity_id),\n                (\"service\", call.service),\n                (\"data\", call.data),\n                (\"result\", \"ok\"),\n                (\"ms\", duration_ms),\n            ),\n            activity=_activity(ACTION_CALL, \"ok\", call, client=client, source=source),\n            context=call.context,\n        )\n\n    def call_failed(\n        self, call: ValidatedServiceCall, client: str | None, source: str\n    ) -> AuditEntry:\n        \"\"\"Return the Activity-only entry of a service call that failed; the wrapper logs the error.\"\"\"\n        return AuditEntry(\n            \"call_service\",\n            logging.WARNING,\n            log=False,\n            activity=_activity(ACTION_CALL, \"failed\", call, client=client, source=source),\n            context=call.context,\n        )\n\n    def schedule_switched(\n        self,\n        schedule: Schedule,\n        owner: User,\n        call: ValidatedServiceCall,\n        *,\n        ok: bool,\n        origin: RunOrigin,\n    ) -> AuditEntry:\n        \"\"\"Return the entry of one entity switched by a schedule run; a failure is Activity-only.\"\"\"\n        return AuditEntry(\n            \"schedule_run\",\n            logging.INFO,\n            (\n                (\"schedule\", schedule.name),\n                (\"id\", schedule.id[:8]),\n                (\"owner\", user_label(owner)),\n                (\"trigger\", \"plan\" if origin.triggered_by is None else \"manual\"),\n                (\"started_by\", origin.triggered_by),\n                (\"client\", origin.client),\n                (\"entity\", call.entity_id),\n                (\"service\", call.service),\n                (\"result\", \"ok\"),\n            ),\n            log=ok,\n            activity=_activity(\n                ACTION_SCHEDULE, \"ok\" if ok else \"failed\", call, client=origin.client, source=None\n            ),\n            context=call.context,\n        )\n\n    def schedule_result(\n        self, schedule: Schedule, result: str, done: int, total: int, *, removed: bool\n    ) -> AuditEntry:\n        \"\"\"Return the entry of the result of a schedule run.\"\"\"\n        return AuditEntry(\n            \"schedule_result\",\n            logging.INFO,\n            (\n                (\"schedule\", schedule.name),\n                (\"id\", schedule.id[:8]),\n                (\"owner\", schedule.owner[:8]),\n                (\"result\", result),\n                (\"entities\", f\"{done}/{total}\"),\n                (\"removed\", removed),\n            ),\n        )\n\n    def schedule_not_run(self, schedule: Schedule, reason: str) -> AuditEntry:\n        \"\"\"Return the entry of a run that did not take place: missed, or the schedule was paused.\"\"\"\n        level = logging.WARNING if reason == \"missed\" else logging.INFO\n        return AuditEntry(\n            \"schedule_not_run\",\n            level,\n            (\n                (\"schedule\", schedule.name),\n                (\"id\", schedule.id[:8]),\n                (\"owner\", schedule.owner[:8]),\n                (\"reason\", reason),\n            ),\n            activity={\"action\": ACTION_SKIPPED, \"result\": \"skipped\"},\n        )\n\n    def schedule_changed(\n        self, *, change: str, by: str, schedule: Schedule, details: dict[str, Any]\n    ) -> AuditEntry:\n        \"\"\"Return the entry of a schedule that was created, changed, deleted, switched on or off.\n\n        `by` is the label of the user, or `ha` when Home Assistant itself switched it.\n        \"\"\"\n        return AuditEntry(\n            \"schedule_change\",\n            logging.INFO,\n            (\n                (\"change\", change),\n                (\"by\", by),\n                (\"schedule\", schedule.name),\n                (\"id\", schedule.id[:8]),\n                *details.items(),\n            ),\n        )\n\n    def entity_disabled(\n        self, *, user: User, entity_id: str, disabled: bool, schedules: int\n    ) -> AuditEntry:\n        \"\"\"Return the entry of an entity a user deactivated or activated.\"\"\"\n        return AuditEntry(\n            \"entity_disabled\" if disabled else \"entity_enabled\",\n            logging.INFO,\n            ((\"user\", user_label(user)), (\"entity\", entity_id), (\"schedules\", schedules)),\n        )\n\n    def config_changed(self, *, what: str, **details: Any) -> AuditEntry:\n        \"\"\"Return the entry of a change of the configuration by an administrator or a reload.\"\"\"\n        return AuditEntry(\"config_change\", logging.INFO, ((\"what\", what), *details.items()))\n\n    def startup(self, **details: Any) -> AuditEntry:\n        \"\"\"Return the entry written when the integration has started.\"\"\"\n        return AuditEntry(\"startup\", logging.INFO, tuple(details.items()))\n\n    def command(self, *, command_type: str, user_id: str | None, duration_ms: int) -> AuditEntry:\n        \"\"\"Return the debug entry of one `haac_bridge/*` command.\"\"\"\n        return AuditEntry(\n            \"command\",\n            logging.DEBUG,\n            ((\"type\", command_type), (\"user\", user_id), (\"ms\", duration_ms)),\n        )\n","custom_components/haac_bridge/audit/levels.py":"\"\"\"Log level and Activity switch of the bridge: reading, merging and applying them (concept 21.2).\"\"\"\n\nfrom collections.abc import Mapping\nimport logging\nfrom typing import Any\n\nfrom ..const import CONF_ACTIVITY, CONF_LEVEL, LOGGER_NAME\nfrom ..core.log_settings import LoggingSettings, LogLevel\n\n\ndef _level_of(section: Mapping[str, Any] | None) -> LogLevel | None:\n    \"\"\"Return the level named in a `logging` block, or None if it is missing or damaged.\"\"\"\n    try:\n        return LogLevel((section or {}).get(CONF_LEVEL))\n    except ValueError:\n        return None\n\n\ndef _activity_of(section: Mapping[str, Any] | None) -> bool | None:\n    \"\"\"Return the Activity switch of a `logging` block, or None if it is missing or damaged.\"\"\"\n    value = (section or {}).get(CONF_ACTIVITY)\n    return value if isinstance(value, bool) else None\n\n\ndef merge_settings(\n    yaml_section: Mapping[str, Any] | None, options_section: Mapping[str, Any] | None\n) -> LoggingSettings:\n    \"\"\"Return the settings: a value in the YAML wins over the option, damaged values fall back (concept 21.2).\"\"\"\n    defaults = LoggingSettings()\n    level = _level_of(yaml_section) or _level_of(options_section) or defaults.level\n    activity = _activity_of(yaml_section)\n    if activity is None:\n        activity = _activity_of(options_section)\n    return LoggingSettings(level, defaults.activity if activity is None else activity)\n\n\ndef yaml_keys(yaml_section: Mapping[str, Any] | None) -> set[str]:\n    \"\"\"Return which of `level` and `activity` the YAML sets, so the options form can say so.\"\"\"\n    keys = set()\n    if _level_of(yaml_section) is not None:\n        keys.add(CONF_LEVEL)\n    if _activity_of(yaml_section) is not None:\n        keys.add(CONF_ACTIVITY)\n    return keys\n\n\ndef apply_level(level: LogLevel) -> None:\n    \"\"\"Set the level of the package logger; every module logger of the bridge inherits it.\"\"\"\n    logging.getLogger(LOGGER_NAME).setLevel(level.number)\n","custom_components/haac_bridge/audit/log.py":"\"\"\"AuditLog: writes audit entries to the HA log and fires the Activity event (concept 21.3, 21.4).\"\"\"\n\nimport logging\n\nfrom homeassistant.core import HomeAssistant, callback\n\nfrom ..const import EVENT_ACTION\nfrom ..core.formatting import format_value\nfrom .entry import AuditEntry\nfrom .levels import LoggingSettings, apply_level\n\n_LOGGER = logging.getLogger(__package__)\n\n\ndef format_line(entry: AuditEntry) -> str:\n    \"\"\"Return the log line of an entry: `action=… key=value …`.\"\"\"\n    parts = [f\"action={entry.action}\"]\n    parts.extend(f\"{key}={format_value(value)}\" for key, value in entry.fields)\n    return \" \".join(parts)\n\n\nclass AuditLog:\n    \"\"\"Records audit entries; the level and the Activity switch come from `configure`.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Start with the default settings.\"\"\"\n        self._hass = hass\n        self.settings = LoggingSettings()\n\n    @callback\n    def configure(self, settings: LoggingSettings) -> None:\n        \"\"\"Take over new settings and set the level of the package logger.\"\"\"\n        self.settings = settings\n        apply_level(settings.level)\n\n    def is_enabled(self, level: int) -> bool:\n        \"\"\"Return whether a line of this level would be written, so callers can skip building it.\"\"\"\n        return _LOGGER.isEnabledFor(level)\n\n    @callback\n    def record(self, entry: AuditEntry) -> None:\n        \"\"\"Write the log line and, if the Activity switch is on, fire the event of the entry.\"\"\"\n        if entry.log:\n            _LOGGER.log(entry.level, \"%s\", format_line(entry))\n        if entry.activity is not None and self.settings.activity:\n            self._hass.bus.async_fire(EVENT_ACTION, entry.activity, context=entry.context)\n","custom_components/haac_bridge/config/__init__.py":"\"\"\"YAML configuration: schema, matching entries to HA users, Repairs issues.\"\"\"\n","custom_components/haac_bridge/config/repairs.py":"\"\"\"Reports configuration errors (HAB-CFG-*) in the log and in HA Repairs (concept 18.4).\"\"\"\n\nimport logging\n\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.helpers import issue_registry as ir\nfrom homeassistant.util import slugify\n\nfrom ..const import DOMAIN\nfrom ..core.errors import ErrorCode\nfrom .schema import UserEntry\nfrom .users import async_find_unknown_entries, entry_matches\n\n_LOGGER = logging.getLogger(__name__)\n\n_ISSUE_INVALID = ErrorCode.CFG_INVALID.translation_key\n\n\n@callback\ndef async_report_invalid_config(hass: HomeAssistant, issue_ids: set[str]) -> None:\n    \"\"\"Log HAB-CFG-001 and create its Repairs issue; the previous configuration stays active.\"\"\"\n    _LOGGER.error(\n        \"%s: the haac_bridge configuration is invalid, keeping the previous one\",\n        ErrorCode.CFG_INVALID,\n    )\n    ir.async_create_issue(\n        hass,\n        DOMAIN,\n        _ISSUE_INVALID,\n        is_fixable=False,\n        severity=ir.IssueSeverity.ERROR,\n        translation_key=ErrorCode.CFG_INVALID.translation_key,\n    )\n    issue_ids.add(_ISSUE_INVALID)\n\n\nasync def async_check_users(\n    hass: HomeAssistant,\n    issue_ids: set[str],\n    entries: list[UserEntry],\n    yaml_entries: list[UserEntry],\n) -> None:\n    \"\"\"Report entries without a HA user (HAB-CFG-002), YAML duplicates (HAB-CFG-003); remove resolved issues.\n\n    A user in both YAML and the UI is no duplicate: the YAML entry wins by design (concept 10.2).\n    \"\"\"\n    current = await _async_report_duplicates(hass, yaml_entries)\n    for entry in await async_find_unknown_entries(hass, entries):\n        _LOGGER.warning(\n            \"%s: haac_bridge user %s does not exist in Home Assistant\",\n            ErrorCode.CFG_UNKNOWN_USER,\n            entry.label,\n        )\n        issue_id = f\"{ErrorCode.CFG_UNKNOWN_USER.translation_key}_{slugify(entry.label)}\"\n        ir.async_create_issue(\n            hass,\n            DOMAIN,\n            issue_id,\n            is_fixable=False,\n            severity=ir.IssueSeverity.WARNING,\n            translation_key=ErrorCode.CFG_UNKNOWN_USER.translation_key,\n            translation_placeholders={\"user\": entry.label},\n        )\n        current.add(issue_id)\n    for issue_id in issue_ids - current:\n        ir.async_delete_issue(hass, DOMAIN, issue_id)\n    issue_ids.clear()\n    issue_ids.update(current)\n\n\nasync def _async_report_duplicates(hass: HomeAssistant, yaml_entries: list[UserEntry]) -> set[str]:\n    \"\"\"Create a HAB-CFG-003 issue for every HA user with more than one YAML entry; return the issue ids.\n\n    The first entry is used, the others are ignored (by `username` and by `user_id` alike).\n    \"\"\"\n    issue_ids: set[str] = set()\n    for user in await hass.auth.async_get_users():\n        matching = [entry for entry in yaml_entries if entry_matches(entry, user)]\n        if len(matching) < 2:\n            continue\n        label = user.name or user.id\n        _LOGGER.warning(\n            \"%s: %d haac_bridge entries refer to user %s; only the first one is used\",\n            ErrorCode.CFG_DUPLICATE_USER,\n            len(matching),\n            label,\n        )\n        issue_id = f\"{ErrorCode.CFG_DUPLICATE_USER.translation_key}_{slugify(user.id)}\"\n        ir.async_create_issue(\n            hass,\n            DOMAIN,\n            issue_id,\n            is_fixable=False,\n            severity=ir.IssueSeverity.WARNING,\n            translation_key=ErrorCode.CFG_DUPLICATE_USER.translation_key,\n            translation_placeholders={\"user\": label, \"count\": str(len(matching))},\n        )\n        issue_ids.add(issue_id)\n    return issue_ids\n","custom_components/haac_bridge/config/schema.py":"\"\"\"YAML schema of the haac_bridge section in configuration.yaml (concept 10.2).\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import Any\n\nimport homeassistant.helpers.config_validation as cv\nfrom homeassistant.helpers.entityfilter import (\n    BASE_FILTER_SCHEMA,\n    CONF_EXCLUDE_ENTITY_GLOBS,\n    CONF_INCLUDE_ENTITY_GLOBS,\n)\nfrom homeassistant.helpers.typing import ConfigType\nimport voluptuous as vol\n\nfrom ..const import (\n    CONF_ACTIVITY,\n    CONF_ENTITY_CONFIG,\n    CONF_FILTER,\n    CONF_LEVEL,\n    CONF_LOGGING,\n    CONF_NAME,\n    CONF_USER_ID,\n    CONF_USERNAME,\n    CONF_USERS,\n    DOMAIN,\n)\nfrom ..core.log_settings import LogLevel\n\n\ndef valid_glob(value: str) -> bool:\n    \"\"\"Return True if a wildcard has the form `domain.pattern`, e.g. `sensor.*_humidity`.\"\"\"\n    domain, dot, pattern = value.strip().partition(\".\")\n    return bool(domain and dot and pattern)\n\n\ndef _globs_checked(rules: dict[str, Any]) -> dict[str, Any]:\n    \"\"\"Voluptuous validator: reject a filter whose include or exclude wildcards are not `domain.pattern`.\"\"\"\n    for key in (CONF_INCLUDE_ENTITY_GLOBS, CONF_EXCLUDE_ENTITY_GLOBS):\n        for glob in rules.get(key, []):\n            if not valid_glob(glob):\n                raise vol.Invalid(f\"wildcard {glob!r} must look like domain.pattern\", path=[key])\n    return rules\n\n\nFILTER_SCHEMA = vol.All(BASE_FILTER_SCHEMA, _globs_checked)\n\"\"\"HA's filter schema, plus the same wildcard check the options flow applies (finding U6).\"\"\"\n\nENTITY_CONFIG_SCHEMA = vol.Schema(\n    {\n        cv.entity_id: vol.Schema(\n            {vol.Optional(CONF_NAME): vol.All(cv.string, vol.Strip, vol.Length(min=1))}\n        )\n    }\n)\n\"\"\"Per-entity settings; `name` is the default display name the app shows (concept 7.3).\"\"\"\n\nUSER_SCHEMA = vol.All(\n    vol.Schema(\n        {\n            vol.Exclusive(CONF_USERNAME, \"user\"): cv.string,\n            vol.Exclusive(CONF_USER_ID, \"user\"): cv.string,\n            vol.Optional(CONF_FILTER, default={}): FILTER_SCHEMA,\n            vol.Optional(CONF_ENTITY_CONFIG, default={}): ENTITY_CONFIG_SCHEMA,\n        }\n    ),\n    cv.has_at_least_one_key(CONF_USERNAME, CONF_USER_ID),\n)\n\n\nLOGGING_SCHEMA = vol.Schema(\n    {\n        vol.Optional(CONF_LEVEL): vol.In([level.value for level in LogLevel]),\n        vol.Optional(CONF_ACTIVITY): cv.boolean,\n    }\n)\n\"\"\"The `logging` block: the log level and whether switching actions appear in Activity (concept 21.2).\"\"\"\n\n\ndef _none_as_empty(section: Any) -> Any:\n    \"\"\"Return an empty section for a bare `haac_bridge:` line, which YAML reads as None.\"\"\"\n    return {} if section is None else section\n\n\nSECTION_SCHEMA = vol.All(\n    _none_as_empty,\n    vol.Schema(\n        {\n            vol.Optional(CONF_ENTITY_CONFIG, default={}): ENTITY_CONFIG_SCHEMA,\n            vol.Optional(CONF_USERS, default=[]): vol.All(cv.ensure_list, [USER_SCHEMA]),\n            vol.Optional(CONF_LOGGING, default={}): LOGGING_SCHEMA,\n        }\n    ),\n)\n\"\"\"The content of the `haac_bridge:` section; a bare section means no users.\"\"\"\n\nCONFIG_SCHEMA = vol.Schema({DOMAIN: SECTION_SCHEMA}, extra=vol.ALLOW_EXTRA)\n\n\n@dataclass(frozen=True, slots=True)\nclass UserEntry:\n    \"\"\"One validated entry under `users`: who it applies to, its filter and its entity names.\"\"\"\n\n    username: str | None\n    user_id: str | None\n    filter: dict[str, list[str]]\n    names: dict[str, str] = field(default_factory=dict)\n\n    @property\n    def label(self) -> str:\n        \"\"\"Return the name used for this entry in logs and Repairs.\"\"\"\n        return self.user_id or self.username or \"?\"\n\n\ndef parse_users(config: ConfigType) -> list[UserEntry]:\n    \"\"\"Return the user entries of a validated configuration; empty if the section is missing.\n\n    Each entry's names are the global `entity_config` names overridden by its own.\n    \"\"\"\n    section: dict[str, Any] = config.get(DOMAIN) or {}\n    shared = _names(section.get(CONF_ENTITY_CONFIG, {}))\n    return [\n        UserEntry(\n            username=entry.get(CONF_USERNAME),\n            user_id=entry.get(CONF_USER_ID),\n            filter=entry[CONF_FILTER],\n            names=shared | _names(entry.get(CONF_ENTITY_CONFIG, {})),\n        )\n        for entry in section.get(CONF_USERS, [])\n    ]\n\n\ndef _names(entity_config: dict[str, dict[str, str]]) -> dict[str, str]:\n    \"\"\"Return entity ID to configured name for the entities that have a name.\"\"\"\n    return {\n        entity_id: settings[CONF_NAME]\n        for entity_id, settings in entity_config.items()\n        if CONF_NAME in settings\n    }\n","custom_components/haac_bridge/config/ui_users.py":"\"\"\"Users configured in the Home Assistant UI, stored in the options of the config entry (concept 10.2).\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\nfrom homeassistant.helpers.entityfilter import (\n    CONF_EXCLUDE_DOMAINS,\n    CONF_EXCLUDE_ENTITIES,\n    CONF_EXCLUDE_ENTITY_GLOBS,\n    CONF_INCLUDE_DOMAINS,\n    CONF_INCLUDE_ENTITIES,\n    CONF_INCLUDE_ENTITY_GLOBS,\n)\n\nfrom ..const import CONF_FILTER, CONF_NAMES, CONF_USER_ID, CONF_USERS\nfrom .schema import UserEntry\n\nFILTER_KEYS = (\n    CONF_INCLUDE_DOMAINS,\n    CONF_INCLUDE_ENTITIES,\n    CONF_INCLUDE_ENTITY_GLOBS,\n    CONF_EXCLUDE_DOMAINS,\n    CONF_EXCLUDE_ENTITIES,\n    CONF_EXCLUDE_ENTITY_GLOBS,\n)\n\"\"\"The filter rules of a user, named like in the YAML `filter` section (concept 10.2).\"\"\"\n\nINCLUDE_KEYS = (CONF_INCLUDE_DOMAINS, CONF_INCLUDE_ENTITIES, CONF_INCLUDE_ENTITY_GLOBS)\n\"\"\"The rules that expose something; a filter without one exposes nothing.\"\"\"\n\n\ndef user_options(\n    user_id: str, rules: Mapping[str, Any], names: Mapping[str, str]\n) -> dict[str, Any]:\n    \"\"\"Return the options record of one user: its ID, the non-empty filter rules and the display names.\"\"\"\n    return {\n        CONF_USER_ID: user_id,\n        CONF_FILTER: {key: list(rules[key]) for key in FILTER_KEYS if rules.get(key)},\n        CONF_NAMES: {entity_id: name for entity_id, name in names.items() if name},\n    }\n\n\ndef users_of(options: Mapping[str, Any]) -> list[dict[str, Any]]:\n    \"\"\"Return the user records of the entry options; empty if none were configured.\"\"\"\n    return list(options.get(CONF_USERS, []))\n\n\ndef parse_ui_users(options: Mapping[str, Any]) -> list[UserEntry]:\n    \"\"\"Return the user entries of the entry options, with all six filter rules present as HA's filter expects.\n\n    They never carry a username, only the stable user ID.\n    \"\"\"\n    return [\n        UserEntry(\n            username=None,\n            user_id=record[CONF_USER_ID],\n            filter={key: list(record.get(CONF_FILTER, {}).get(key, [])) for key in FILTER_KEYS},\n            names=dict(record.get(CONF_NAMES, {})),\n        )\n        for record in users_of(options)\n    ]\n","custom_components/haac_bridge/config/ui_yaml.py":"\"\"\"Export and import of the users configured in the UI as YAML (concept 10.2).\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\nfrom homeassistant.util.yaml import dump\nimport voluptuous as vol\nimport yaml\n\nfrom ..const import (\n    CONF_ENTITY_CONFIG,\n    CONF_FILTER,\n    CONF_NAME,\n    CONF_NAMES,\n    CONF_USER_ID,\n    CONF_USERS,\n    DOMAIN,\n)\nfrom .schema import SECTION_SCHEMA, UserEntry, parse_users\nfrom .ui_users import INCLUDE_KEYS, user_options, users_of\n\n\ndef export_users(options: Mapping[str, Any]) -> str:\n    \"\"\"Return the UI users as the `haac_bridge:` section of a configuration.yaml.\n\n    The result can be pasted into configuration.yaml or into the import of another installation.\n    \"\"\"\n    users: list[dict[str, Any]] = []\n    for record in users_of(options):\n        entry: dict[str, Any] = {\n            CONF_USER_ID: record[CONF_USER_ID],\n            CONF_FILTER: {key: list(rules) for key, rules in record.get(CONF_FILTER, {}).items()},\n        }\n        if names := record.get(CONF_NAMES):\n            entry[CONF_ENTITY_CONFIG] = {\n                entity_id: {CONF_NAME: name} for entity_id, name in sorted(names.items())\n            }\n        users.append(entry)\n    return dump({DOMAIN: {CONF_USERS: users}})\n\n\ndef import_users(text: str) -> tuple[list[dict[str, Any]], str | None]:\n    \"\"\"Return the options records of the users in YAML [text], or the key of the error that stops the import.\n\n    The text may be a whole `haac_bridge:` section or only its content. Users are named by `user_id`;\n    each needs at least one include rule, like in the UI. Names come from `entity_config`.\n    \"\"\"\n    section = _section_of(text)\n    if section is None:\n        return [], \"invalid_yaml\"\n    try:\n        validated = SECTION_SCHEMA(section)\n    except vol.Invalid:\n        return [], \"invalid_config\"\n    entries = parse_users({DOMAIN: validated})\n    if problem := _problem(entries):\n        return [], problem\n    return [user_options(str(e.user_id), e.filter, e.names) for e in entries], None\n\n\ndef _section_of(text: str) -> dict[str, Any] | None:\n    \"\"\"Return the `haac_bridge:` content of YAML [text] (or the text itself when it has no such key), or None.\n\n    Plain YAML only: Home Assistant tags such as `!include`, `!env_var` or `!secret` are rejected,\n    so pasted text can never read files or environment variables (review finding S6).\n    \"\"\"\n    try:\n        data = yaml.safe_load(text)\n    except yaml.YAMLError:\n        return None\n    section = data.get(DOMAIN, data) if isinstance(data, dict) else None\n    return section if isinstance(section, dict) else None\n\n\ndef _problem(entries: list[UserEntry]) -> str | None:\n    \"\"\"Return the key of the first reason the entries cannot become UI users, or None.\"\"\"\n    if not entries:\n        return \"no_users\"\n    if any(entry.user_id is None for entry in entries):\n        return \"needs_user_id\"\n    if any(not any(entry.filter.get(key) for key in INCLUDE_KEYS) for entry in entries):\n        return \"no_include\"\n    return None\n","custom_components/haac_bridge/config/users.py":"\"\"\"Matches configured user entries to Home Assistant users (concept 10.2, 10.3).\"\"\"\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant\n\nfrom .schema import UserEntry\n\n_HA_AUTH_PROVIDER = \"homeassistant\"\n\n\ndef normalize_username(username: str) -> str:\n    \"\"\"Return the username in the form HA's own auth provider compares it.\"\"\"\n    return username.strip().casefold()\n\n\ndef usernames_of(user: User) -> set[str]:\n    \"\"\"Return the normalized login names of a user from its HA auth provider credentials.\"\"\"\n    return {\n        normalize_username(credential.data[\"username\"])\n        for credential in user.credentials\n        if credential.auth_provider_type == _HA_AUTH_PROVIDER and \"username\" in credential.data\n    }\n\n\ndef entry_matches(entry: UserEntry, user: User) -> bool:\n    \"\"\"Return True if the configuration entry refers to this HA user.\"\"\"\n    if entry.user_id is not None:\n        return entry.user_id == user.id\n    if entry.username is not None:\n        return normalize_username(entry.username) in usernames_of(user)\n    return False\n\n\nasync def async_find_unknown_entries(\n    hass: HomeAssistant, entries: list[UserEntry]\n) -> list[UserEntry]:\n    \"\"\"Return the entries that match no existing HA user.\"\"\"\n    users = await hass.auth.async_get_users()\n    return [entry for entry in entries if not any(entry_matches(entry, user) for user in users)]\n","custom_components/haac_bridge/config_flow.py":"\"\"\"Config flow and options flow: set up HAAC Bridge and choose per user what the app may see (concept 10.2).\"\"\"\n\nfrom collections import Counter\nfrom typing import Any\n\nfrom homeassistant.config_entries import ConfigEntry, ConfigFlow, ConfigFlowResult, OptionsFlow\nfrom homeassistant.core import callback\nfrom homeassistant.helpers.entityfilter import (\n    CONF_EXCLUDE_DOMAINS,\n    CONF_EXCLUDE_ENTITIES,\n    CONF_EXCLUDE_ENTITY_GLOBS,\n    CONF_INCLUDE_DOMAINS,\n    CONF_INCLUDE_ENTITIES,\n    CONF_INCLUDE_ENTITY_GLOBS,\n)\nfrom homeassistant.helpers.selector import (\n    EntitySelector,\n    EntitySelectorConfig,\n    SelectOptionDict,\n    SelectSelector,\n    SelectSelectorConfig,\n    SelectSelectorMode,\n    TextSelector,\n    TextSelectorConfig,\n)\nimport voluptuous as vol\n\nfrom .audit.levels import merge_settings, yaml_keys\nfrom .config.schema import valid_glob\nfrom .config.ui_users import FILTER_KEYS, INCLUDE_KEYS, user_options, users_of\nfrom .config.ui_yaml import export_users, import_users\nfrom .const import (\n    CONF_ACTIVITY,\n    CONF_LEVEL,\n    CONF_LOGGING,\n    CONF_NAMES,\n    CONF_USER_ID,\n    CONF_USERS,\n    DOMAIN,\n    SUPPORTED_DOMAINS,\n)\nfrom .core.log_settings import LogLevel\nfrom .core.runtime import get_data\n\n_DOMAIN_SELECTOR = SelectSelector(\n    SelectSelectorConfig(\n        options=list(SUPPORTED_DOMAINS), multiple=True, mode=SelectSelectorMode.LIST\n    )\n)\n_ENTITY_SELECTOR = EntitySelector(\n    EntitySelectorConfig(domain=list(SUPPORTED_DOMAINS), multiple=True)\n)\n_GLOB_SELECTOR = TextSelector(TextSelectorConfig(multiple=True))\n\n_SELECTORS = {\n    CONF_INCLUDE_DOMAINS: _DOMAIN_SELECTOR,\n    CONF_INCLUDE_ENTITIES: _ENTITY_SELECTOR,\n    CONF_INCLUDE_ENTITY_GLOBS: _GLOB_SELECTOR,\n    CONF_EXCLUDE_DOMAINS: _DOMAIN_SELECTOR,\n    CONF_EXCLUDE_ENTITIES: _ENTITY_SELECTOR,\n    CONF_EXCLUDE_ENTITY_GLOBS: _GLOB_SELECTOR,\n}\n\"\"\"One selector per filter rule, in the order of the form.\"\"\"\n\n_GLOB_KEYS = (CONF_INCLUDE_ENTITY_GLOBS, CONF_EXCLUDE_ENTITY_GLOBS)\n\nMENU_ADD = \"add_user\"\nMENU_EDIT = \"edit_user\"\nMENU_REMOVE = \"remove_user\"\nMENU_EXPORT = \"export_yaml\"\nMENU_IMPORT = \"import_yaml\"\nMENU_LOGGING = \"logging\"\nCONF_YAML = \"yaml\"\nINACTIVE_LABEL_SUFFIX = \" (deactivated)\"\n\n\nclass HaacBridgeConfigFlow(ConfigFlow, domain=DOMAIN):\n    \"\"\"Adds HAAC Bridge once; the users are chosen afterwards in the options.\"\"\"\n\n    VERSION = 1\n\n    async def async_step_user(self, user_input: dict[str, Any] | None = None) -> ConfigFlowResult:\n        \"\"\"Ask for a confirmation, then create the entry without any user.\"\"\"\n        if user_input is None:\n            return self.async_show_form(step_id=\"user\")\n        return self.async_create_entry(title=\"HAAC Bridge\", data={})\n\n    async def async_step_import(self, import_data: dict[str, Any]) -> ConfigFlowResult:\n        \"\"\"Create the entry for an installation that is configured in YAML only (concept 19.5).\n\n        The schedule entities need a config entry, so the bridge adds one by itself.\n        \"\"\"\n        return self.async_create_entry(title=\"HAAC Bridge\", data={})\n\n    @staticmethod\n    @callback\n    def async_get_options_flow(config_entry: ConfigEntry) -> OptionsFlow:\n        \"\"\"Return the options flow that edits the users of this entry.\"\"\"\n        return HaacBridgeOptionsFlow()\n\n\nclass HaacBridgeOptionsFlow(OptionsFlow):\n    \"\"\"Menu to add, change, remove, export and import the users the app may show entities to (concept 10.2).\"\"\"\n\n    def __init__(self) -> None:\n        \"\"\"Start without a user selected.\"\"\"\n        self._user_id: str | None = None\n        self._rules: dict[str, list[str]] = {}\n\n    async def async_step_init(self, user_input: dict[str, Any] | None = None) -> ConfigFlowResult:\n        \"\"\"Show the menu; changing, removing and exporting need an already configured user.\"\"\"\n        options = [MENU_ADD] if await self._async_free_users() else []\n        if users_of(self.config_entry.options):\n            options += [MENU_EDIT, MENU_REMOVE, MENU_EXPORT]\n        return self.async_show_menu(\n            step_id=\"init\", menu_options=[*options, MENU_IMPORT, MENU_LOGGING]\n        )\n\n    async def async_step_logging(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Choose the log level and whether switching actions appear in Activity (concept 21.2).\n\n        A value the YAML `logging` block sets wins; the form names those values.\n        \"\"\"\n        data = get_data(self.hass)\n        if user_input is not None:\n            return self.async_create_entry(\n                data={**self.config_entry.options, CONF_LOGGING: user_input}\n            )\n        current = merge_settings({}, self.config_entry.options.get(CONF_LOGGING))\n        schema = vol.Schema(\n            {\n                vol.Required(CONF_LEVEL, default=current.level.value): SelectSelector(\n                    SelectSelectorConfig(\n                        options=[level.value for level in LogLevel],\n                        translation_key=CONF_LEVEL,\n                        mode=SelectSelectorMode.DROPDOWN,\n                    )\n                ),\n                vol.Required(CONF_ACTIVITY, default=current.activity): bool,\n            }\n        )\n        fixed = sorted(yaml_keys(data.yaml_logging))\n        return self.async_show_form(\n            step_id=MENU_LOGGING,\n            data_schema=schema,\n            description_placeholders={\"yaml\": \", \".join(fixed) if fixed else \"-\"},\n        )\n\n    async def async_step_export_yaml(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Show the UI users as YAML to copy; confirming returns to the menu without a change.\"\"\"\n        if user_input is not None:\n            return await self.async_step_init()\n        return self.async_show_form(\n            step_id=MENU_EXPORT,\n            data_schema=vol.Schema({}),\n            description_placeholders={\"yaml\": export_users(self.config_entry.options)},\n        )\n\n    async def async_step_import_yaml(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Take over users from pasted YAML; a user in the YAML replaces that user's entry here.\"\"\"\n        errors: dict[str, str] = {}\n        text = (user_input or {}).get(CONF_YAML, \"\")\n        if user_input is not None:\n            records, error = import_users(text)\n            if error is None and not await self._async_all_importable(records):\n                error = \"unknown_user\"\n            if error is None:\n                imported = {record[CONF_USER_ID]: record for record in records}\n                others = [\n                    r\n                    for r in users_of(self.config_entry.options)\n                    if r[CONF_USER_ID] not in imported\n                ]\n                return self._save_users([*others, *imported.values()])\n            errors[\"base\"] = error\n        schema = vol.Schema(\n            {\n                vol.Required(CONF_YAML, description={\"suggested_value\": text}): TextSelector(\n                    TextSelectorConfig(multiline=True)\n                )\n            }\n        )\n        return self.async_show_form(step_id=MENU_IMPORT, data_schema=schema, errors=errors)\n\n    async def _async_all_importable(self, records: list[dict[str, Any]]) -> bool:\n        \"\"\"Return True if every record names a user the form offers or one that already has an entry.\"\"\"\n        allowed = {user[\"value\"] for user in await self._async_users()} | self._configured_ids()\n        return all(record[CONF_USER_ID] in allowed for record in records)\n\n    async def async_step_add_user(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Choose a Home Assistant user that has no entry yet.\"\"\"\n        free = await self._async_free_users()\n        if user_input is not None:\n            self._user_id = user_input[CONF_USER_ID]\n            self._rules = {}\n            return await self.async_step_filter()\n        return self.async_show_form(step_id=\"add_user\", data_schema=_user_schema(free))\n\n    async def async_step_edit_user(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Choose one of the configured users to change.\"\"\"\n        if user_input is not None:\n            self._user_id = user_input[CONF_USER_ID]\n            self._rules = dict(self._record(self._user_id).get(\"filter\", {}))\n            return await self.async_step_filter()\n        return self.async_show_form(\n            step_id=\"edit_user\", data_schema=_user_schema(await self._async_configured_users())\n        )\n\n    async def async_step_remove_user(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Remove a configured user; the app then shows this user no entities.\n\n        If the user has schedules, a confirmation says how many are deleted with the entry.\n        \"\"\"\n        if user_input is not None:\n            self._user_id = user_input[CONF_USER_ID]\n            if self._schedule_count(self._user_id):\n                return await self.async_step_confirm_remove()\n            return self._remove(self._user_id)\n        return self.async_show_form(\n            step_id=\"remove_user\", data_schema=_user_schema(await self._async_configured_users())\n        )\n\n    async def async_step_confirm_remove(\n        self, user_input: dict[str, Any] | None = None\n    ) -> ConfigFlowResult:\n        \"\"\"Ask for a confirmation that names the number of schedules that will be deleted.\"\"\"\n        if self._user_id is None:\n            return self.async_abort(reason=\"unknown\")\n        if user_input is not None:\n            return self._remove(self._user_id)\n        user = await self.hass.auth.async_get_user(self._user_id)\n        return self.async_show_form(\n            step_id=\"confirm_remove\",\n            data_schema=vo
