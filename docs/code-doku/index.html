 str]]], None],\n) -> None:\n    \"\"\"Register how the Activity page shows the events of the bridge.\"\"\"\n\n    @callback\n    def _describe(event: Event) -> dict[str, str]:\n        \"\"\"Return the name, the message and, if known, the entity of one event.\"\"\"\n        entry = {LOGBOOK_ENTRY_NAME: \"HAAC Bridge\", LOGBOOK_ENTRY_MESSAGE: describe(event.data)}\n        if entity_id := event.data.get(\"entity_id\"):\n            entry[LOGBOOK_ENTRY_ENTITY_ID] = entity_id\n        return entry\n\n    async_describe_event(DOMAIN, EVENT_ACTION, _describe)\n","custom_components/haac_bridge/schedules/__init__.py":"\"\"\"Schedules: store, trigger planning, runner, user lifecycle and HA entities (concept 19).\"\"\"\n","custom_components/haac_bridge/schedules/disabled.py":"\"\"\"How a deactivated entity affects the schedules of its user: blocking, switching off and on (concept 7.5).\"\"\"\n\nfrom datetime import datetime\nfrom typing import TYPE_CHECKING\n\nfrom ..core.errors import ErrorCode, ScheduleError\nfrom .model import OffReason, Schedule\n\nif TYPE_CHECKING:\n    from ..core.runtime import DisabledEntities\n\n\ndef blocked_by(disabled: DisabledEntities, schedule: Schedule) -> list[str]:\n    \"\"\"Return the entities of the schedule that its owner deactivated, in the order of the schedule.\"\"\"\n    deactivated = disabled.entities_of(schedule.owner)\n    return [entity_id for entity_id in schedule.entities if entity_id in deactivated]\n\n\ndef require_unblocked(disabled: DisabledEntities, schedule: Schedule) -> None:\n    \"\"\"Raise HAB-SCH-008 if the schedule contains an entity its owner deactivated.\"\"\"\n    if blocked_by(disabled, schedule):\n        raise ScheduleError(ErrorCode.SCH_BLOCKED)\n\n\ndef changes_for(\n    disabled: DisabledEntities,\n    schedules: list[Schedule],\n    entity_id: str,\n    now: datetime,\n) -> tuple[list[Schedule], list[str]]:\n    \"\"\"Return the schedules to store after `entity_id` was deactivated or activated, and the ids switched.\n\n    `schedules` are the owner's; `disabled` already holds the new state. Every schedule that contains\n    the entity gets a new `updated_at`, so the revision changes and the app reads `blocked_by` again.\n    A deactivation switches the enabled ones off with `off_reason`; an activation switches those with\n    that reason on again unless another of their entities is still deactivated. A schedule the user\n    switched off themselves (no `off_reason`) stays off.\n    \"\"\"\n    replace: list[Schedule] = []\n    switched: list[str] = []\n    for schedule in schedules:\n        if entity_id not in schedule.entities:\n            continue\n        updated = schedule.with_changes(updated_at=now)\n        if schedule.enabled and blocked_by(disabled, schedule):\n            updated = updated.with_changes(enabled=False, off_reason=OffReason.ENTITY_DISABLED)\n        elif schedule.off_reason is OffReason.ENTITY_DISABLED and not blocked_by(\n            disabled, schedule\n        ):\n            updated = updated.with_changes(enabled=True, off_reason=None)\n        if updated.enabled != schedule.enabled:\n            switched.append(schedule.id)\n        replace.append(updated)\n    return replace, switched\n","custom_components/haac_bridge/schedules/entities.py":"\"\"\"The HA entities of a schedule: an `enabled` switch and a `next run` sensor (concept 19.5).\"\"\"\n\nfrom collections.abc import Callable, Mapping\nfrom datetime import datetime\nfrom typing import Any\n\nfrom homeassistant.auth import EVENT_USER_UPDATED\nfrom homeassistant.components.sensor import SensorDeviceClass, SensorEntity\nfrom homeassistant.components.switch import SwitchEntity\nfrom homeassistant.config_entries import ConfigEntry\nfrom homeassistant.core import Event, HomeAssistant, callback\nfrom homeassistant.helpers import entity_registry as er\nfrom homeassistant.helpers.device_registry import DeviceEntryType, DeviceInfo\nfrom homeassistant.helpers.dispatcher import async_dispatcher_connect\nfrom homeassistant.helpers.entity import Entity\nfrom homeassistant.helpers.entity_platform import AddEntitiesCallback\n\nfrom ..const import DOMAIN, SIGNAL_SCHEDULE_CHANGED, SIGNAL_SCHEDULES_CHANGED\nfrom .manager import ScheduleManager\nfrom .model import Schedule\n\nPLATFORM_SWITCH = \"switch\"\nPLATFORM_SENSOR = \"sensor\"\nSUFFIX_ENABLED = \"enabled\"\nSUFFIX_NEXT_RUN = \"next_run\"\nUNIQUE_ID_PREFIX = f\"{DOMAIN}_schedule_\"\n\nDEVICE_INFO = DeviceInfo(\n    identifiers={(DOMAIN, \"schedules\")},\n    name=\"HAAC Schedules\",\n    manufacturer=\"HAAC Bridge\",\n    entry_type=DeviceEntryType.SERVICE,\n)\n\"\"\"The one device all schedule entities belong to.\"\"\"\n\n\ndef unique_id(schedule_id: str, suffix: str) -> str:\n    \"\"\"Return the unique id of a schedule entity, e.g. `haac_bridge_schedule_<id>_enabled`.\"\"\"\n    return f\"{UNIQUE_ID_PREFIX}{schedule_id}_{suffix}\"\n\n\ndef schedule_id_of(entity_unique_id: str) -> str | None:\n    \"\"\"Return the schedule id inside a unique id of this integration, or None if it has another form.\"\"\"\n    if not entity_unique_id.startswith(UNIQUE_ID_PREFIX):\n        return None\n    for suffix in (SUFFIX_ENABLED, SUFFIX_NEXT_RUN):\n        if entity_unique_id.endswith(f\"_{suffix}\"):\n            return entity_unique_id[len(UNIQUE_ID_PREFIX) : -len(suffix) - 1]\n    return None\n\n\nclass ScheduleEntity(Entity):\n    \"\"\"Common part of the schedule entities: it follows the schedule in the store.\"\"\"\n\n    _attr_should_poll = False\n    _attr_has_entity_name = True\n    _attr_device_info = DEVICE_INFO\n\n    def __init__(self, manager: ScheduleManager, schedule_id: str, suffix: str) -> None:\n        \"\"\"Remember the schedule this entity shows and give it its unique id.\"\"\"\n        self._manager = manager\n        self._schedule_id = schedule_id\n        self._attr_unique_id = unique_id(schedule_id, suffix)\n        self._owner_name: str | None = None\n\n    @property\n    def schedule(self) -> Schedule | None:\n        \"\"\"Return the schedule as it is stored now, or None if it was removed.\"\"\"\n        return self._manager.store.get(self._schedule_id)\n\n    @property\n    def available(self) -> bool:\n        \"\"\"Return True while the schedule exists.\"\"\"\n        return self.schedule is not None\n\n    async def async_added_to_hass(self) -> None:\n        \"\"\"Refresh when this schedule changes, runs or is paused, and when its owner is renamed.\"\"\"\n        self.async_on_remove(\n            async_dispatcher_connect(\n                self.hass, SIGNAL_SCHEDULE_CHANGED.format(self._schedule_id), self._handle_change\n            )\n        )\n        self.async_on_remove(\n            self.hass.bus.async_listen(\n                EVENT_USER_UPDATED, self._handle_owner_change, event_filter=self._is_owner_event\n            )\n        )\n\n    async def async_update(self) -> None:\n        \"\"\"Look up the owner's name, which can only be read asynchronously; runs when added and on renames.\"\"\"\n        if (schedule := self.schedule) is None:\n            return\n        owner = await self.hass.auth.async_get_user(schedule.owner)\n        self._owner_name = owner.name if owner else None\n\n    @callback\n    def _is_owner_event(self, event_data: Mapping[str, Any]) -> bool:\n        \"\"\"Return True for a user event about this schedule's owner.\"\"\"\n        schedule = self.schedule\n        return schedule is not None and event_data.get(\"user_id\") == schedule.owner\n\n    @callback\n    def _handle_owner_change(self, _event: Event) -> None:\n        \"\"\"Read the owner's name again after the owner changed.\"\"\"\n        self.async_schedule_update_ha_state(True)\n\n    @property\n    def _label(self) -> str | None:\n        \"\"\"Return the schedule name followed by its owner in brackets, so equal names stay apart.\"\"\"\n        schedule = self.schedule\n        if schedule is None:\n            return None\n        return f\"{schedule.name} ({self._owner_name})\" if self._owner_name else schedule.name\n\n    @callback\n    def _handle_change(self) -> None:\n        \"\"\"Write the state after this schedule changed; a removed schedule's entity is being removed.\"\"\"\n        if self.schedule is None:\n            return\n        self.async_write_ha_state()\n\n\nclass ScheduleEnabledSwitch(ScheduleEntity, SwitchEntity):\n    \"\"\"Shows and sets whether the schedule is enabled; a system pause does not change it.\"\"\"\n\n    def __init__(self, manager: ScheduleManager, schedule_id: str) -> None:\n        \"\"\"Create the switch of one schedule.\"\"\"\n        super().__init__(manager, schedule_id, SUFFIX_ENABLED)\n\n    @property\n    def name(self) -> str | None:\n        \"\"\"Return the schedule name with its owner, which follows renames.\"\"\"\n        return self._label\n\n    @property\n    def is_on(self) -> bool | None:\n        \"\"\"Return whether the schedule is enabled.\"\"\"\n        schedule = self.schedule\n        return schedule.enabled if schedule else None\n\n    async def async_turn_on(self, **kwargs: Any) -> None:\n        \"\"\"Enable the schedule.\"\"\"\n        await self._manager.async_set_enabled(self._schedule_id, enabled=True)\n\n    async def async_turn_off(self, **kwargs: Any) -> None:\n        \"\"\"Disable the schedule.\"\"\"\n        await self._manager.async_set_enabled(self._schedule_id, enabled=False)\n\n\nclass ScheduleNextRunSensor(ScheduleEntity, SensorEntity):\n    \"\"\"Shows when the schedule runs next; unknown while it is disabled or paused.\"\"\"\n\n    _attr_device_class = SensorDeviceClass.TIMESTAMP\n\n    def __init__(self, manager: ScheduleManager, schedule_id: str) -> None:\n        \"\"\"Create the sensor of one schedule.\"\"\"\n        super().__init__(manager, schedule_id, SUFFIX_NEXT_RUN)\n\n    @property\n    def name(self) -> str | None:\n        \"\"\"Return the schedule name with its owner, followed by `next run`.\"\"\"\n        label = self._label\n        return f\"{label} next run\" if label else None\n\n    @property\n    def native_value(self) -> datetime | None:\n        \"\"\"Return the planned time of the next run.\"\"\"\n        return self._manager.planner.planned_run(self._schedule_id)\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any] | None:\n        \"\"\"Return owner, pause reason and last run.\"\"\"\n        schedule = self.schedule\n        if schedule is None:\n            return None\n        last_run = schedule.last_run\n        return {\n            \"owner\": schedule.owner,\n            \"owner_name\": self._owner_name,\n            \"paused_reason\": schedule.paused.reason.value if schedule.paused else None,\n            \"last_run\": None\n            if last_run is None\n            else {\n                \"at\": last_run.at.isoformat(),\n                \"result\": last_run.result.value,\n                \"code\": last_run.code,\n            },\n        }\n\n\nclass ScheduleEntityManager:\n    \"\"\"Keeps one switch and one sensor per schedule in step with the store (concept 19.5).\"\"\"\n\n    def __init__(self, hass: HomeAssistant, manager: ScheduleManager, entry: ConfigEntry) -> None:\n        \"\"\"Remember the manager and start following schedule changes until the entry unloads.\"\"\"\n        self._hass = hass\n        self._manager = manager\n        self._adders: dict[str, AddEntitiesCallback] = {}\n        self._known: dict[str, set[str]] = {PLATFORM_SWITCH: set(), PLATFORM_SENSOR: set()}\n        entry.async_on_unload(\n            async_dispatcher_connect(hass, SIGNAL_SCHEDULES_CHANGED, self._async_sync)\n        )\n\n    @callback\n    def async_setup_platform(self, platform: str, async_add_entities: AddEntitiesCallback) -> None:\n        \"\"\"Take over the add function of a platform and create the entities of all schedules.\"\"\"\n        self._adders[platform] = async_add_entities\n        self._async_sync()\n\n    @callback\n    def async_sweep(self) -> None:\n        \"\"\"Remove registry entries whose schedule no longer exists (also after a missed removal).\"\"\"\n        registry = er.async_get(self._hass)\n        known = {schedule.id for schedule in self._manager.store.schedules}\n        for entry in list(registry.entities.values()):\n            if entry.platform != DOMAIN:\n                continue\n            schedule_id = schedule_id_of(entry.unique_id)\n            if schedule_id is not None and schedule_id not in known:\n                registry.async_remove(entry.entity_id)\n\n    @callback\n    def _async_sync(self) -> None:\n        \"\"\"Create the entities of new schedules and remove those of removed ones.\"\"\"\n        ids = {schedule.id for schedule in self._manager.store.schedules}\n        builders: dict[str, Callable[[ScheduleManager, str], ScheduleEntity]] = {\n            PLATFORM_SWITCH: ScheduleEnabledSwitch,\n            PLATFORM_SENSOR: ScheduleNextRunSensor,\n        }\n        for platform, add in self._adders.items():\n            known = self._known[platform]\n            new = sorted(ids - known)\n            if new:\n                add([builders[platform](self._manager, schedule_id) for schedule_id in new], True)\n                known.update(new)\n        stale = {sid for known in self._known.values() for sid in known} - ids\n        if stale:\n            self._async_remove(stale)\n\n    def _async_remove(self, schedule_ids: set[str]) -> None:\n        \"\"\"Remove the entities of removed schedules from the registry, which also removes their states.\"\"\"\n        registry = er.async_get(self._hass)\n        for schedule_id in schedule_ids:\n            for platform, suffix in (\n                (PLATFORM_SWITCH, SUFFIX_ENABLED),\n                (PLATFORM_SENSOR, SUFFIX_NEXT_RUN),\n            ):\n                entity_id = registry.async_get_entity_id(\n                    platform, DOMAIN, unique_id(schedule_id, suffix)\n                )\n                if entity_id is not None:\n                    registry.async_remove(entity_id)\n                self._known[platform].discard(schedule_id)\n","custom_components/haac_bridge/schedules/manager.py":"\"\"\"ScheduleManager: store, planner and runner together, and the operations of the commands (concept 19.4).\"\"\"\n\nfrom datetime import date, datetime\nimport hashlib\nfrom typing import Any\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.helpers.dispatcher import async_dispatcher_send\nfrom homeassistant.util import dt as dt_util\n\nfrom ..audit.factory import user_label\nfrom ..const import (\n    MAX_SCHEDULES_PER_USER,\n    MAX_SKIPPED_DATES,\n    RUN_NOW_COOLDOWN,\n    SIGNAL_SCHEDULE_CHANGED,\n    SIGNAL_SCHEDULES_CHANGED,\n)\nfrom ..core.errors import ErrorCode, RequestError, ScheduleError\nfrom ..core.runtime import get_data\nfrom .disabled import blocked_by, require_unblocked\nfrom .model import (\n    Paused,\n    PauseReason,\n    RepeatFreq,\n    Schedule,\n    check_repeat,\n    new_schedule,\n    parse_action,\n    parse_enabled,\n    parse_entities,\n    parse_name,\n    parse_notify,\n    parse_repeat,\n    parse_skip_date,\n    parse_when,\n)\nfrom .planner import SchedulePlanner\nfrom .repairs import async_sync_unreadable_issue\nfrom .run_log import ScheduleRunLog\nfrom .runner import RunHooks, ScheduleRunner\nfrom .store import ScheduleStore\nfrom .triggers import TriggerFactory\n\nSCOPE_OWN = \"own\"\nSCOPE_ALL = \"all\"\n\n\ndef _parse_version(updated_at: str) -> datetime:\n    \"\"\"Return the version a client sends back, or raise HAB-WS-001 if it is no date and time.\"\"\"\n    try:\n        version = dt_util.parse_datetime(updated_at)\n    except ValueError:\n        version = None\n    if version is None:\n        raise RequestError(ErrorCode.WS_INVALID_REQUEST)\n    return version\n\n\ndef _summary(schedule: Schedule) -> dict[str, Any]:\n    \"\"\"Return what the audit log says about a new schedule: action, number of entities, repeat, enabled.\"\"\"\n    return {\n        \"action\": schedule.action.value,\n        \"entities\": len(schedule.entities),\n        \"repeat\": schedule.repeat.freq.value,\n        \"enabled\": schedule.enabled,\n    }\n\n\nclass ScheduleManager:\n    \"\"\"Creates, changes, deletes, lists and runs schedules for the commands, as a given user.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Wire the store, the planner and the runner; call `async_load` and `async_start` next.\"\"\"\n        self._hass = hass\n        # False until the config entry has loaded the UI users, and while it is unloaded or disabled.\n        # Runs wait and sweeps do nothing then, so UI users never look unconfigured by mistake.\n        self.users_ready = False\n        self.store = ScheduleStore(hass)\n        self._triggers = TriggerFactory(hass)\n        self.planner = SchedulePlanner(\n            hass,\n            self.store,\n            self._triggers,\n            self._async_run_due,\n            self.notify,\n        )\n        self.planner.on_missed = self._async_log_missed\n        hooks = RunHooks(\n            self.async_remove,\n            self.planner.async_plan,\n            self.notify,\n            lambda: self.users_ready,\n            self.planner.ends_with_run,\n        )\n        self.run_log = ScheduleRunLog(hass)\n        self.runner = ScheduleRunner(hass, self.store, hooks, self.run_log)\n        self._manual_runs: dict[str, float] = {}\n\n    async def async_load(self) -> None:\n        \"\"\"Read the schedules and the run log from storage and report entries that could not be read.\"\"\"\n        await self.store.async_load()\n        await self.run_log.async_load()\n        async_sync_unreadable_issue(self._hass, self.store.unreadable_count)\n\n    async def async_start(self) -> None:\n        \"\"\"Start planning; call when Home Assistant has started.\"\"\"\n        await self.planner.async_start()\n\n    @callback\n    def async_stop(self) -> None:\n        \"\"\"Cancel all timers and the runs still going on in the background.\"\"\"\n        self.planner.async_stop()\n        self.runner.async_cancel_all()\n\n    @callback\n    def notify(self, *schedule_ids: str) -> None:\n        \"\"\"Tell subscribers that schedules changed, ran, were paused or were removed.\n\n        Subscriptions and the entity manager get one general signal; the entities of each named\n        schedule get their own signal, so a run does not rewrite the state of every schedule.\n        \"\"\"\n        async_dispatcher_send(self._hass, SIGNAL_SCHEDULES_CHANGED)\n        for schedule_id in schedule_ids:\n            async_dispatcher_send(self._hass, SIGNAL_SCHEDULE_CHANGED.format(schedule_id))\n\n    async def _async_run_due(self, schedule_id: str) -> None:\n        \"\"\"Run a schedule whose time has come.\"\"\"\n        await self.runner.async_run(schedule_id)\n\n    async def _async_log_missed(self, schedule: Schedule, at: datetime, *, last: bool) -> None:\n        \"\"\"Log a run HA missed; if it was the last one, the schedule is removed (concept 19.10).\"\"\"\n        self.runner.log_missed(schedule, at, removed=last)\n        if last:\n            await self.async_remove([schedule.id])\n        else:\n            self.notify(schedule.id)\n\n    @staticmethod\n    def scope_of(user: User) -> str:\n        \"\"\"Return `all` for admins, who see every schedule, and `own` for everybody else.\"\"\"\n        return SCOPE_ALL if user.is_admin else SCOPE_OWN\n\n    def visible_to(self, user: User) -> list[Schedule]:\n        \"\"\"Return the schedules the user may see: all for admins, their own for others.\"\"\"\n        return self.store.schedules if user.is_admin else self.store.by_owner(user.id)\n\n    def revision_for(self, user: User) -> str:\n        \"\"\"Return a hash over the visible schedules, the scope and the caller's newest run log entry.\n\n        Per schedule: id, version, `notify`, pause, last run, next run and skipped dates (concept 11.2, 19.12).\n        \"\"\"\n        digest = hashlib.sha256(self.scope_of(user).encode())\n        digest.update(f\"runs\\t{self.run_log.last_seq_of(user.id)}\\n\".encode())\n        for schedule in sorted(self.visible_to(user), key=lambda item: item.id):\n            paused = schedule.paused\n            last_run = schedule.last_run\n            planned = self.planner.planned_run(schedule.id)\n            parts = (\n                schedule.id,\n                schedule.updated_at.isoformat(),\n                str(schedule.notify),\n                f\"{paused.reason.value}@{paused.at.isoformat()}\" if paused else \"\",\n                last_run.at.isoformat() if last_run else \"\",\n                planned.isoformat() if planned else \"\",\n                \",\".join(sorted(day.isoformat() for day in schedule.skipped_dates)),\n            )\n            digest.update((\"\\t\".join(parts) + \"\\n\").encode())\n        return digest.hexdigest()\n\n    def runs_for(self, user: User, log_id: str | None, after_seq: int) -> dict[str, Any]:\n        \"\"\"Return `log_id`, `last_seq` and the user's own entries after the cursor (concept 19.11).\n\n        Admins get only their own entries as well. A `log_id` other than the log's own means the\n        app holds a cursor of an older log, so every entry is returned.\n        \"\"\"\n        after = after_seq if log_id == self.run_log.log_id else 0\n        return {\n            \"log_id\": self.run_log.log_id,\n            \"last_seq\": self.run_log.last_seq,\n            \"runs\": self.run_log.runs_of(user.id, after),\n        }\n\n    async def async_describe(self, schedule: Schedule, user: User) -> dict[str, Any]:\n        \"\"\"Return the stored form plus the owner's name, the computed next run and whether `user` owns it.\"\"\"\n        owner = await self._hass.auth.async_get_user(schedule.owner)\n        planned = self.planner.planned_run(schedule.id)\n        return {\n            **schedule.to_dict(),\n            \"owner_name\": owner.name if owner else None,\n            \"own\": schedule.owner == user.id,\n            \"blocked_by\": blocked_by(get_data(self._hass).disabled, schedule),\n            \"next_run\": planned.isoformat() if planned else None,\n            \"next_runs\": [run.isoformat() for run in self.planner.next_runs(schedule)],\n            \"upcoming_runs\": [\n                {\"at\": run.at.isoformat(), \"date\": run.day.isoformat(), \"skipped\": run.skipped}\n                for run in self.planner.upcoming_runs(schedule)\n            ],\n            \"expired\": self.planner.is_expired(schedule),\n        }\n\n    async def async_list(self, user: User) -> dict[str, Any]:\n        \"\"\"Return the revision, the scope and the visible schedules.\"\"\"\n        return {\n            \"revision\": self.revision_for(user),\n            \"scope\": self.scope_of(user),\n            \"schedules\": [await self.async_describe(item, user) for item in self.visible_to(user)],\n        }\n\n    async def async_create(self, user: User, fields: dict[str, Any]) -> Schedule:\n        \"\"\"Create a schedule owned by `user` after validating it and the exposure of its entities.\"\"\"\n        if len(self.store.by_owner(user.id)) >= MAX_SCHEDULES_PER_USER:\n            raise ScheduleError(ErrorCode.SCH_LIMIT)\n        schedule = new_schedule(user.id, fields)\n        self._check_exposed(user, schedule.entities)\n        self._require_unblocked_if_enabled(schedule)\n        await self.store.async_add(schedule)\n        await self.planner.async_plan(schedule.id)\n        self.notify(schedule.id)\n        self._audit_change(\"created\", user_label(user), schedule, **_summary(schedule))\n        return schedule\n\n    async def async_update(\n        self, user: User, schedule_id: str, updated_at: str, fields: dict[str, Any]\n    ) -> Schedule:\n        \"\"\"Change a schedule the user may edit; `updated_at` must be that of the edited version.\"\"\"\n        owner = await self._hass.auth.async_get_user(self._require(schedule_id).owner)\n        current = self._require(schedule_id)\n        self._require_access(user, current)\n        if _parse_version(updated_at) != current.updated_at:\n            raise ScheduleError(ErrorCode.SCH_CONFLICT)\n        changes = self._parse_changes(user, current, fields)\n        updated = self._without_ended_pause(\n            current.with_changes(updated_at=dt_util.utcnow(), **changes), owner\n        )\n        if updated.enabled != current.enabled:\n            updated = updated.with_changes(off_reason=None)\n        if \"repeat\" in changes or \"when\" in changes:\n            updated = self._with_valid_skips(updated)\n        self._require_unblocked_if_enabled(updated)\n        if updated.enabled and (not current.enabled or \"repeat\" in changes or \"when\" in changes):\n            self._require_dates_left(updated)\n        await self.store.async_replace(updated)\n        await self.planner.async_plan(updated.id)\n        self.notify(updated.id)\n        self._audit_change(\"updated\", user_label(user), updated, fields=\",\".join(sorted(changes)))\n        return updated\n\n    async def async_set_enabled(self, schedule_id: str, *, enabled: bool) -> None:\n        \"\"\"Enable or disable a schedule, as its `enabled` switch in HA does (concept 19.5).\n\n        Enabling a schedule that contains a deactivated entity is HAB-SCH-008 (concept 7.5).\n        \"\"\"\n        schedule = self._require(schedule_id)\n        if schedule.enabled == enabled:\n            return\n        updated = schedule.with_changes(\n            enabled=enabled, off_reason=None, updated_at=dt_util.utcnow()\n        )\n        self._require_unblocked_if_enabled(updated)\n        if enabled:\n            self._require_dates_left(schedule)\n        await self.store.async_replace(updated)\n        await self.planner.async_plan(schedule_id)\n        self.notify(schedule_id)\n        self._audit_change(\"enabled\" if enabled else \"disabled\", \"ha\", updated)\n\n    async def async_skip_run(\n        self, user: User, schedule_id: str, raw_date: object, *, skip: bool\n    ) -> Schedule:\n        \"\"\"Skip the run of one date of a schedule, or take it up again (concept 19.12).\n\n        Only a date among the next runs can be skipped, and not if no run would be left (HAB-SCH-010).\n        The version `updated_at` stays, so an open editor does not run into a conflict.\n        \"\"\"\n        schedule = self._require(schedule_id)\n        self._require_access(user, schedule)\n        day = parse_skip_date(raw_date)\n        now = dt_util.utcnow()\n        kept = self._future_skips(schedule, now)\n        skipped = kept | {day} if skip else kept - {day}\n        if skip and day not in kept:\n            self._require_skippable(schedule, day, skipped, now)\n        if skipped != schedule.skipped_dates:\n            updated = schedule.with_changes(skipped_dates=skipped)\n            await self.store.async_replace(updated)\n            await self.planner.async_plan(schedule_id)\n            self.notify(schedule_id)\n            self._audit_change(\n                \"skipped\" if skip else \"unskipped\", user_label(user), updated, date=day.isoformat()\n            )\n            return updated\n        return schedule\n\n    async def async_wipe(self) -> None:\n        \"\"\"Delete every schedule and the storage file; called when the config entry is removed.\"\"\"\n        schedule_ids = [schedule.id for schedule in self.store.schedules]\n        await self.store.async_remove_file()\n        await self.run_log.async_remove_file()\n        async_sync_unreadable_issue(self._hass, 0)\n        for schedule_id in schedule_ids:\n            await self.planner.async_plan(schedule_id)\n        self.notify(*schedule_ids)\n\n    async def async_delete(self, user: User, schedule_id: str) -> None:\n        \"\"\"Delete a schedule the user may edit; an unknown id is not an error.\"\"\"\n        schedule = self.store.get(schedule_id)\n        if schedule is None:\n            return\n        self._require_access(user, schedule)\n        await self.async_remove([schedule_id])\n        self._audit_change(\"deleted\", user_label(user), schedule)\n\n    async def async_run_now(self, user: User, schedule_id: str, client: str | None = None) -> None:\n        \"\"\"Start one run of a schedule now, as its owner, without changing the plan.\n\n        Returns at once; the result arrives with `schedules_changed` like any other run (concept 19.4).\n        While the schedule runs, and for RUN_NOW_COOLDOWN seconds after a manual run, HAB-SCH-007.\n        \"\"\"\n        schedule = self._require(schedule_id)\n        self._require_access(user, schedule)\n        require_unblocked(get_data(self._hass).disabled, schedule)\n        now = self._hass.loop.time()\n        last = self._manual_runs.get(schedule_id)\n        if self.runner.is_running(schedule_id) or (\n            last is not None and now - last < RUN_NOW_COOLDOWN\n        ):\n            raise ScheduleError(ErrorCode.SCH_BUSY)\n        self._manual_runs[schedule_id] = now\n        self.runner.async_run_in_background(schedule_id, user.id, client)\n\n    async def async_sweep(self, owner_id: str | None = None) -> None:\n        \"\"\"Delete the schedules of users who are gone or not configured, pause those of inactive ones.\n\n        Runs after every change of the user list and at setup (concept 19.6.3). With `owner_id`\n        only that user's schedules are looked at. Everything is saved once and announced once.\n        Does nothing while the UI users are not loaded (`users_ready` is False).\n        \"\"\"\n        if not self.users_ready:\n            return\n        users = {user.id: user for user in await self._hass.auth.async_get_users()}\n        exposure = get_data(self._hass).exposure\n        gone = {\n            owner\n            for owner in self.run_log.owners()\n            if (user := users.get(owner)) is None or not exposure.is_configured(user)\n        }\n        if owner_id is not None:\n            gone &= {owner_id}\n        self._remove_runs_of(gone)\n        replace: list[Schedule] = []\n        remove: list[str] = []\n        for schedule in self.store.schedules:\n            if owner_id is not None and schedule.owner != owner_id:\n                continue\n            owner = users.get(schedule.owner)\n            if owner is None or not exposure.is_configured(owner):\n                remove.append(schedule.id)\n                continue\n            updated = self._with_owner_state(schedule, owner)\n            if updated != schedule:\n                replace.append(updated)\n        if not replace and not remove:\n            return\n        await self.store.async_apply_changes(replace, remove)\n        changed = [*(item.id for item in replace), *remove]\n        for schedule_id in changed:\n            await self.planner.async_plan(schedule_id)\n        self.notify(*changed)\n\n    async def async_remove_owner(self, owner_id: str) -> None:\n        \"\"\"Delete every schedule and run log entry of a user, as when the HA user was deleted (concept 19.6.1).\"\"\"\n        await self.async_remove([item.id for item in self.store.by_owner(owner_id)])\n        self._remove_runs_of({owner_id})\n\n    async def async_remove(self, schedule_ids: list[str]) -> None:\n        \"\"\"Remove schedules, stop their timers and tell subscribers.\"\"\"\n        removed = await self.store.async_remove(schedule_ids)\n        for schedule in removed:\n            self._manual_runs.pop(schedule.id, None)\n            await self.planner.async_plan(schedule.id)\n        if removed:\n            self.notify(*(schedule.id for schedule in removed))\n\n    def _audit_change(self, change: str, by: str, schedule: Schedule, **details: Any) -> None:\n        \"\"\"Write a change of a schedule to the audit log (concept 21.3).\"\"\"\n        data = get_data(self._hass)\n        data.audit.record(\n            data.audit_entries.schedule_changed(\n                change=change, by=by, schedule=schedule, details=details\n            )\n        )\n\n    def _remove_runs_of(self, owner_ids: set[str]) -> None:\n        \"\"\"Delete the run log entries of users who are gone or no longer configured (concept 19.11).\"\"\"\n        if self.run_log.remove_owners(owner_ids):\n            self.notify()\n\n    def _require(self, schedule_id: str) -> Schedule:\n        \"\"\"Return the schedule or raise HAB-SCH-003.\"\"\"\n        schedule = self.store.get(schedule_id)\n        if schedule is None:\n            raise ScheduleError(ErrorCode.SCH_NOT_FOUND)\n        return schedule\n\n    @staticmethod\n    def _require_access(user: User, schedule: Schedule) -> None:\n        \"\"\"Allow the owner and admins; anybody else gets HAB-SCH-006.\"\"\"\n        if schedule.owner != user.id and not user.is_admin:\n            raise ScheduleError(ErrorCode.SCH_NOT_ALLOWED)\n\n    @staticmethod\n    def _future_skips(schedule: Schedule, now: datetime) -> frozenset[date]:\n        \"\"\"Return the skipped dates that are not in the past; the others are dropped on the next change.\"\"\"\n        today = dt_util.as_local(now).date()\n        return frozenset(day for day in schedule.skipped_dates if day >= today)\n\n    def _require_skippable(\n        self, schedule: Schedule, day: date, skipped: frozenset[date], now: datetime\n    ) -> None:\n        \"\"\"Raise HAB-SCH-010 unless `day` is one of the next runs, skipping it keeps a run and the limit holds.\"\"\"\n        upcoming = {\n            found for _, found in self._triggers.run_dates(schedule.when, schedule.repeat, now)\n        }\n        left = self._triggers.create(schedule.when, schedule.repeat, skipped).next_run(now)\n        if day not in upcoming or left is None or len(skipped) > MAX_SKIPPED_DATES:\n            raise ScheduleError(ErrorCode.SCH_SKIP_INVALID)\n\n    def _with_valid_skips(self, schedule: Schedule) -> Schedule:\n        \"\"\"Return the schedule keeping only the skips that still are runs of its changed rule.\n\n        If that would leave no run at all, no run is skipped any more (concept 19.12).\n        \"\"\"\n        now = dt_util.utcnow()\n        rule = self._triggers.date_rule(schedule.when, schedule.repeat)\n        kept = frozenset(day for day in self._future_skips(schedule, now) if rule.matches(day))\n        if kept and self._triggers.is_ended(schedule.when, schedule.repeat, now, kept):\n            kept = frozenset()\n        return schedule.with_changes(skipped_dates=kept)\n\n    def _require_dates_left(self, schedule: Schedule) -> None:\n        \"\"\"Raise HAB-SCH-009 if the schedule has no date left, e.g. a one-off in the past (concept 19.10).\"\"\"\n        if self.planner.is_expired(schedule):\n            raise ScheduleError(ErrorCode.SCH_IN_PAST)\n\n    def _require_unblocked_if_enabled(self, schedule: Schedule) -> None:\n        \"\"\"Raise HAB-SCH-008 if the schedule would be enabled although its owner deactivated one of its entities.\"\"\"\n        if schedule.enabled:\n            require_unblocked(get_data(self._hass).disabled, schedule)\n\n    def _check_exposed(self, user: User, entities: tuple[str, ...]) -> None:\n        \"\"\"Require every entity to be exposed to the user; the bridge's own entities never are.\"\"\"\n        exposure = get_data(self._hass).exposure\n        if not all(exposure.is_exposed(user, entity_id) for entity_id in entities):\n            raise ScheduleError(ErrorCode.SCH_INVALID)\n\n    def _parse_changes(\n        self, user: User, schedule: Schedule, fields: dict[str, Any]\n    ) -> dict[str, Any]:\n        \"\"\"Return the validated changes of an update; only the owner may change the entities.\"\"\"\n        parsers = {\n            \"name\": parse_name,\n            \"enabled\": parse_enabled,\n            \"action\": parse_action,\n        }\n        changes = {name: parse(fields[name]) for name, parse in parsers.items() if name in fields}\n        changes.update(self._parse_dates(schedule, fields))\n        if \"notify\" in fields:\n            notify = parse_notify(fields[\"notify\"])\n            if notify != schedule.notify:\n                if user.id != schedule.owner:\n                    raise ScheduleError(ErrorCode.SCH_NOT_ALLOWED)\n                changes[\"notify\"] = notify\n        if \"entities\" in fields:\n            entities = parse_entities(fields[\"entities\"])\n            if entities != schedule.entities:\n                if user.id != schedule.owner:\n                    raise ScheduleError(ErrorCode.SCH_NOT_ALLOWED)\n                self._check_exposed(user, entities)\n                changes[\"entities\"] = entities\n        return changes\n\n    @staticmethod\n    def _parse_dates(schedule: Schedule, fields: dict[str, Any]) -> dict[str, Any]:\n        \"\"\"Return the validated `when` and `repeat` of an update; the weekdays belong to a weekly rule.\n\n        A new date rule gets today as its start date if it has none, and its dates are checked\n        against the current time (concept 19.10).\n        \"\"\"\n        if \"when\" not in fields and \"repeat\" not in fields:\n            return {}\n        today = dt_util.as_local(dt_util.utcnow()).date()\n        repeat = parse_repeat(fields[\"repeat\"], today) if \"repeat\" in fields else schedule.repeat\n        weekly = repeat.freq is RepeatFreq.WEEKLY\n        when = (\n            parse_when(fields[\"when\"], days_required=weekly) if \"when\" in fields else schedule.when\n        )\n        if weekly and not when.days:\n            raise ScheduleError(ErrorCode.SCH_INVALID)\n        check_repeat(repeat, when)\n        return {\"when\": when, \"repeat\": repeat}\n\n    def _with_owner_state(self, schedule: Schedule, owner: User) -> Schedule:\n        \"\"\"Return the schedule paused if its owner is inactive, or resumed if its pause has ended.\"\"\"\n        if owner.is_active:\n            return self._without_ended_pause(schedule, owner)\n        paused = schedule.paused\n        if paused is not None and paused.reason is PauseReason.OWNER_INACTIVE:\n            return schedule\n        return schedule.with_changes(paused=Paused(PauseReason.OWNER_INACTIVE, dt_util.utcnow()))\n\n    def _without_ended_pause(self, schedule: Schedule, owner: User | None) -> Schedule:\n        \"\"\"Return the schedule without a pause whose cause is gone (concept 19.5).\"\"\"\n        paused = schedule.paused\n        if paused is None or owner is None:\n            return schedule\n        exposure = get_data(self._hass).exposure\n        ended = (paused.reason is PauseReason.OWNER_INACTIVE and owner.is_active) or (\n            paused.reason is PauseReason.NO_ENTITIES\n            and any(exposure.is_exposed(owner, entity_id) for entity_id in schedule.entities)\n        )\n        return schedule.with_changes(paused=None) if ended else schedule\n","custom_components/haac_bridge/schedules/model.py":"\"\"\"Schedule data model, validation and (de)serialisation (concept 19.2).\"\"\"\n\nfrom collections.abc import Mapping\nfrom dataclasses import dataclass, field, replace\nfrom datetime import date, datetime, time\nfrom enum import StrEnum\nfrom typing import Any, TypeVar\nimport uuid\n\nfrom homeassistant.core import split_entity_id, valid_entity_id\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import (\n    MAX_ENTITIES_PER_SCHEDULE,\n    MAX_INTERVAL,\n    MAX_NAME_LENGTH,\n    MAX_OFFSET_MIN,\n    MAX_SKIPPED_DATES,\n    MAX_START_DATE_AHEAD,\n    SCHEDULE_DOMAIN,\n)\nfrom ..core.errors import ErrorCode, ScheduleError\n\nDAYS: frozenset[int] = frozenset(range(7))\n\"\"\"All weekdays, 0 = Monday.\"\"\"\n\n_E = TypeVar(\"_E\", bound=StrEnum)\n\n\nclass WhenType(StrEnum):\n    \"\"\"What triggers a schedule.\"\"\"\n\n    TIME = \"time\"\n    SUNRISE = \"sunrise\"\n    SUNSET = \"sunset\"\n\n\nclass Action(StrEnum):\n    \"\"\"What a schedule does with its entities.\"\"\"\n\n    TURN_ON = \"turn_on\"\n    TURN_OFF = \"turn_off\"\n    TOGGLE = \"toggle\"\n\n\nclass PauseReason(StrEnum):\n    \"\"\"Why the system paused a schedule (concept 19.6).\"\"\"\n\n    OWNER_INACTIVE = \"owner_inactive\"\n    NO_ENTITIES = \"no_entities\"\n    SUN_UNAVAILABLE = \"sun_unavailable\"\n\n\nclass RunResult(StrEnum):\n    \"\"\"Outcome of the last run.\"\"\"\n\n    OK = \"ok\"\n    PARTIAL = \"partial\"\n    FAILED = \"failed\"\n    MISSED = \"missed\"\n    \"\"\"Only in the run log (concept 19.11): HA was not running at the planned time; never a `last_run`.\"\"\"\n\n\nclass RepeatFreq(StrEnum):\n    \"\"\"On which dates a schedule runs (concept 19.10).\"\"\"\n\n    ONCE = \"once\"\n    DAILY = \"daily\"\n    WEEKLY = \"weekly\"\n    MONTHLY = \"monthly\"\n    YEARLY = \"yearly\"\n\n\nclass OffReason(StrEnum):\n    \"\"\"Why the bridge switched a schedule off by itself (concept 7.5).\"\"\"\n\n    ENTITY_DISABLED = \"entity_disabled\"\n\n\nclass RunTrigger(StrEnum):\n    \"\"\"What started a run: the plan or `run_now` (concept 19.11).\"\"\"\n\n    PLAN = \"plan\"\n    MANUAL = \"manual\"\n\n\n@dataclass(frozen=True, slots=True)\nclass When:\n    \"\"\"When a schedule runs: a wall-clock time or a sun event, on some weekdays.\"\"\"\n\n    type: WhenType\n    days: frozenset[int]\n    time: time | None = None\n    offset_min: int = 0\n\n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Return the stored form; `time` only for fixed times, `offset_min` only for sun events.\"\"\"\n        data: dict[str, Any] = {\"type\": self.type.value}\n        if self.days:\n            data[\"days\"] = sorted(self.days)\n        if self.type is WhenType.TIME and self.time is not None:\n            data[\"time\"] = self.time.strftime(\"%H:%M\")\n        else:\n            data[\"offset_min\"] = self.offset_min\n        return data\n\n\n@dataclass(frozen=True, slots=True)\nclass Repeat:\n    \"\"\"The date rule of a schedule: frequency, interval and the first and last date (concept 19.10).\"\"\"\n\n    freq: RepeatFreq = RepeatFreq.WEEKLY\n    interval: int = 1\n    start_date: date | None = None\n    end_date: date | None = None\n\n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Return the stored form; `interval` not for `once`, the dates only when set.\"\"\"\n        data: dict[str, Any] = {\"freq\": self.freq.value}\n        if self.freq is not RepeatFreq.ONCE:\n            data[\"interval\"] = self.interval\n        if self.start_date is not None:\n            data[\"start_date\"] = self.start_date.isoformat()\n        if self.end_date is not None:\n            data[\"end_date\"] = self.end_date.isoformat()\n        return data\n\n\n@dataclass(frozen=True, slots=True)\nclass RunEntry:\n    \"\"\"One run of a schedule as written to the run log (concept 19.11).\"\"\"\n\n    schedule_id: str\n    owner: str\n    name: str\n    at: datetime\n    result: RunResult\n    code: str | None\n    trigger: RunTrigger\n    removed: bool\n    notify: bool\n\n\n@dataclass(frozen=True, slots=True)\nclass Paused:\n    \"\"\"A pause set by the system, with its reason and the time it started.\"\"\"\n\n    reason: PauseReason\n    at: datetime\n\n\n@dataclass(frozen=True, slots=True)\nclass LastRun:\n    \"\"\"The outcome of the last run: when, the result and the HAB code if it was not ok.\"\"\"\n\n    at: datetime\n    result: RunResult\n    code: str | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass Schedule:\n    \"\"\"One schedule as stored by the bridge.\"\"\"\n\n    id: str\n    owner: str\n    name: str\n    enabled: bool\n    when: When\n    action: Action\n    entities: tuple[str, ...]\n    created_at: datetime\n    updated_at: datetime\n    paused: Paused | None = None\n    last_run: LastRun | None = None\n    repeat: Repeat = field(default_factory=Repeat)\n    notify: bool = False\n    off_reason: OffReason | None = None\n    skipped_dates: frozenset[date] = frozenset()\n\n    @property\n    def active(self) -> bool:\n        \"\"\"Return whether the schedule is planned: enabled and not paused by the system.\"\"\"\n        return self.enabled and self.paused is None\n\n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Return the stored (JSON) form.\"\"\"\n        return {\n            \"id\": self.id,\n            \"owner\": self.owner,\n            \"name\": self.name,\n            \"enabled\": self.enabled,\n            \"when\": self.when.to_dict(),\n            \"action\": self.action.value,\n            \"entities\": list(self.entities),\n            \"created_at\": self.created_at.isoformat(),\n            \"updated_at\": self.updated_at.isoformat(),\n            \"paused\": None\n            if self.paused is None\n            else {\"reason\": self.paused.reason.value, \"at\": self.paused.at.isoformat()},\n            \"last_run\": None\n            if self.last_run is None\n            else {\n                \"at\": self.last_run.at.isoformat(),\n                \"result\": self.last_run.result.value,\n                \"code\": self.last_run.code,\n            },\n            \"repeat\": self.repeat.to_dict(),\n            \"notify\": self.notify,\n            \"off_reason\": None if self.off_reason is None else self.off_reason.value,\n            \"skipped_dates\": sorted(day.isoformat() for day in self.skipped_dates),\n        }\n\n    def with_changes(self, **changes: Any) -> Schedule:\n        \"\"\"Return a copy with the given fields replaced.\"\"\"\n        return replace(self, **changes)\n\n\ndef _invalid() -> ScheduleError:\n    \"\"\"Return the error for a schedule that failed validation (HAB-SCH-001).\"\"\"\n    return ScheduleError(ErrorCode.SCH_INVALID)\n\n\ndef _enum(cls: type[_E], raw: object) -> _E:  # noqa: UP047 - code_index.py parses with older Python\n    \"\"\"Return the member of `cls` for a raw value, or raise HAB-SCH-001.\"\"\"\n    try:\n        return cls(raw)\n    except ValueError:\n        raise _invalid() from None\n\n\ndef _number(raw: object, low: int, high: int) -> int:\n    \"\"\"Return a whole number within the range; a bool does not count.\"\"\"\n    if isinstance(raw, bool) or not isinstance(raw, int) or not low <= raw <= high:\n        raise _invalid()\n    return raw\n\n\ndef parse_time(raw: object) -> time:\n    \"\"\"Return the time of a `HH:MM` text (24 h, no seconds).\"\"\"\n    if not isinstance(raw, str) or len(raw) != 5 or raw[2] != \":\":\n        raise _invalid()\n    try:\n        return time(int(raw[:2]), int(raw[3:]))\n    except ValueError:\n        raise _invalid() from None\n\n\ndef parse_days(raw: object) -> frozenset[int]:\n    \"\"\"Return the non-empty set of weekdays (0 = Monday).\"\"\"\n    if not isinstance(raw, list | tuple | set | frozenset) or not raw:\n        raise _invalid()\n    return frozenset(_number(day, 0, 6) for day in raw)\n\n\ndef parse_when(raw: object, *, days_required: bool = True) -> When:\n    \"\"\"Return the validated trigger: a time with weekdays, or a sun event with an offset.\n\n    `days` is required unless the repeat rule is not weekly (concept 19.10); a given value is checked anyway.\n    \"\"\"\n    if not isinstance(raw, Mapping):\n        raise _invalid()\n    kind = _enum(WhenType, raw.get(\"type\"))\n    days = parse_days(raw.get(\"days\")) if days_required or \"days\" in raw else frozenset()\n    if kind is WhenType.TIME:\n        if \"offset_min\" in raw:\n            raise _invalid()\n        return When(kind, days, time=parse_time(raw.get(\"time\")))\n    if \"time\" in raw:\n        raise _invalid()\n    offset = _number(raw.get(\"offset_min\", 0), -MAX_OFFSET_MIN, MAX_OFFSET_MIN)\n    return When(kind, days, offset_min=offset)\n\n\ndef parse_name(raw: object) -> str:\n    \"\"\"Return the trimmed name of 1 to 60 characters.\"\"\"\n    if not isinstance(raw, str):\n        raise _invalid()\n    name = raw.strip()\n    if not 1 <= len(name) <= MAX_NAME_LENGTH:\n        raise _invalid()\n    return name\n\n\ndef parse_action(raw: object) -> Action:\n    \"\"\"Return the validated action.\"\"\"\n    return _enum(Action, raw)\n\n\ndef parse_entities(raw: object) -> tuple[str, ...]:\n    \"\"\"Return 1 to 20 distinct switch entity ids in the given order.\"\"\"\n    if not isinstance(raw, list | tuple) or not 1 <= len(raw) <= MAX_ENTITIES_PER_SCHEDULE:\n        raise _invalid()\n    entities: dict[str, None] = {}\n    for entity_id in raw:\n        if (\n            not isinstance(entity_id, str)\n            or not valid_entity_id(entity_id)\n            or split_entity_id(entity_id)[0] != SCHEDULE_DOMAIN\n        ):\n            raise _invalid()\n        entities[entity_id] = None\n    return tuple(entities)\n\n\ndef parse_enabled(raw: object) -> bool:\n    \"\"\"Return the `enabled` flag; it must be a real boolean.\"\"\"\n    if not isinstance(raw, bool):\n        raise _invalid()\n    return raw\n\n\ndef parse_notify(raw: object) -> bool:\n    \"\"\"Return the `notify` flag; it must be a real boolean.\"\"\"\n    return parse_enabled(raw)\n\n\ndef _parse_date(raw: object) -> date:\n    \"\"\"Return the date of a `YYYY-MM-DD` text.\"\"\"\n    if not isinstance(raw, str):\n        raise _invalid()\n    try:\n        return date.fromisoformat(raw)\n    except ValueError:\n        raise _invalid() from None\n\n\ndef parse_skip_date(raw: object) -> date:\n    \"\"\"Return the date of a run to skip or to take up again, or raise HAB-SCH-001.\"\"\"\n    return _parse_date(raw)\n\n\ndef parse_skipped_dates(raw: object) -> frozenset[date]:\n    \"\"\"Return the stored dates of skipped runs; missing means none (concept 19.12).\"\"\"\n    if raw is None:\n        return frozenset()\n    if not isinstance(raw, list | tuple) or len(raw) > MAX_SKIPPED_DATES:\n        raise _invalid()\n    return frozenset(_parse_date(item) for item in raw)\n\n\ndef _parse_interval(freq: RepeatFreq, raw: object) -> int:\n    \"\"\"Return the interval of a repeating frequency within its limit; `once` has none.\"\"\"\n    if freq is RepeatFreq.ONCE:\n        if raw is not None:\n            raise _invalid()\n        return 1\n    return _number(1 if raw is None else raw, 1, MAX_INTERVAL[freq.value])\n\n\ndef parse_repeat(raw: object, today: date | None = None) -> Repeat:\n    \"\"\"Return the validated date rule; the checks that depend on the current date are in `check_repeat`.\n\n    Missing means weekly with interval 1. `start_date` is required for `once` and set to `today`\n    (if given) for the other frequencies; `end_date` is not allowed for `once`.\n    \"\"\"\n    if raw is None:\n        return Repeat()\n    if not isinstance(raw, Mapping) or not set(raw) <= {\n        \"freq\",\n        \"interval\",\n        \"start_date\",\n        \"end_date\",\n    }:\n        raise _invalid()\n    freq = _enum(RepeatFreq, raw.get(\"freq\"))\n    interval = _parse_interval(freq, raw.get(\"interval\"))\n    start = None if raw.get(\"start_date\") is None else _parse_date(raw[\"start_date\"])\n    end = None if raw.get(\"end_date\") is None else _parse_date(raw[\"end_date\"])\n    if freq is RepeatFreq.ONCE and (start is None or end is not None):\n        raise _invalid()\n    if start is None:\n        start = today\n    if start is not None and end is not None and end < start:\n        raise _invalid()\n    return Repeat(freq, interval, start, end)\n\n\ndef check_repeat(repeat: Repeat, when: When, now: datetime | None = None) -> None:\n    \"\"\"Raise if the dates of a new or changed rule are out of range (concept 19.10).\n\n    A date or time in the past is HAB-SCH-009; a one-off date more than 366 days ahead is HAB-SCH-001.\n    \"\"\"\n    local = dt_util.as_local(now or dt_util.utcnow())\n    today = local.date()\n    if repeat.freq is RepeatFreq.ONCE:\n        start = repeat.start_date\n        if start is None:\n            raise _invalid()\n        if start > today + MAX_START_DATE_AHEAD:\n            raise _invalid()\n        due = start < today or (\n            when.type is WhenType.TIME\n            and when.time is not None\n            and datetime.combine(start, when.time, local.tzinfo) <= local\n        )\n        if due:\n            raise ScheduleError(ErrorCode.SCH_IN_PAST)\n    elif repeat.end_date is not None:\n        if repeat.end_date < today:\n            raise ScheduleError(ErrorCode.SCH_IN_PAST)\n\n\ndef parse_off_reason(raw: object) -> OffReason | None:\n    \"\"\"Return the stored off reason, or None.\"\"\"\n    return None if raw is None else _enum(OffReason, raw)\n\n\ndef new_schedule(owner: str, fields: Mapping[str, Any], now: datetime | None = None) -> Schedule:\n    \"\"\"Return a new schedule with a fresh id after validating `name`, `when`, `action`, `entities`.\n\n    The optional `enabled` defaults to true, `notify` to false and `repeat` to weekly (concept 19.10).\n    \"\"\"\n    created = now or dt_util.utcnow()\n    repeat = parse_repeat(fields.get(\"repeat\"), dt_util.as_local(created).date())\n    when = parse_when(fields.get(\"when\"), days_required=repeat.freq is RepeatFreq.WEEKLY)\n    if \"repeat\" in fields:\n        check_repeat(repeat, when, created)\n    return Schedule(\n        id=uuid.uuid4().hex,\n        owner=owner,\n        name=parse_name(fields.get(\"name\")),\n        enabled=parse_enabled(fields.get(\"enabled\", True)),\n        when=when,\n        action=parse_action(fields.get(\"action\")),\n        entities=parse_entities(fields.get(\"entities\")),\n        created_at=created,\n        updated_at=created,\n        repeat=repeat,\n        notify=parse_notify(fields.get(\"notify\", False)),\n    )\n\n\ndef _parse_moment(raw: object) -> datetime:\n    \"\"\"Return the datetime of a stored ISO text.\"\"\"\n    moment = dt_util.parse_datetime(raw) if isinstance(raw, str) else None\n    if moment is None:\n        raise _invalid()\n    return moment\n\n\ndef _parse_paused(raw: object) -> Paused | None:\n    \"\"\"Return the stored pause, or None.\"\"\"\n    if raw is None:\n        return None\n    if not isinstance(raw, Mapping):\n        raise _invalid()\n    return Paused(_enum(PauseReason, raw.get(\"reason\")), _parse_moment(raw.get(\"at\")))\n\n\ndef _parse_last_run(raw: object) -> LastRun | None:\n    \"\"\"Return the stored last run, or None.\"\"\"\n    if raw is None:\n        return None\n    if not isinstance(raw, Mapping):\n        raise _invalid()\n    code = raw.get(\"code\")\n    if code is not None and not isinstance(code, str):\n        raise _invalid()\n    return LastRun(_parse_moment(raw.get(\"at\")), _enum(RunResult, raw.get(\"result\")), code)\n\n\ndef schedule_from_dict(raw: object) -> Schedule:\n    \"\"\"Return the schedule of a stored dict, or raise HAB-SCH-001 if it is damaged.\"\"\"\n    if not isinstance(raw, Mapping):\n        raise _invalid()\n    owner = raw.get(\"owner\")\n    schedule_id = raw.get(\"id\")\n    enabled = raw.get(\"enabled\")\n    if (\n        not isinstance(owner, str)\n        or not isinstance(schedule_id, str)\n        or not isinstance(enabled, bool)\n    ):\n        raise _invalid()\n    repeat = parse_repeat(raw.get(\"repeat\"))\n    return Schedule(\n        id=schedule_id,\n        owner=owner,\n        name=parse_name(raw.get(\"name\")),\n        enabled=enabled,\n        when=parse_when(raw.get(\"when\"), days_required=repeat.freq is RepeatFreq.WEEKLY),\n        action=parse_action(raw.get(\"action\")),\n        entities=parse_entities(raw.get(\"entities\")),\n        created_at=_parse_moment(raw.get(\"created_at\")),\n        updated_at=_parse_moment(raw.get(\"updated_at\")),\n        paused=_parse_paused(raw.get(\"paused\")),\n        last_run=_parse_last_run(raw.get(\"last_run\")),\n        repeat=repeat,\n        notify=parse_notify(raw.get(\"notify\", False)),\n        off_reason=parse_off_reason(raw.get(\"off_reason\")),\n        skipped_dates=parse_skipped_dates(raw.get(\"skipped_dates\")),\n    )\n\n\n@dataclass(frozen=True, slots=True)\nclass RunOrigin:\n    \"\"\"Who started a run: `triggered_by` is the HA user of a manual run, `client` the device name they sent.\"\"\"\n\n    triggered_by: str | None = None\n    client: str | None = None\n","custom_components/haac_bridge/schedules/planner.py":"\"\"\"Plans the next run of every schedule and calls the runner when one is due (concept 19.3).\"\"\"\n\nfrom collections.abc import Awaitable, Callable\nfrom datetime import datetime, timedelta\n\nfrom homeassistant.const import EVENT_CORE_CONFIG_UPDATE\nfrom homeassistant.core import CALLBACK_TYPE, Event, HomeAssistant, callback\nfrom homeassistant.helpers.event import async_track_point_in_utc_time\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import MISSED_RUN_GRACE, NEXT_RUNS_COUNT\nfrom .model import (\n    Paused,\n    PauseReason,\n    RepeatFreq,\n    Schedule,\n    check_repeat,\n    parse_repeat,\n    parse_when,\n)\nfrom .store import ScheduleStore\nfrom .triggers import Trigger, TriggerFactory, UpcomingRun\n\n\nclass SchedulePlanner:\n    \"\"\"Keeps one timer per active schedule and re-plans after every run and every time change.\"\"\"\n\n    def __init__(\n        self,\n        hass: HomeAssistant,\n        store: ScheduleStore,\n        triggers: TriggerFactory,\n        on_due: Callable[[str], Awaitable[None]],\n        on_changed: Callable[[str], None],\n    ) -> None:\n        \"\"\"Create the planner.\n\n        `on_due` runs a schedule and `on_changed` reports a new planned time or pause.\n        The manager sets `on_missed` to be told about a run HA missed (concept 19.10, 19.11).\n        \"\"\"\n        self._hass = hass\n        self._store = store\n        self._triggers = triggers\n        self._on_due = on_due\n        self._on_changed = on_changed\n        self.on_missed: Callable[..., Awaitable[None]] | None = None\n        self._unsubs: dict[str, CALLBACK_TYPE] = {}\n        self._planned: dict[str, datetime] = {}\n        self._ended: set[str] = set()\n        self._unsub_config: CALLBACK_TYPE | None = None\n\n    async def async_start(self) -> None:\n        \"\"\"Plan every schedule, follow time zone and location changes and catch up missed runs.\"\"\"\n        await self.async_plan_all()\n        self._unsub_config = self._hass.bus.async_listen(\n            EVENT_CORE_CONFIG_UPDATE, self._handle_config_update\n        )\n        now = dt_util.utcnow()\n        for schedule in list(self._store.schedules):\n            if schedule.id not in self._unsubs and schedule.id not in self._ended:\n                continue\n            if self._missed(schedule, now):\n                self._hass.async_create_task(self._on_due(schedule.id))\n            else:\n                await self._async_report_missed(schedule, now)\n\n    async def _async_report_missed(self, schedule: Schedule, now: datetime) -> None:\n        \"\"\"Tell `on_missed` about the last planned run that HA missed by more than the grace.\n\n        It counts if it fell after the last change of the schedule and no run followed it. The\n        run is the last one of the schedule if the planner found no later date (concept 19.10).\n        \"\"\"\n        previous = self._trigger(schedule).previous_run(now)\n        if (\n            self.on_missed is not None\n            and previous is not None\n            and schedule.updated_at <= previous\n            and (schedule.last_run is None or schedule.last_run.at < previous)\n        ):\n            await self.on_missed(schedule, previous, last=schedule.id in self._ended)\n\n    @callback\n    def async_stop(self) -> None:\n        \"\"\"Cancel every timer and stop following configuration changes.\"\"\"\n        for schedule_id in list(self._unsubs):\n            self._cancel(schedule_id)\n        if self._unsub_config is not None:\n            self._unsub_config()\n            self._unsub_config = None\n\n    async def async_plan_all(self) -> None:\n        \"\"\"Plan every schedule anew.\"\"\"\n        for schedule in self._store.schedules:\n            await self.async_plan(schedule.id)\n\n    async def async_plan(self, schedule_id: str, after: datetime | None = None) -> None:\n        \"\"\"Plan the next run of one schedule, or cancel its timer if it is not active.\n\n        A changed planned time is reported, so sensors and subscribers follow a re-plan after the\n        start or after a time zone or location change (review findings 1 and 2).\n        \"\"\"\n        previous = self._planned.get(schedule_id)\n        await self._async_plan(schedule_id, after)\n        if self._planned.get(schedule_id) != previous:\n            self._on_changed(schedule_id)\n\n    async def _async_plan(self, schedule_id: str, after: datetime | None) -> None:\n        \"\"\"Replace the timer of one schedule by one for its next run, if it needs one.\"\"\"\n        self._cancel(schedule_id)\n        schedule = self._store.get(schedule_id)\n        if schedule is None or not self._plannable(schedule):\n            return\n        reference = after or dt_util.utcnow()\n        next_run = self._trigger(schedule).next_run(reference)\n        if next_run is None:\n            if self._triggers.is_ended(\n                schedule.when, schedule.repeat, reference, schedule.skipped_dates\n            ):\n                self._ended.add(schedule_id)\n            else:\n                await self._async_set_sun_pause(schedule, paused=True)\n            return\n        if schedule.paused is not None:\n            await self._async_set_sun_pause(schedule, paused=False)\n        self._planned[schedule_id] = next_run\n        self._unsubs[schedule_id] = async_track_point_in_utc_time(\n            self._hass, self._make_job(schedule_id), next_run\n        )\n\n    def planned_run(self, schedule_id: str) -> datetime | None:\n        \"\"\"Return when the schedule runs next, or None if it is not planned.\"\"\"\n        return self._planned.get(schedule_id)\n\n    def ends_with_run(self, schedule_id: str) -> bool:\n        \"\"\"Return whether the run that is due now is the last one of the schedule (concept 19.10).\n\n        True after the planner found no further date for an enabled, active schedule: the run of a\n        one-off schedule or of one that reached its end date, which removes the schedule.\n        \"\"\"\n        return schedule_id in self._ended\n\n    def next_runs(self, schedule: Schedule) -> list[datetime]:\n        \"\"\"Return the next runs of a planned schedule, none if it is disabled, paused or expired.\"\"\"\n        if schedule.id not in self._planned:\n            return []\n        return self._triggers.upcoming(\n            schedule.when,\n            schedule.repeat,\n            dt_util.utcnow(),\n            NEXT_RUNS_COUNT,\n            schedule.skipped_dates,\n        )\n\n    def upcoming_runs(self, schedule: Schedule) -> list[UpcomingRun]:\n        \"\"\"Return the next runs of a planned schedule with the skipped ones between them (concept 19.12).\"\"\"\n        if schedule.id not in self._planned:\n            return []\n        return self._triggers.upcoming_with_skips(\n            schedule.when, schedule.repeat, dt_util.utcnow(), schedule.skipped_dates\n        )\n\n    def is_expired(self, schedule: Schedule) -> bool:\n        \"\"\"Return whether the schedule has no date left, e.g. a one-off in the past (concept 19.10).\"\"\"\n        return self._triggers.is_ended(\n            schedule.when, schedule.repeat, dt_util.utcnow(), schedule.skipped_dates\n        )\n\n    def preview(self, raw_when: object, raw_repeat: object) -> list[datetime]:\n        \"\"\"Return the next runs of a draft that is not saved, or raise HAB-SCH-001 / HAB-SCH-009.\"\"\"\n        now = dt_util.utcnow()\n        repeat = parse_repeat(raw_repeat, dt_util.as_local(now).date())\n        when = parse_when(raw_when, days_required=repeat.freq is RepeatFreq.WEEKLY)\n        if raw_repeat is not None:\n            check_repeat(repeat, when, now)\n        return self._triggers.upcoming(when, repeat, now, NEXT_RUNS_COUNT)\n\n    def _trigger(self, schedule: Schedule) -> Trigger:\n        \"\"\"Return the trigger of a schedule for its time and its date rule.\"\"\"\n        return self._triggers.create(schedule.when, schedule.repeat, schedule.skipped_dates)\n\n    def _cancel(self, schedule_id: str) -> None:\n        \"\"\"Cancel the timer of one schedule.\"\"\"\n        self._planned.pop(schedule_id, None)\n        self._ended.discard(schedule_id)\n        if (unsub := self._unsubs.pop(schedule_id, None)) is not None:\n            unsub()\n\n    @staticmethod\n    def _plannable(schedule: Schedule) -> bool:\n        \"\"\"Return whether a timer is needed: enabled, and not paused for a reason a timer cannot fix.\"\"\"\n        paused = schedule.paused\n        return schedule.enabled and (paused is None or paused.reason is PauseReason.SUN_UNAVAILABLE)\n\n    def _make_job(self, schedule_id: str) -> Callable[[datetime], Awaitable[None]]:\n        \"\"\"Return the timer callback of one schedule.\"\"\"\n\n        async def _fire(_now: datetime) -> None:\n            \"\"\"Plan the next run first, so a failing run never stops the schedule, then run.\"\"\"\n            planned = self._planned.get(schedule_id)\n            self._unsubs.pop(schedule_id, None)\n            after = dt_util.utcnow()\n            if planned is not None:\n                after = max(after, planned + timedelta(seconds=1))\n            await self.async_plan(schedule_id, after)\n            await self._on_due(schedule_id)\n\n        return _fire\n\n    async def _async_set_sun_pause(self, schedule: Schedule, *, paused: bool) -> None:\n        \"\"\"Pause a sun schedule that has no event, or resume one whose event is back.\"\"\"\n        is_paused = schedule.paused is not None\n        if paused == is_paused:\n            return\n        new_pause = Paused(PauseReason.SUN_UNAVAILABLE, dt_util.utcnow()) if paused else None\n        await self._store.async_replace(schedule.with_changes(paused=new_pause), delay=True)\n        self._on_changed(schedule.id)\n\n    def _missed(self, schedule: Schedule, now: datetime) -> bool:\n        \"\"\"Return whether a run was due shortly before `now` and has not happened (concept 19.3).\"\"\"\n        previous = self._trigger(schedule).previous_run(now)\n        if previous is None or now - previous > MISSED_RUN_GRACE or schedule.created_at > previous:\n            return False\n        return schedule.last_run is None or schedule.last_run.at < previous\n\n    @callback\n    def _handle_config_update(self, _event: Event) -> None:\n        \"\"\"Re-plan everything after a change of the time zone or the location.\"\"\"\n        self._hass.async_create_task(self.async_plan_all())\n","custom_components/haac_bridge/schedules/recurrence.py":"\"\"\"Date rules of schedules: on which dates a schedule runs (concept 19.10, 18.2 RecurrenceFactory).\n\nA rule only knows dates; the time of day is added by `wall_time.py` and the sun triggers. The\nrules need only the standard library besides the `Repeat` data class.\n\"\"\"\n\nfrom calendar import isleap, monthrange\nfrom collections.abc import Callable, Collection\nfrom datetime import date, timedelta\nfrom typing import Protocol\n\nfrom .model import Repeat, RepeatFreq\n\nLOOKBACK_DAYS = 400\n\"\"\"Days `previous_date` looks back; the longest gap between two runs is a year (concept 19.10).\"\"\"\n\nWEEK_STEPS = 3\n\"\"\"Weeks `WeeklyRule` looks at to find the next date: the current one and the next matching one.\"\"\"\n\nMONTH_STEPS = 2\n\"\"\"Months `MonthlyRule` looks at: the matching month and the one after it.\"\"\"\n\n_EPOCH = date(1970, 1, 1)\n\"\"\"Anchor of the interval for a rule without `start_date`; only an interval of 1 can lack one.\"\"\"\n\nDAY = timedelta(days=1)\n\n\nclass DateRule(Protocol):\n    \"\"\"The dates of one schedule; `after` and `before` are local dates.\"\"\"\n\n    def matches(self, day: date) -> bool:\n        \"\"\"Return whether the schedule runs on `day`.\"\"\"\n\n    def next_date(self, after: date) -> date | None:\n        \"\"\"Return the first run date strictly after `after`, or None if the rule has ended.\"\"\"\n\n    def previous_date(self, before: date) -> date | None:\n        \"\"\"Return the last run date on or before `before`, or None if there is none.\"\"\"\n\n\ndef _monday(day: date) -> date:\n    \"\"\"Return the Monday of the ISO week of `day`.\"\"\"\n    return day - timedelta(days=day.weekday())\n\n\ndef _month_index(day: date) -> int:\n    \"\"\"Return the number of the month of `day` since year 0.\"\"\"\n    return day.year * 12 + day.month - 1\n\n\nclass _BoundedRule:\n    \"\"\"Base of the rules: the first and last date, and the search for the next and previous date.\"\"\"\n\n    def __init__(self, start: date | None, end: date | None) -> None:\n        \"\"\"Remember the first and last date a run may happen; either may be missing.\"\"\"\n        self._start = start\n        self._end = end\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether `day` lies on the pattern of the rule, ignoring start and end.\"\"\"\n        raise NotImplementedError\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return the first date on or after `day` that lies on the pattern, ignoring the end.\"\"\"\n        raise NotImplementedError\n\n    def _in_range(self, day: date) -> bool:\n        \"\"\"Return whether `day` is neither before the start date nor after the end date.\"\"\"\n        return (self._start is None or day >= self._start) and (\n            self._end is None or day <= self._end\n        )\n\n    def matches(self, day: date) -> bool:\n        \"\"\"Return whether the schedule runs on `day`.\"\"\"\n        return self._in_range(day) and self._fits(day)\n\n    def next_date(self, after: date) -> date | None:\n        \"\"\"Return the first run date strictly after `after`, or None if the rule has ended.\"\"\"\n        try:\n            first = after + DAY\n            if self._start is not None and first < self._start:\n                first = self._start\n            found = self._first_from(first)\n        except OverflowError, ValueError:  # the calendar ends at year 9999\n            return None\n        if found is None or (self._end is not None and found > self._end):\n            return None\n        return found\n\n    def previous_date(self, before: date) -> date | None:\n        \"\"\"Return the last run date on or before `before`, or None if there is none.\"\"\"\n        day = before if self._end is None else min(before, self._end)\n        for _ in range(LOOKBACK_DAYS):\n            if self._start is not None and day < self._start:\n                return None\n            if self._fits(day):\n                return day\n            day -= DAY\n        return None\n\n\nclass OnceRule(_BoundedRule):\n    \"\"\"Exactly one date.\"\"\"\n\n    def __init__(self, day: date | None) -> None:\n        \"\"\"Remember the date of the single run.\"\"\"\n        super().__init__(day, day)\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether a date is set; the range of start and end already is that single date.\"\"\"\n        return self._start is not None\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return the date if it is not before `day`.\"\"\"\n        return self._start if self._start is not None and self._start >= day else None\n\n\nclass DailyRule(_BoundedRule):\n    \"\"\"Every N days, counted from the start date.\"\"\"\n\n    def __init__(self, repeat: Repeat) -> None:\n        \"\"\"Remember the interval and the dates.\"\"\"\n        super().__init__(repeat.start_date, repeat.end_date)\n        self._anchor = repeat.start_date or _EPOCH\n        self._interval = repeat.interval\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether the number of days since the start date is a multiple of the interval.\"\"\"\n        return (day - self._anchor).days % self._interval == 0\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return `day` or the next day of the interval.\"\"\"\n        behind = (day - self._anchor).days % self._interval\n        return day if behind == 0 else day + timedelta(days=self._interval - behind)\n\n\nclass WeeklyRule(_BoundedRule):\n    \"\"\"The chosen weekdays of every N-th ISO week, counted from the week of the start date.\"\"\"\n\n    def __init__(self, repeat: Repeat, days: Collection[int]) -> None:\n        \"\"\"Remember the interval, the weekdays and the dates.\"\"\"\n        super().__init__(repeat.start_date, repeat.end_date)\n        self._anchor = _monday(repeat.start_date or _EPOCH)\n        self._interval = repeat.interval\n        self._days = frozenset(days)\n\n    def _week_behind(self, day: date) -> int:\n        \"\"\"Return how many weeks past the last week of the interval `day` lies.\"\"\"\n        return ((_monday(day) - self._anchor).days // 7) % self._interval\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether the weekday is chosen and the week is one of the interval.\"\"\"\n        return day.weekday() in self._days and self._week_behind(day) == 0\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return the first chosen weekday on or after `day` in a week of the interval.\"\"\"\n        for _ in range(WEEK_STEPS):\n            behind = self._week_behind(day)\n            if behind:\n                day = _monday(day) + timedelta(weeks=self._interval - behind)\n            for weekday in range(day.weekday(), 7):\n                if weekday in self._days:\n                    return _monday(day) + timedelta(days=weekday)\n            day = _monday(day) + timedelta(weeks=1)\n        return None\n\n\nclass MonthlyRule(_BoundedRule):\n    \"\"\"The day of month of the start date in every N-th month; a missing day is the month's last.\"\"\"\n\n    def __init__(self, repeat: Repeat) -> None:\n        \"\"\"Remember the interval, the day of month and the dates.\"\"\"\n        super().__init__(repeat.start_date, repeat.end_date)\n        self._anchor = repeat.start_date or _EPOCH\n        self._interval = repeat.interval\n\n    def _day_in(self, month_index: int) -> date:\n        \"\"\"Return the run date of a month: the anchor's day, or the last day of a shorter month.\"\"\"\n        year, month = divmod(month_index, 12)\n        return date(year, month + 1, min(self._anchor.day, monthrange(year, month + 1)[1]))\n\n    def _month_behind(self, day: date) -> int:\n        \"\"\"Return how many months past the last month of the interval `day` lies.\"\"\"\n        return (_month_index(day) - _month_index(self._anchor)) % self._interval\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether the month is one of the interval and `day` is its run date.\"\"\"\n        return self._month_behind(day) == 0 and day == self._day_in(_month_index(day))\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return the first run date on or after `day`.\"\"\"\n        index = _month_index(day)\n        index += (self._interval - self._month_behind(day)) % self._interval\n        for _ in range(MONTH_STEPS):\n            candidate = self._day_in(index)\n            if candidate >= day:\n                return candidate\n            index += self._interval\n        return None\n\n\nclass YearlyRule(_BoundedRule):\n    \"\"\"The day and month of the start date every year; 29 February is 28 February in other years.\"\"\"\n\n    def __init__(self, repeat: Repeat) -> None:\n        \"\"\"Remember the day, the month and the dates.\"\"\"\n        super().__init__(repeat.start_date, repeat.end_date)\n        self._anchor = repeat.start_date or _EPOCH\n\n    def _day_in(self, year: int) -> date:\n        \"\"\"Return the run date of a year.\"\"\"\n        if (self._anchor.month, self._anchor.day) == (2, 29) and not isleap(year):\n            return date(year, 2, 28)\n        return date(year, self._anchor.month, self._anchor.day)\n\n    def _fits(self, day: date) -> bool:\n        \"\"\"Return whether `day` is the run date of its year.\"\"\"\n        return day == self._day_in(day.year)\n\n    def _first_from(self, day: date) -> date | None:\n        \"\"\"Return the first run date on or after `day`.\"\"\"\n        candidate = self._day_in(day.year)\n        return candidate if candidate >= day else self._day_in(day.year + 1)\n\n\nclass RecurrenceFactory:\n    \"\"\"Creates the date rule that belongs to a schedule's `repeat.freq` (concept 18.2).\"\"\"\n\n    def create(self, repeat: Repeat, days: Collection[int]) -> DateRule:\n        \"\"\"Return the rule for `repeat`; `days` are the weekdays of `when`, used by `weekly` only.\"\"\"\n        builders: dict[RepeatFreq, Callable[[], DateRule]] = {\n            RepeatFreq.ONCE: lambda: OnceRule(repeat.start_date),\n            RepeatFreq.DAILY: lambda: DailyRule(repeat),\n            RepeatFreq.WEEKLY: lambda: WeeklyRule(repeat, days),\n            RepeatFreq.MONTHLY: lambda: MonthlyRule(repeat),\n            RepeatFreq.YEARLY: lambda: YearlyRule(repeat),\n        }\n        return builders[repeat.freq]()\n","custom_components/haac_bridge/schedules/repairs.py":"\"\"\"Reports stored schedules that could not be read in HA Repairs (concept 19.2).\"\"\"\n\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.helpers import issue_registry as ir\n\nfrom ..const import DOMAIN\nfrom ..core.errors import ErrorCode\n\nISSUE_UNREADABLE = \"sch_unreadable\"\n\n\n@callback\ndef async_sync_unreadable_issue(hass: HomeAssistant, count: int) -> None:\n    \"\"\"Create the Repairs issue for `count` unreadable stored schedules, or remove it if there are none.\"\"\"\n    if count == 0:\n        ir.async_delete_issue(hass, DOMAIN, ISSUE_UNREADABLE)\n        return\n    ir.async_create_issue(\n        hass,\n        DOMAIN,\n        ISSUE_UNREADABLE,\n        is_fixable=False,\n        severity=ir.IssueSeverity.WARNING,\n        translation_key=ISSUE_UNREADABLE,\n        translation_placeholders={\"count\": str(count), \"code\": ErrorCode.SCH_INVALID.value},\n    )\n","custom_components/haac_bridge/schedules/run_log.py":"\"\"\"The log of schedule runs in `.storage/haac_bridge.schedule_runs` (concept 19.11).\"\"\"\n\nfrom dataclasses import dataclass\nfrom datetime import datetime\nimport logging\nfrom typing import Any\nimport uuid\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.storage import Store\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import (\n    MAX_RUN_LOG_PER_OWNER,\n    RUN_LOG_RETENTION,\n    RUN_LOG_STORE_KEY,\n    RUN_LOG_STORE_VERSION,\n    RUN_RESULT_SAVE_DELAY,\n)\nfrom .model import RunEntry, RunResult, RunTrigger\n\n_LOGGER = logging.getLogger(__name__)\n\n\n@dataclass(frozen=True, slots=True)\nclass LoggedRun:\n    \"\"\"A run in the log: the entry as the runner reported it, numbered by the log.\"\"\"\n\n    seq: int\n    entry: RunEntry\n\n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Return the stored and sent form of the run (concept 19.11).\"\"\"\n        entry = self.entry\n        return {\n            \"seq\": self.seq,\n            \"schedule_id\": entry.schedule_id,\n            \"owner\": entry.owner,\n            \"name\": entry.name,\n            \"at\": entry.at.isoformat(),\n            \"result\": entry.result.value,\n            \"code\": entry.code,\n            \"trigger\": entry.trigger.value,\n            \"removed\": entry.removed,\n            \"notify\": entry.notify,\n        }\n\n\ndef _logged_run_from_dict(raw: Any) -> LoggedRun | None:\n    \"\"\"Return the run of a stored entry, or None if the entry is damaged.\"\"\"\n    try:\n        at = dt_util.parse_datetime(raw[\"at\"])\n        if at is None or isinstance(raw[\"seq\"], bool) o
