l.Schema({}),\n            description_placeholders={\n                \"user\": (user.name if user else None) or self._user_id,\n                \"count\": str(self._schedule_count(self._user_id)),\n            },\n        )\n\n    def _schedule_count(self, user_id: str | None) -> int:\n        \"\"\"Return how many schedules the user has.\"\"\"\n        return len(get_data(self.hass).schedules.store.by_owner(user_id)) if user_id else 0\n\n    def _remove(self, user_id: str) -> ConfigFlowResult:\n        \"\"\"Save the options without this user; their schedules are deleted when the options apply.\"\"\"\n        remaining = [\n            record\n            for record in users_of(self.config_entry.options)\n            if record[CONF_USER_ID] != user_id\n        ]\n        return self._save_users(remaining)\n\n    async def async_step_filter(self, user_input: dict[str, Any] | None = None) -> ConfigFlowResult:\n        \"\"\"Choose which entities the user may see: domains, entities and wildcards to include or exclude.\"\"\"\n        errors: dict[str, str] = {}\n        if user_input is not None:\n            self._rules = {key: list(user_input.get(key, [])) for key in FILTER_KEYS}\n            if not any(self._rules[key] for key in INCLUDE_KEYS):\n                errors[\"base\"] = \"no_include\"\n            elif not _globs_valid(self._rules):\n                errors[\"base\"] = \"invalid_glob\"\n            else:\n                return await self.async_step_names()\n        schema = vol.Schema(\n            {\n                vol.Optional(key, description={\"suggested_value\": self._rules.get(key)}): selector\n                for key, selector in _SELECTORS.items()\n            }\n        )\n        return self.async_show_form(step_id=\"filter\", data_schema=schema, errors=errors)\n\n    async def async_step_names(self, user_input: dict[str, Any] | None = None) -> ConfigFlowResult:\n        \"\"\"Give the explicitly included entities display names for the app; empty keeps the Home Assistant name.\"\"\"\n        entity_ids = sorted(self._rules.get(CONF_INCLUDE_ENTITIES, []))\n        labels = self._names_labels(entity_ids)\n        if user_input is None and entity_ids:\n            known = self._record(self._user_id).get(CONF_NAMES, {})\n            schema = vol.Schema(\n                {\n                    vol.Optional(label, description={\"suggested_value\": known.get(entity_id)}): str\n                    for label, entity_id in labels.items()\n                }\n            )\n            return self.async_show_form(\n                step_id=\"names\",\n                data_schema=schema,\n                description_placeholders={\"entities\": _entity_list(labels)},\n            )\n        names = {\n            labels[label]: name.strip()\n            for label, name in (user_input or {}).items()\n            if label in labels and name and name.strip()\n        }\n        return await self._async_save(names)\n\n    def _names_labels(self, entity_ids: list[str]) -> dict[str, str]:\n        \"\"\"Return the form labels of the entities: the short Home Assistant name, the entity_id if it is missing or not unique.\n\n        The long entity_id stays out of the label because a phone screen wraps it over the input;\n        the form description lists it instead.\n        \"\"\"\n        friendly: dict[str, str] = {}\n        for entity_id in entity_ids:\n            state = self.hass.states.get(entity_id)\n            friendly[entity_id] = state.name if state and state.name else entity_id\n        counts = Counter(friendly.values())\n        return {\n            (name if counts[name] == 1 else entity_id): entity_id\n            for entity_id, name in friendly.items()\n        }\n\n    async def _async_save(self, names: dict[str, str]) -> ConfigFlowResult:\n        \"\"\"Store the selected user's rules and names, replacing an earlier entry of this user.\n\n        The other users are read from the entry as it is now, so changes saved meanwhile stay.\n        A user deleted in Home Assistant while the form was open is not added back (finding U4).\n        \"\"\"\n        if self._user_id is None:\n            return self.async_abort(reason=\"unknown\")\n        if await self.hass.auth.async_get_user(self._user_id) is None:\n            return self.async_abort(reason=\"user_gone\")\n        record = user_options(self._user_id, self._rules, names)\n        others = [\n            r for r in users_of(self.config_entry.options) if r[CONF_USER_ID] != self._user_id\n        ]\n        return self._save_users([*others, record])\n\n    def _save_users(self, records: list[dict[str, Any]]) -> ConfigFlowResult:\n        \"\"\"Save the user records and keep the other options, such as the logging settings.\"\"\"\n        return self.async_create_entry(data={**self.config_entry.options, CONF_USERS: records})\n\n    def _record(self, user_id: str | None) -> dict[str, Any]:\n        \"\"\"Return the stored record of a user, or an empty one.\"\"\"\n        return next(\n            (r for r in users_of(self.config_entry.options) if r[CONF_USER_ID] == user_id), {}\n        )\n\n    async def _async_users(self, *, include_inactive: bool = False) -> list[SelectOptionDict]:\n        \"\"\"Return every non-system Home Assistant user as a select option; deactivated ones only on request.\"\"\"\n        users = await self.hass.auth.async_get_users()\n        return [\n            SelectOptionDict(\n                value=user.id,\n                label=(user.name or user.id) + (\"\" if user.is_active else INACTIVE_LABEL_SUFFIX),\n            )\n            for user in sorted(users, key=lambda u: (u.name or \"\").casefold())\n            if (user.is_active or include_inactive) and not user.system_generated\n        ]\n\n    def _configured_ids(self) -> set[str]:\n        \"\"\"Return the ids of the users that already have an entry.\"\"\"\n        return {record[CONF_USER_ID] for record in users_of(self.config_entry.options)}\n\n    async def _async_configured_users(self) -> list[SelectOptionDict]:\n        \"\"\"Return the users that already have an entry, deactivated ones included.\n\n        A deactivated user keeps the entry and the schedules, so both must stay editable and\n        removable (review finding 3).\n        \"\"\"\n        configured = self._configured_ids()\n        users = await self._async_users(include_inactive=True)\n        return [user for user in users if user[\"value\"] in configured]\n\n    async def _async_free_users(self) -> list[SelectOptionDict]:\n        \"\"\"Return the active users that have no entry yet.\"\"\"\n        configured = self._configured_ids()\n        return [user for user in await self._async_users() if user[\"value\"] not in configured]\n\n\ndef _user_schema(users: list[SelectOptionDict]) -> vol.Schema:\n    \"\"\"Return the form with one required choice of a user.\"\"\"\n    return vol.Schema(\n        {\n            vol.Required(CONF_USER_ID): SelectSelector(\n                SelectSelectorConfig(options=users, mode=SelectSelectorMode.DROPDOWN)\n            )\n        }\n    )\n\n\ndef _globs_valid(rules: dict[str, list[str]]) -> bool:\n    \"\"\"Return True if every wildcard has the form `domain.pattern`, with the YAML schema's check.\"\"\"\n    return all(valid_glob(glob) for key in _GLOB_KEYS for glob in rules.get(key, []))\n\n\ndef _entity_list(labels: dict[str, str]) -> str:\n    \"\"\"Return a Markdown list of the form labels with their entity_ids, for the form description.\"\"\"\n    return \"\\n\".join(\n        f\"- {label}: `{entity_id}`\" for label, entity_id in labels.items() if label != entity_id\n    )\n","custom_components/haac_bridge/const.py":"\"\"\"Constants shared by all topics of HAAC Bridge.\"\"\"\n\nfrom datetime import timedelta\nfrom typing import Final\n\nDOMAIN: Final = \"haac_bridge\"\n\nAPI_VERSION: Final = 1\n\"\"\"Version of the haac_bridge/* WebSocket API; raised on every breaking change (11.4).\"\"\"\n\nSUPPORTED_DOMAINS: Final = (\"binary_sensor\", \"climate\", \"sensor\", \"switch\")\n\"\"\"Entity domains returned in v1, regardless of the user's filter (10.2).\"\"\"\n\nFEATURES: Final = (\n    \"schedules\",\n    \"entity_disable\",\n    \"schedule_repeat\",\n    \"schedule_runs\",\n    \"client_info\",\n    \"schedule_skip\",\n)\n\"\"\"Optional features this bridge offers; `haac_bridge/info` reports them to the app (11.2, 11.4).\"\"\"\n\nCONF_USERS: Final = \"users\"\nCONF_USERNAME: Final = \"username\"\nCONF_USER_ID: Final = \"user_id\"\nCONF_FILTER: Final = \"filter\"\nCONF_ENTITY_CONFIG: Final = \"entity_config\"\nCONF_NAME: Final = \"name\"\nCONF_NAMES: Final = \"names\"\n\nSERVICE_RELOAD: Final = \"reload\"\n\nSIGNAL_EXPOSURE_CHANGED: Final = f\"{DOMAIN}_exposure_changed\"\n\"\"\"Dispatcher signal sent after a reload replaced the exposure of all users.\"\"\"\n\nSIGNAL_SCHEDULES_CHANGED: Final = f\"{DOMAIN}_schedules_changed\"\n\"\"\"Dispatcher signal sent after a schedule was created, changed, run, paused or removed (19.4).\"\"\"\n\nSIGNAL_SCHEDULE_CHANGED: Final = f\"{DOMAIN}_schedule_changed_{{}}\"\n\"\"\"Dispatcher signal of one schedule (format it with the schedule id); only its entities follow it.\"\"\"\n\nSCHEDULE_STORE_KEY: Final = f\"{DOMAIN}.schedules\"\n\"\"\"Name of the storage file (in `.storage`) that holds the schedules (concept 19.2).\"\"\"\n\nSCHEDULE_STORE_VERSION: Final = 1\n\"\"\"Version of the schedule store; raised when the stored format changes.\"\"\"\n\nSCHEDULE_DOMAIN: Final = \"switch\"\n\"\"\"The only entity domain a schedule can switch in v1 (concept 19.1).\"\"\"\n\nMAX_SCHEDULES_PER_USER: Final = 50\nMAX_ENTITIES_PER_SCHEDULE: Final = 20\nMAX_NAME_LENGTH: Final = 60\nMAX_OFFSET_MIN: Final = 180\n\"\"\"Limits of a schedule (concept 19.2); the offset applies to sunrise and sunset in either direction.\"\"\"\n\nMAX_INTERVAL: Final[dict[str, int]] = {\n    \"daily\": 365,\n    \"weekly\": 52,\n    \"monthly\": 12,\n    \"yearly\": 1,\n}\n\"\"\"Largest `repeat.interval` per frequency; the smallest is 1 (concept 19.10). `once` has no interval.\"\"\"\n\nMAX_START_DATE_AHEAD: Final = timedelta(days=366)\n\"\"\"How far in the future the date of a one-off schedule may lie (concept 19.10).\"\"\"\n\nNEXT_RUNS_COUNT: Final = 3\n\"\"\"How many following runs `next_runs` and `schedules/preview` return (concept 19.10).\"\"\"\n\nUPCOMING_RUNS_LIMIT: Final = 14\n\"\"\"How many runs `upcoming_runs` shows at most, skipped ones included; only these can be skipped (concept 19.12).\"\"\"\n\nMAX_SKIPPED_DATES: Final = 30\n\"\"\"Most skipped runs a schedule can hold at the same time (concept 19.12).\"\"\"\n\nRUN_NOW_COOLDOWN: Final = 10\n\"\"\"Seconds after a manual run during which run_now of the same schedule is refused (HAB-SCH-007).\"\"\"\n\nRUN_RESULT_SAVE_DELAY: Final = 1\n\"\"\"Seconds run results and system pauses wait before they are written, so a burst is one write.\"\"\"\n\nMISSED_RUN_GRACE: Final = timedelta(minutes=5)\n\"\"\"A run that HA missed by at most this long is still carried out once at startup (concept 19.3).\"\"\"\n\nSERVICE_TIMEOUT: Final = 15\n\"\"\"Seconds a service call of the bridge may take before it counts as failed (HAB-SVC-003).\"\"\"\n\nALLOWED_SERVICES: Final[dict[str, dict[str, frozenset[str]]]] = {\n    \"switch\": {\n        \"turn_on\": frozenset(),\n        \"turn_off\": frozenset(),\n        \"toggle\": frozenset(),\n    },\n    \"climate\": {\n        \"turn_on\": frozenset(),\n        \"turn_off\": frozenset(),\n        \"set_hvac_mode\": frozenset({\"hvac_mode\"}),\n        \"set_temperature\": frozenset({\"temperature\", \"target_temp_low\", \"target_temp_high\"}),\n        \"set_humidity\": frozenset({\"humidity\"}),\n        \"set_fan_mode\": frozenset({\"fan_mode\"}),\n        \"set_preset_mode\": frozenset({\"preset_mode\"}),\n        \"set_swing_mode\": frozenset({\"swing_mode\"}),\n        \"set_swing_horizontal_mode\": frozenset({\"swing_horizontal_mode\"}),\n    },\n    \"sensor\": {},\n    \"binary_sensor\": {},\n}\n\"\"\"Services the bridge carries out per domain, each with the service_data keys it accepts (11.4).\n\nMatches what the app and the schedules call; anything else, even if HA has it, is refused.\n\"\"\"\n\nMAX_CONCURRENT_QUERIES: Final = 2\n\"\"\"Most recorder queries (history, statistics) of the bridge that run at the same time (review finding S1).\"\"\"\n\nMAX_HISTORY_ENTITIES: Final = 50\n\"\"\"Most entities one history or statistics request may name (review finding S2).\"\"\"\n\nMAX_HISTORY_PERIOD: Final = timedelta(days=366)\n\"\"\"Longest period of haac_bridge/history; the app asks for states over any custom range.\"\"\"\n\nMAX_HOURLY_STATISTICS_PERIOD: Final = timedelta(days=32)\n\"\"\"Longest period of hourly statistics; the app uses them up to 31 days (plus one lead period).\"\"\"\n\nMAX_STATISTICS_PERIOD: Final = timedelta(days=5 * 366)\n\"\"\"Longest period of daily, weekly or monthly statistics.\"\"\"\n\nTARGET_KEYS: Final = frozenset({\"entity_id\", \"device_id\", \"area_id\", \"floor_id\", \"label_id\"})\n\"\"\"Keys that name a target; no entry of ALLOWED_SERVICES lists one, so the bridge alone sets the target (11.4).\"\"\"\n\nDISABLED_STORE_KEY: Final = f\"{DOMAIN}.disabled_entities\"\n\"\"\"Name of the storage file that holds the deactivated entities per user (concept 7.5).\"\"\"\n\nDISABLED_STORE_VERSION: Final = 1\n\"\"\"Version of the store of deactivated entities.\"\"\"\n\nMAX_DISABLED_PER_USER: Final = 500\n\"\"\"Most entities one user can have deactivated (concept 7.5).\"\"\"\n\nRUN_LOG_STORE_KEY: Final = f\"{DOMAIN}.schedule_runs\"\n\"\"\"Name of the storage file that holds the run log of the schedules (concept 19.11).\"\"\"\n\nRUN_LOG_STORE_VERSION: Final = 1\n\"\"\"Version of the run log store.\"\"\"\n\nRUN_LOG_RETENTION: Final = timedelta(days=30)\n\"\"\"How long a run log entry is kept (concept 19.11).\"\"\"\n\nMAX_RUN_LOG_PER_OWNER: Final = 200\n\"\"\"Most run log entries kept per owner; the oldest go first (concept 19.11).\"\"\"\n\nLOGGER_NAME: Final = f\"custom_components.{DOMAIN}\"\n\"\"\"Name of the package logger whose level the bridge sets; every module logger inherits it (concept 21.2).\"\"\"\n\nCONF_LOGGING: Final = \"logging\"\nCONF_LEVEL: Final = \"level\"\nCONF_ACTIVITY: Final = \"activity\"\n\"\"\"Keys of the `logging:` block in the YAML and of the same block in the entry options (concept 21.2).\"\"\"\n\nDEFAULT_LOG_LEVEL: Final = \"warning\"\n\"\"\"Log level while nothing is configured (concept 21.2).\"\"\"\n\nEVENT_ACTION: Final = f\"{DOMAIN}_action\"\n\"\"\"Event fired once per carried-out switching action; the logbook platform describes it (concept 21.4).\"\"\"\n\nAPP_CLIENT_ID: Final = \"https://stacknoise.com/haac/\"\n\"\"\"`client_id` of the HAAC app's refresh tokens (concept 5.1); it marks a call as coming from the app.\"\"\"\n\nMAX_CLIENT_LENGTH: Final = 40\n\"\"\"Longest device name the app may send in `client` (concept 21.5).\"\"\"\n","custom_components/haac_bridge/core/__init__.py":"\"\"\"Shared building blocks: errors, factories for errors and replies, command wrapper, runtime data.\"\"\"\n","custom_components/haac_bridge/core/attributes.py":"\"\"\"Attributes the bridge never passes to the app (review finding S5, concept 11.3).\n\nThe app shows all attributes of an entity (concept 8.1). Some attributes, however, name other\nentities (the members of a group or the source of a min/max sensor) or carry a link with an\naccess token. Those are left out of descriptors, live events and history.\n\"\"\"\n\nfrom collections.abc import Mapping\nfrom typing import Any\n\nfrom homeassistant.core import CompressedState, State\n\nHIDDEN_ATTRIBUTES = frozenset({\"entity_id\", \"entities\", \"entity_picture\", \"access_token\"})\n\"\"\"Attribute names that are never sent; names ending in `_entity_id` are hidden as well.\"\"\"\n\n\ndef is_hidden(name: str) -> bool:\n    \"\"\"Return True for an attribute that names other entities or carries an access link.\"\"\"\n    return name in HIDDEN_ATTRIBUTES or name.endswith(\"_entity_id\")\n\n\ndef has_hidden(attributes: Mapping[str, Any]) -> bool:\n    \"\"\"Return True if any attribute must be left out; most states have none.\"\"\"\n    return any(is_hidden(name) for name in attributes)\n\n\ndef shareable_attributes(attributes: Mapping[str, Any]) -> dict[str, Any]:\n    \"\"\"Return the attributes without the hidden ones.\"\"\"\n    return {name: value for name, value in attributes.items() if not is_hidden(name)}\n\n\ndef shareable_state(state: State) -> State:\n    \"\"\"Return the state itself, or a copy without hidden attributes if it has any.\"\"\"\n    if not has_hidden(state.attributes):\n        return state\n    return State(\n        state.entity_id,\n        state.state,\n        shareable_attributes(state.attributes),\n        last_changed=state.last_changed,\n        last_reported=state.last_reported,\n        last_updated=state.last_updated,\n        context=state.context,\n        validate_entity_id=False,\n    )\n\n\ndef compressed_state(state: State) -> CompressedState:\n    \"\"\"Return HA's compressed state for adds, without hidden attributes.\"\"\"\n    return shareable_state(state).as_compressed_state\n","custom_components/haac_bridge/core/caller.py":"\"\"\"Resolves the calling HA user of a WebSocket request (concept 10.3).\"\"\"\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.components.websocket_api import ActiveConnection\n\nfrom .errors import ErrorCode, NotAllowedError\n\n\ndef require_user(connection: ActiveConnection) -> User:\n    \"\"\"Return the HA user bound to the connection's access token, never a user named by the client.\n\n    A deactivated user is refused (HAB-AUTH-002). Home Assistant also closes the user's\n    connections when it deactivates them, which ends running subscriptions.\n    \"\"\"\n    user = connection.user\n    if user is None:\n        raise NotAllowedError(ErrorCode.AUTH_NO_USER)\n    if not user.is_active:\n        raise NotAllowedError(ErrorCode.AUTH_INACTIVE)\n    return user\n","custom_components/haac_bridge/core/command.py":"\"\"\"Command wrapper: every haac_bridge/* command runs through it (concept 18.3).\"\"\"\n\nfrom collections.abc import Awaitable, Callable, Iterable\nfrom dataclasses import dataclass, field\nimport logging\nimport time\nfrom typing import Any\n\nfrom homeassistant.components import websocket_api\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import HomeAssistant\nimport homeassistant.helpers.config_validation as cv\nimport voluptuous as vol\n\nfrom .errors import ErrorCode, HaacBridgeError\nfrom .formatting import format_value\nfrom .runtime import get_data\n\n_LOGGER = logging.getLogger(__name__)\n\nCommandHandler = Callable[[HomeAssistant, ActiveConnection, dict[str, Any]], Awaitable[Any]]\n\n\n@dataclass(frozen=True, slots=True)\nclass SubscriptionStarted:\n    \"\"\"Returned by a subscription handler: reply with an empty result, then send `initial` as first event (if any).\"\"\"\n\n    initial: Any = None\n\n\n@dataclass(frozen=True, slots=True)\nclass BridgeCommand:\n    \"\"\"A haac_bridge/* command: its type, request fields and handler.\"\"\"\n\n    type: str\n    handler: CommandHandler\n    fields: dict[Any, Any] = field(default_factory=dict)\n\n\ndef bridge_command(\n    command_type: str, fields: dict[Any, Any] | None = None\n) -> Callable[[CommandHandler], BridgeCommand]:\n    \"\"\"Declare a handler as haac_bridge/* command with optional request fields.\"\"\"\n\n    def decorator(handler: CommandHandler) -> BridgeCommand:\n        \"\"\"Wrap the handler into a BridgeCommand.\"\"\"\n        return BridgeCommand(command_type, handler, fields or {})\n\n    return decorator\n\n\ndef async_register_commands(hass: HomeAssistant, commands: Iterable[BridgeCommand]) -> None:\n    \"\"\"Register all commands with HA's WebSocket API, each inside the wrapper.\"\"\"\n    for command in commands:\n        transport_schema = vol.Schema(\n            {\n                vol.Required(\"id\"): cv.positive_int,\n                vol.Required(\"type\"): command.type,\n            },\n            extra=vol.ALLOW_EXTRA,\n        )\n        websocket_api.async_register_command(hass, command.type, _wrap(command), transport_schema)\n\n\ndef _wrap(command: BridgeCommand) -> websocket_api.WebSocketCommandHandler:\n    \"\"\"Build the HA handler that validates, runs and answers one command.\"\"\"\n    request_schema = vol.Schema(\n        {\n            vol.Required(\"id\"): cv.positive_int,\n            vol.Required(\"type\"): command.type,\n            **command.fields,\n        }\n    )\n\n    @websocket_api.async_response\n    async def _handle(\n        hass: HomeAssistant, connection: ActiveConnection, msg: dict[str, Any]\n    ) -> None:\n        \"\"\"Run the command and send exactly one reply (plus the first event of a subscription).\"\"\"\n        data = get_data(hass)\n        started = time.monotonic()\n        try:\n            payload = await command.handler(hass, connection, request_schema(msg))\n        except Exception as err:  # noqa: BLE001 - the only broad catch allowed (18.3)\n            error = data.errors.from_exception(err)\n            _log_error(command.type, connection, error, err)\n            connection.send_message(data.responses.error(msg[\"id\"], error))\n        else:\n            if isinstance(payload, SubscriptionStarted):\n                connection.send_message(data.responses.result(msg[\"id\"], None))\n                if payload.initial is not None:\n                    connection.send_message(data.responses.event(msg[\"id\"], payload.initial))\n            else:\n                connection.send_message(data.responses.result(msg[\"id\"], payload))\n        finally:\n            _record_command(hass, command.type, connection, started)\n\n    return _handle\n\n\ndef _record_command(\n    hass: HomeAssistant, command_type: str, connection: ActiveConnection, started: float\n) -> None:\n    \"\"\"Write the debug line of a command, if the level asks for it (concept 21.3).\"\"\"\n    data = get_data(hass)\n    if not data.audit.is_enabled(logging.DEBUG):\n        return\n    user_id = connection.user.id if connection.user else None\n    duration_ms = round((time.monotonic() - started) * 1000)\n    data.audit.record(\n        data.audit_entries.command(\n            command_type=command_type, user_id=user_id, duration_ms=duration_ms\n        )\n    )\n\n\ndef _log_error(\n    command_type: str,\n    connection: ActiveConnection,\n    error: HaacBridgeError,\n    err: Exception,\n) -> None:\n    \"\"\"Log a failed command once with its HAB code; tracebacks only for unexpected errors.\n\n    Facts the raiser added to the error (entity, service, device name) follow the user (concept 21.3).\n    \"\"\"\n    code = error.code\n    user_id = connection.user.id if connection.user else None\n    if code is ErrorCode.INT_UNEXPECTED:\n        _LOGGER.error(\"%s in %s (user %s)\", code, command_type, user_id, exc_info=err)\n        return\n    cause = f\" (cause: {err.__cause__!r})\" if err.__cause__ else \"\"\n    details = \"\".join(f\" {key}={format_value(value)}\" for key, value in error.details.items())\n    _LOGGER.warning(\"%s in %s (user %s): %s%s%s\", code, command_type, user_id, err, cause, details)\n","custom_components/haac_bridge/core/error_factory.py":"\"\"\"ErrorFactory: turns any caught exception into a HaacBridgeError (concept 18.2, 18.3).\"\"\"\n\nimport voluptuous as vol\n\nfrom .errors import HaacBridgeError, InternalError, RequestError\n\n\nclass ErrorFactory:\n    \"\"\"Maps exceptions to HaacBridgeError; the only place that decides an error's code.\"\"\"\n\n    def from_exception(self, err: Exception) -> HaacBridgeError:\n        \"\"\"Return a HaacBridgeError for `err`; unknown exceptions become HAB-INT-000.\"\"\"\n        if isinstance(err, HaacBridgeError):\n            return err\n        if isinstance(err, vol.Invalid):\n            return RequestError()\n        return InternalError()\n","custom_components/haac_bridge/core/errors.py":"\"\"\"All HAB error codes and the exception hierarchy of HAAC Bridge (concept 18.3).\n\nThis is the only file that defines error codes. A new error gets the next free\nnumber of its area; codes are never reused or renumbered. The attribute\ndocstring below each code is its technical description; `scripts/code_index.py`\nreads it to generate `docs/error-codes.md`.\n\"\"\"\n\nfrom enum import StrEnum\nfrom typing import Final, Self\n\nfrom homeassistant.exceptions import HomeAssistantError\n\nfrom ..const import DOMAIN\n\n\nclass ErrorCode(StrEnum):\n    \"\"\"HAB error code; the value is the code, the lowercase name is the translation key.\"\"\"\n\n    CFG_INVALID = \"HAB-CFG-001\"\n    \"\"\"The haac_bridge section in configuration.yaml failed schema validation on reload.\"\"\"\n\n    CFG_UNKNOWN_USER = \"HAB-CFG-002\"\n    \"\"\"A `username` or `user_id` in the configuration matches no Home Assistant user.\"\"\"\n\n    CFG_DUPLICATE_USER = \"HAB-CFG-003\"\n    \"\"\"Several entries of configuration.yaml refer to the same Home Assistant user; the first is used.\"\"\"\n\n    AUTH_NO_USER = \"HAB-AUTH-001\"\n    \"\"\"The WebSocket connection has no Home Assistant user bound to its access token.\"\"\"\n\n    AUTH_INACTIVE = \"HAB-AUTH-002\"\n    \"\"\"The Home Assistant user bound to the connection is deactivated.\"\"\"\n\n    SVC_NOT_ALLOWED = \"HAB-SVC-001\"\n    \"\"\"The target entity is not exposed to the calling user.\"\"\"\n\n    SVC_NOT_AVAILABLE = \"HAB-SVC-002\"\n    \"\"\"The requested service does not belong to the domain of the target entity.\"\"\"\n\n    SVC_FAILED = \"HAB-SVC-003\"\n    \"\"\"Home Assistant raised an error while executing an allowed service call.\"\"\"\n\n    ENT_NOT_FOUND = \"HAB-ENT-001\"\n    \"\"\"The requested entity does not exist in the state machine.\"\"\"\n\n    ENT_DISABLED = \"HAB-ENT-002\"\n    \"\"\"The caller deactivated the entity in the app, so no service call is carried out for it.\"\"\"\n\n    HIST_UNAVAILABLE = \"HAB-HIST-001\"\n    \"\"\"Recorder or history is not loaded, or the query against it failed.\"\"\"\n\n    HIST_TOO_LONG = \"HAB-HIST-002\"\n    \"\"\"The requested history or statistics period is longer than the bridge allows.\"\"\"\n\n    SCH_INVALID = \"HAB-SCH-001\"\n    \"\"\"A schedule failed validation (name, time, days, action or entities).\"\"\"\n\n    SCH_RUN_FAILED = \"HAB-SCH-002\"\n    \"\"\"A schedule run could not switch an entity (not exposed, unavailable or not permitted).\"\"\"\n\n    SCH_NOT_FOUND = \"HAB-SCH-003\"\n    \"\"\"The schedule does not exist.\"\"\"\n\n    SCH_CONFLICT = \"HAB-SCH-004\"\n    \"\"\"The schedule changed after the caller loaded it (optimistic concurrency).\"\"\"\n\n    SCH_LIMIT = \"HAB-SCH-005\"\n    \"\"\"The user already has the maximum number of schedules.\"\"\"\n\n    SCH_NOT_ALLOWED = \"HAB-SCH-006\"\n    \"\"\"A regular user touched a foreign schedule, or an admin tried to change a foreign entity list.\"\"\"\n\n    SCH_BUSY = \"HAB-SCH-007\"\n    \"\"\"run_now while the schedule is running or within RUN_NOW_COOLDOWN of the last manual run.\"\"\"\n\n    SCH_BLOCKED = \"HAB-SCH-008\"\n    \"\"\"The schedule contains an entity its owner deactivated; it cannot be switched on or run.\"\"\"\n\n    SCH_IN_PAST = \"HAB-SCH-009\"\n    \"\"\"The date or time of a one-off schedule, or the end date of a repeating one, is in the past.\"\"\"\n\n    SCH_SKIP_INVALID = \"HAB-SCH-010\"\n    \"\"\"The run to skip is not one of the next runs of the schedule, or it would leave no run at all.\"\"\"\n\n    WS_INVALID_REQUEST = \"HAB-WS-001\"\n    \"\"\"The request fields of a haac_bridge/* command failed validation.\"\"\"\n\n    INT_UNEXPECTED = \"HAB-INT-000\"\n    \"\"\"An exception without a HAB code reached the command wrapper.\"\"\"\n\n    @property\n    def translation_key(self) -> str:\n        \"\"\"Return the key of the user text in translations/en.json.\"\"\"\n        return self.name.lower()\n\n    @property\n    def area(self) -> str:\n        \"\"\"Return the area part of the code, e.g. `SVC` for `HAB-SVC-001`.\"\"\"\n        return self.value.split(\"-\")[1]\n\n\nAPP_CODES: Final[dict[ErrorCode, str | None]] = {\n    ErrorCode.CFG_INVALID: None,\n    ErrorCode.CFG_UNKNOWN_USER: None,\n    ErrorCode.CFG_DUPLICATE_USER: None,\n    ErrorCode.AUTH_NO_USER: \"HAAC-AUTH-003\",\n    ErrorCode.AUTH_INACTIVE: \"HAAC-AUTH-006\",\n    ErrorCode.SVC_NOT_ALLOWED: \"HAAC-BRG-003\",\n    ErrorCode.SVC_NOT_AVAILABLE: \"HAAC-BRG-004\",\n    ErrorCode.SVC_FAILED: \"HAAC-BRG-005\",\n    ErrorCode.ENT_NOT_FOUND: \"HAAC-ENT-001\",\n    ErrorCode.ENT_DISABLED: \"HAAC-ENT-003\",\n    ErrorCode.HIST_UNAVAILABLE: \"HAAC-BRG-006\",\n    ErrorCode.HIST_TOO_LONG: \"HAAC-BRG-006\",\n    ErrorCode.SCH_INVALID: \"HAAC-SCH-003\",\n    ErrorCode.SCH_RUN_FAILED: \"HAAC-SCH-007\",\n    ErrorCode.SCH_NOT_FOUND: \"HAAC-SCH-001\",\n    ErrorCode.SCH_CONFLICT: \"HAAC-SCH-004\",\n    ErrorCode.SCH_LIMIT: \"HAAC-SCH-005\",\n    ErrorCode.SCH_NOT_ALLOWED: \"HAAC-SCH-006\",\n    ErrorCode.SCH_BUSY: \"HAAC-BRG-005\",\n    ErrorCode.SCH_BLOCKED: \"HAAC-SCH-008\",\n    ErrorCode.SCH_IN_PAST: \"HAAC-SCH-009\",\n    ErrorCode.SCH_SKIP_INVALID: \"HAAC-SCH-010\",\n    ErrorCode.WS_INVALID_REQUEST: \"HAAC-BRG-005\",\n    ErrorCode.INT_UNEXPECTED: \"HAAC-BRG-005\",\n}\n\"\"\"HAAC code the app shows for each HAB code (concept 18.3); None means admin only (Repairs).\"\"\"\n\n\nclass HaacBridgeError(HomeAssistantError):\n    \"\"\"Base of every exception raised by HAAC Bridge; carries an ErrorCode.\"\"\"\n\n    default_code: ErrorCode = ErrorCode.INT_UNEXPECTED\n\n    def __init__(\n        self,\n        code: ErrorCode | None = None,\n        placeholders: dict[str, str] | None = None,\n    ) -> None:\n        \"\"\"Create the error with its code and optional translation placeholders.\"\"\"\n        self.code = code or self.default_code\n        self.details: dict[str, str] = {}\n        super().__init__(\n            translation_domain=DOMAIN,\n            translation_key=self.code.translation_key,\n            translation_placeholders=placeholders,\n        )\n\n    def with_details(self, **details: str | None) -> Self:\n        \"\"\"Add facts (entity, service, device name) for the single log line of this error (concept 21.3).\"\"\"\n        self.details.update({key: value for key, value in details.items() if value is not None})\n        return self\n\n\nclass ConfigError(HaacBridgeError):\n    \"\"\"Error in the haac_bridge YAML configuration (area CFG).\"\"\"\n\n    default_code = ErrorCode.CFG_INVALID\n\n\nclass NotAllowedError(HaacBridgeError):\n    \"\"\"The caller could not be identified or is deactivated (area AUTH).\"\"\"\n\n    default_code = ErrorCode.AUTH_NO_USER\n\n\nclass InvalidServiceError(HaacBridgeError):\n    \"\"\"A service call was rejected or failed (area SVC).\"\"\"\n\n    default_code = ErrorCode.SVC_NOT_ALLOWED\n\n\nclass EntityNotFoundError(HaacBridgeError):\n    \"\"\"A requested entity does not exist (area ENT).\"\"\"\n\n    default_code = ErrorCode.ENT_NOT_FOUND\n\n\nclass HistoryError(HaacBridgeError):\n    \"\"\"History or statistics could not be read (area HIST).\"\"\"\n\n    default_code = ErrorCode.HIST_UNAVAILABLE\n\n\nclass ScheduleError(HaacBridgeError):\n    \"\"\"A schedule is invalid, missing, in conflict or not allowed (area SCH).\"\"\"\n\n    default_code = ErrorCode.SCH_INVALID\n\n\nclass RequestError(HaacBridgeError):\n    \"\"\"A WebSocket request has an invalid format (area WS).\"\"\"\n\n    default_code = ErrorCode.WS_INVALID_REQUEST\n\n\nclass InternalError(HaacBridgeError):\n    \"\"\"Unexpected error inside the bridge (area INT).\"\"\"\n\n    default_code = ErrorCode.INT_UNEXPECTED\n","custom_components/haac_bridge/core/formatting.py":"\"\"\"Formatting of values for log lines (concept 21.7).\"\"\"\n\nimport json\nimport re\nfrom typing import Any\n\n_PLAIN = re.compile(r\"^[A-Za-z0-9_.:/@-]+$\")\n_LINE_BREAKS = str.maketrans({\"\\u2028\": \"\\\\u2028\", \"\\u2029\": \"\\\\u2029\", \"\\x85\": \"\\\\u0085\"})\n\n\ndef format_value(value: Any) -> str:\n    \"\"\"Return a value for a log line: plain words as they are, everything else as JSON.\n\n    JSON escapes line breaks and quotes, so text typed by a user cannot forge a second log line (concept 21.7).\n    \"\"\"\n    if value is None:\n        return \"none\"\n    if isinstance(value, bool):\n        return str(value).lower()\n    if isinstance(value, int | float):\n        return str(value)\n    if isinstance(value, str) and _PLAIN.match(value):\n        return value\n    text = json.dumps(value, ensure_ascii=False, sort_keys=True, default=str)\n    return text.translate(_LINE_BREAKS)\n","custom_components/haac_bridge/core/log_settings.py":"\"\"\"Log level and Activity switch as values; shared by the runtime data and the audit log (concept 21.2).\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom enum import StrEnum\nimport logging\n\nfrom ..const import DEFAULT_LOG_LEVEL\n\n\nclass LogLevel(StrEnum):\n    \"\"\"The log levels an administrator can choose.\"\"\"\n\n    DEBUG = \"debug\"\n    INFO = \"info\"\n    WARNING = \"warning\"\n    ERROR = \"error\"\n\n    @property\n    def number(self) -> int:\n        \"\"\"Return the number of the level in the `logging` module.\"\"\"\n        return logging.getLevelNamesMapping()[self.name]\n\n\n@dataclass(frozen=True, slots=True)\nclass LoggingSettings:\n    \"\"\"The log level and whether switching actions appear in the Activity page.\"\"\"\n\n    level: LogLevel = field(default=LogLevel(DEFAULT_LOG_LEVEL))\n    activity: bool = True\n","custom_components/haac_bridge/core/response_factory.py":"\"\"\"ResponseFactory: builds every WebSocket reply of HAAC Bridge (concept 11, 18.2).\"\"\"\n\nfrom functools import lru_cache\nfrom typing import Any\n\nfrom homeassistant.components import websocket_api\nfrom homeassistant.components.websocket_api.messages import cached_state_diff_message\nfrom homeassistant.core import Event, EventStateChangedData\n\nfrom .attributes import has_hidden, shareable_state\nfrom .errors import HaacBridgeError\n\n\nclass ResponseFactory:\n    \"\"\"Creates result and error messages in HA's WebSocket reply format.\"\"\"\n\n    def result(self, msg_id: int, payload: Any) -> dict[str, Any]:\n        \"\"\"Return a success reply carrying `payload`.\"\"\"\n        return websocket_api.result_message(msg_id, payload)\n\n    def event(self, msg_id: int, payload: Any) -> dict[str, Any]:\n        \"\"\"Return an event message of the subscription `msg_id`.\"\"\"\n        return websocket_api.event_message(msg_id, payload)\n\n    def state_diff(self, msg_id: int, event: Event[EventStateChangedData]) -> bytes:\n        \"\"\"Return a state change as HA's compressed diff event, serialized once for all subscribers.\n\n        A state with hidden attributes (finding S5) is diffed from copies without them.\n        \"\"\"\n        return cached_state_diff_message(str(msg_id).encode(), _without_hidden_attributes(event))\n\n    def error(self, msg_id: int, error: HaacBridgeError) -> dict[str, Any]:\n        \"\"\"Return an error reply whose `code` is the HAB code of `error`.\"\"\"\n        return websocket_api.error_message(\n            msg_id,\n            error.code.value,\n            str(error),\n            translation_key=error.translation_key,\n            translation_domain=error.translation_domain,\n            translation_placeholders=error.translation_placeholders,\n        )\n\n\ndef _without_hidden_attributes(event: Event[EventStateChangedData]) -> Event[EventStateChangedData]:\n    \"\"\"Return the event itself, or a copy whose states leave out hidden attributes.\"\"\"\n    old_state = event.data[\"old_state\"]\n    new_state = event.data[\"new_state\"]\n    if not any(\n        state is not None and has_hidden(state.attributes) for state in (old_state, new_state)\n    ):\n        return event\n    return _shareable_copy(event)\n\n\n@lru_cache(maxsize=128)\ndef _shareable_copy(event: Event[EventStateChangedData]) -> Event[EventStateChangedData]:\n    \"\"\"Return the copy of an event without hidden attributes; one copy per event for all subscribers.\n\n    HA caches the serialized diff by event object. A fresh copy per subscriber would never hit that\n    cache and would push useful entries out of it (review finding 8). The size is HA's own.\n    \"\"\"\n    old_state = event.data[\"old_state\"]\n    new_state = event.data[\"new_state\"]\n    return Event(\n        event.event_type,\n        EventStateChangedData(\n            entity_id=event.data[\"entity_id\"],\n            old_state=shareable_state(old_state) if old_state else None,\n            new_state=shareable_state(new_state) if new_state else None,\n        ),\n        event.origin,\n        event.time_fired_timestamp,\n        event.context,\n    )\n","custom_components/haac_bridge/core/runtime.py":"\"\"\"Runtime data of HAAC Bridge stored in hass.data (concept 18.2).\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import TYPE_CHECKING, Any, Protocol\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.util.hass_dict import HassKey\n\nfrom ..const import DOMAIN\nfrom .error_factory import ErrorFactory\nfrom .log_settings import LoggingSettings\nfrom .response_factory import ResponseFactory\n\nif TYPE_CHECKING:\n    from ..audit.entry import AuditEntry\n    from ..audit.factory import AuditEntryFactory\n    from ..config.schema import UserEntry\n    from ..entities.descriptor_factory import DescriptorFactory\n    from ..exposure.exposure import Exposure\n    from ..exposure.filter_factory import FilterFactory\n    from ..schedules.manager import ScheduleManager\n    from ..schedules.model import RunEntry\n    from ..services.call_factory import ServiceCallFactory\n\n\nclass DisabledEntities(Protocol):\n    \"\"\"The entities each user deactivated (concept 7.5); the real store replaces the no-op one.\"\"\"\n\n    def is_disabled(self, user_id: str, entity_id: str) -> bool:\n        \"\"\"Return whether the user deactivated the entity.\"\"\"\n\n    def entities_of(self, user_id: str) -> dict[str, str]:\n        \"\"\"Return the user's deactivated entities with the ISO time of the deactivation.\"\"\"\n\n    def user_ids(self) -> list[str]:\n        \"\"\"Return the users who have at least one deactivated entity.\"\"\"\n\n    async def async_set(self, user_id: str, entity_id: str, disabled: bool) -> bool:\n        \"\"\"Deactivate or activate an entity for the user; return whether anything changed.\"\"\"\n\n    async def async_forget_user(self, user_id: str) -> bool:\n        \"\"\"Drop all entries of a user; return whether there were any.\"\"\"\n\n\nclass RunLog(Protocol):\n    \"\"\"The log of schedule runs (concept 19.11); the real log replaces the no-op one.\"\"\"\n\n    def record(self, entry: RunEntry) -> None:\n        \"\"\"Append the entry of a finished or missed run.\"\"\"\n\n\nclass AuditLog(Protocol):\n    \"\"\"The audit log (concept 21); the real log replaces the no-op one.\"\"\"\n\n    settings: LoggingSettings\n\n    def record(self, entry: AuditEntry) -> None:\n        \"\"\"Write the entry to the log and, if it has one, fire its Activity event.\"\"\"\n\n    def is_enabled(self, level: int) -> bool:\n        \"\"\"Return whether a line of this level would be written.\"\"\"\n\n    def configure(self, settings: LoggingSettings) -> None:\n        \"\"\"Take over new settings and set the log level.\"\"\"\n\n\nclass NoDisabledEntities:\n    \"\"\"Stand-in until the store exists: nothing is deactivated.\"\"\"\n\n    def is_disabled(self, user_id: str, entity_id: str) -> bool:\n        \"\"\"Return False for every entity.\"\"\"\n        return False\n\n    def entities_of(self, user_id: str) -> dict[str, str]:\n        \"\"\"Return no entities.\"\"\"\n        return {}\n\n    def user_ids(self) -> list[str]:\n        \"\"\"Return no users.\"\"\"\n        return []\n\n    async def async_set(self, user_id: str, entity_id: str, disabled: bool) -> bool:\n        \"\"\"Change nothing.\"\"\"\n        return False\n\n    async def async_forget_user(self, user_id: str) -> bool:\n        \"\"\"Change nothing.\"\"\"\n        return False\n\n\nclass NoAuditLog:\n    \"\"\"Stand-in until the audit log exists: entries are dropped.\"\"\"\n\n    settings = LoggingSettings()\n\n    def record(self, entry: AuditEntry) -> None:\n        \"\"\"Drop the entry.\"\"\"\n\n    def is_enabled(self, level: int) -> bool:\n        \"\"\"Return False for every level.\"\"\"\n        return False\n\n    def configure(self, settings: LoggingSettings) -> None:\n        \"\"\"Change nothing.\"\"\"\n\n\nclass NoRunLog:\n    \"\"\"Stand-in until the log exists: entries are dropped.\"\"\"\n\n    def record(self, entry: RunEntry) -> None:\n        \"\"\"Drop the entry.\"\"\"\n\n\n@dataclass(slots=True)\nclass HaacBridgeData:\n    \"\"\"Factories, current exposure and the user entries of YAML and UI; created in async_setup.\"\"\"\n\n    version: str\n    filters: FilterFactory\n    descriptors: DescriptorFactory\n    services: ServiceCallFactory\n    exposure: Exposure\n    schedules: ScheduleManager\n    audit_entries: AuditEntryFactory\n    errors: ErrorFactory = field(default_factory=ErrorFactory)\n    responses: ResponseFactory = field(default_factory=ResponseFactory)\n    disabled: DisabledEntities = field(default_factory=NoDisabledEntities)\n    run_log: RunLog = field(default_factory=NoRunLog)\n    audit: AuditLog = field(default_factory=NoAuditLog)\n    yaml_logging: dict[str, Any] = field(default_factory=dict)\n    issue_ids: set[str] = field(default_factory=set)\n    yaml_entries: list[UserEntry] = field(default_factory=list)\n    ui_entries: list[UserEntry] = field(default_factory=list)\n\n\nDATA_KEY: HassKey[HaacBridgeData] = HassKey(DOMAIN)\n\n\ndef get_data(hass: HomeAssistant) -> HaacBridgeData:\n    \"\"\"Return the runtime data of HAAC Bridge.\"\"\"\n    return hass.data[DATA_KEY]\n","custom_components/haac_bridge/core/subscriptions.py":"\"\"\"Keeps one subscription of each kind per WebSocket connection (review finding S7).\"\"\"\n\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.core import callback\n\n\n@callback\ndef async_end_subscriptions_of(connection: ActiveConnection, owner_type: type) -> None:\n    \"\"\"End every subscription of the connection whose stop callback belongs to an `owner_type` object.\n\n    Called before a new subscription of that kind starts, so a connection never holds more than\n    one; the app opens one per kind and session anyway.\n    \"\"\"\n    for msg_id, unsub in list(connection.subscriptions.items()):\n        if isinstance(getattr(unsub, \"__self__\", None), owner_type):\n            connection.subscriptions.pop(msg_id)()\n","custom_components/haac_bridge/disabling/__init__.py":"\"\"\"Deactivated entities per user and their effect on schedules (concept 7.5).\"\"\"\n","custom_components/haac_bridge/disabling/manager.py":"\"\"\"Deactivating and activating entities for a user, with the effect on their schedules (concept 7.5).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.dispatcher import async_dispatcher_send\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import DOMAIN, MAX_DISABLED_PER_USER\nfrom ..core.errors import EntityNotFoundError, ErrorCode, RequestError\nfrom ..core.runtime import get_data\nfrom ..schedules.disabled import changes_for\n\nSIGNAL_DISABLED_CHANGED = f\"{DOMAIN}_disabled_changed\"\n\"\"\"Dispatcher signal sent with the user id after that user deactivated or activated an entity.\"\"\"\n\n\ndef disabled_list(hass: HomeAssistant, user_id: str) -> list[str]:\n    \"\"\"Return the entity ids the user deactivated, sorted; the payload of `disabled` replies and events.\"\"\"\n    return sorted(get_data(hass).disabled.entities_of(user_id))\n\n\nasync def async_set_disabled(\n    hass: HomeAssistant, user: User, entity_id: str, *, disabled: bool\n) -> dict[str, Any]:\n    \"\"\"Deactivate or activate an entity for the caller; return their full list and the schedules switched.\n\n    The entity must be exposed to the caller (HAB-ENT-001); only an existing deactivation can be lifted\n    for an entity that is no longer exposed, so a withdrawn entity never keeps a user at the limit.\n    A new deactivation beyond MAX_DISABLED_PER_USER is HAB-WS-001. The schedules of the caller that\n    contain the entity are switched off, or on again, and `disabled_changed` goes to all connections.\n    \"\"\"\n    data = get_data(hass)\n    store = data.disabled\n    lifting = not disabled and store.is_disabled(user.id, entity_id)\n    if not lifting and not data.exposure.is_exposed(user, entity_id):\n        raise EntityNotFoundError(ErrorCode.ENT_NOT_FOUND)\n    if (\n        disabled\n        and not store.is_disabled(user.id, entity_id)\n        and len(store.entities_of(user.id)) >= MAX_DISABLED_PER_USER\n    ):\n        raise RequestError(ErrorCode.WS_INVALID_REQUEST)\n    switched: list[str] = []\n    if await store.async_set(user.id, entity_id, disabled):\n        switched = await _async_follow_in_schedules(hass, user.id, entity_id)\n        async_dispatcher_send(hass, SIGNAL_DISABLED_CHANGED, user.id)\n        data.audit.record(\n            data.audit_entries.entity_disabled(\n                user=user, entity_id=entity_id, disabled=disabled, schedules=len(switched)\n            )\n        )\n    return {\"disabled\": disabled_list(hass, user.id), \"schedules_changed\": switched}\n\n\nasync def _async_follow_in_schedules(\n    hass: HomeAssistant, user_id: str, entity_id: str\n) -> list[str]:\n    \"\"\"Store, re-plan and announce the changes to the user's schedules; return the ids switched.\"\"\"\n    data = get_data(hass)\n    schedules = data.schedules\n    replace, switched = changes_for(\n        data.disabled, schedules.store.by_owner(user_id), entity_id, dt_util.utcnow()\n    )\n    if replace:\n        await schedules.store.async_apply_changes(replace=replace)\n        for schedule in replace:\n            await schedules.planner.async_plan(schedule.id)\n        schedules.notify(*(schedule.id for schedule in replace))\n    return switched\n\n\nasync def async_sweep(hass: HomeAssistant) -> None:\n    \"\"\"Drop the entries of users who are gone or no longer configured (concept 19.6.3).\n\n    Does nothing while the UI users are not loaded, like the sweep of the schedules.\n    \"\"\"\n    data = get_data(hass)\n    if not data.schedules.users_ready:\n        return\n    for user_id in data.disabled.user_ids():\n        user = await hass.auth.async_get_user(user_id)\n        if user is None or not data.exposure.is_configured(user):\n            await data.disabled.async_forget_user(user_id)\n","custom_components/haac_bridge/disabling/store.py":"\"\"\"Persistent store of the entities each user deactivated, `.storage/haac_bridge.disabled_entities` (concept 7.5).\"\"\"\n\nfrom typing import Any\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers.storage import Store\nfrom homeassistant.util import dt as dt_util\n\nfrom ..const import DISABLED_STORE_KEY, DISABLED_STORE_VERSION\n\n\ndef _readable(raw: object) -> dict[str, dict[str, str]]:\n    \"\"\"Return the `users` part of stored data, leaving out everything that is not user -> entity -> time.\"\"\"\n    if not isinstance(raw, dict):\n        return {}\n    return {\n        user_id: {\n            entity_id: since\n            for entity_id, since in entities.items()\n            if isinstance(entity_id, str) and isinstance(since, str)\n        }\n        for user_id, entities in raw.items()\n        if isinstance(user_id, str) and isinstance(entities, dict)\n    }\n\n\nclass DisabledStore:\n    \"\"\"Holds the deactivated entities of all users in memory and writes them after every change.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Create an empty store; call `async_load` before use.\"\"\"\n        self._store: Store[dict[str, Any]] = Store(\n            hass, DISABLED_STORE_VERSION, DISABLED_STORE_KEY, private=True\n        )\n        self._users: dict[str, dict[str, str]] = {}\n\n    async def async_load(self) -> None:\n        \"\"\"Read the deactivated entities from storage.\"\"\"\n        stored = await self._store.async_load() or {}\n        self._users = {\n            user_id: entities\n            for user_id, entities in _readable(stored.get(\"users\")).items()\n            if entities\n        }\n\n    def is_disabled(self, user_id: str, entity_id: str) -> bool:\n        \"\"\"Return whether the user deactivated the entity.\"\"\"\n        return entity_id in self._users.get(user_id, {})\n\n    def entities_of(self, user_id: str) -> dict[str, str]:\n        \"\"\"Return the user's deactivated entities with the ISO time of the deactivation.\"\"\"\n        return dict(self._users.get(user_id, {}))\n\n    def user_ids(self) -> list[str]:\n        \"\"\"Return the users who have at least one deactivated entity.\"\"\"\n        return list(self._users)\n\n    async def async_set(self, user_id: str, entity_id: str, disabled: bool) -> bool:\n        \"\"\"Deactivate or activate an entity for the user and save; return whether anything changed.\"\"\"\n        if self.is_disabled(user_id, entity_id) == disabled:\n            return False\n        if disabled:\n            self._users.setdefault(user_id, {})[entity_id] = dt_util.utcnow().isoformat()\n        else:\n            self._forget_entity(user_id, entity_id)\n        await self._async_save()\n        return True\n\n    async def async_forget_user(self, user_id: str) -> bool:\n        \"\"\"Drop all entries of a user (deleted or no longer configured) and save; return whether there were any.\"\"\"\n        if self._users.pop(user_id, None) is None:\n            return False\n        await self._async_save()\n        return True\n\n    def _forget_entity(self, user_id: str, entity_id: str) -> None:\n        \"\"\"Remove one entry; a user without entries is removed too.\"\"\"\n        entities = self._users[user_id]\n        del entities[entity_id]\n        if not entities:\n            del self._users[user_id]\n\n    async def _async_save(self) -> None:\n        \"\"\"Write all entries to storage now.\"\"\"\n        await self._store.async_save({\"users\": self._users})\n","custom_components/haac_bridge/entities/__init__.py":"\"\"\"Entity descriptors sent to the app.\"\"\"\n","custom_components/haac_bridge/entities/descriptor_factory.py":"\"\"\"DescriptorFactory: builds the entity descriptors sent to the app (concept 11.3, 18.2).\"\"\"\n\nfrom collections.abc import Callable, Mapping\nfrom typing import Any\n\nfrom homeassistant.const import (\n    ATTR_DEVICE_CLASS,\n    ATTR_SUPPORTED_FEATURES,\n    ATTR_UNIT_OF_MEASUREMENT,\n)\nfrom homeassistant.core import HomeAssistant, State\nfrom homeassistant.helpers import (\n    area_registry as ar,\n    device_registry as dr,\n    entity_registry as er,\n)\n\nfrom ..core.attributes import shareable_attributes\n\nDomainFields = Callable[[State, er.RegistryEntry | None], dict[str, Any]]\n\n\ndef _no_fields(state: State, entry: er.RegistryEntry | None) -> dict[str, Any]:\n    \"\"\"Return no domain-specific fields (switch, climate: everything is in attributes).\"\"\"\n    return {}\n\n\ndef _sensor_fields(state: State, entry: er.RegistryEntry | None) -> dict[str, Any]:\n    \"\"\"Return unit, state class and display precision a sensor tile needs (8.3).\"\"\"\n    options = entry.options.get(\"sensor\", {}) if entry else {}\n    return {\n        \"unit_of_measurement\": state.attributes.get(ATTR_UNIT_OF_MEASUREMENT),\n        \"state_class\": state.attributes.get(\"state_class\"),\n        \"display_precision\": options.get(\n            \"display_precision\", options.get(\"suggested_display_precision\")\n        ),\n    }\n\n\n_DOMAIN_FIELDS: dict[str, DomainFields] = {\n    \"switch\": _no_fields,\n    \"sensor\": _sensor_fields,\n    \"binary_sensor\": _no_fields,\n    \"climate\": _no_fields,\n}\n\n\nclass DescriptorFactory:\n    \"\"\"Creates one descriptor per entity; the only place with per-domain field selection.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Keep the registries needed to resolve names and areas.\"\"\"\n        self._hass = hass\n\n    def create(self, state: State, configured_name: str | None = None) -> dict[str, Any]:\n        \"\"\"Return the descriptor of an entity including its current state and all attributes.\n\n        `name` is always HA's friendly name; `configured_name` is the name from `entity_config`\n        that the app shows by default (concept 7.3), or None.\n        \"\"\"\n        entry = er.async_get(self._hass).async_get(state.entity_id)\n        attributes = state.attributes\n        descriptor: dict[str, Any] = {\n            \"entity_id\": state.entity_id,\n            \"domain\": state.domain,\n            \"name\": state.name,\n            \"configured_name\": configured_name,\n            \"device_class\": attributes.get(ATTR_DEVICE_CLASS),\n            \"supported_features\": attributes.get(ATTR_SUPPORTED_FEATURES, 0),\n            \"area\": self._area_name(entry),\n            \"state\": state.state,\n            \"attributes\": shareable_attributes(attributes),\n            \"last_changed\": state.last_changed.isoformat(),\n            \"last_updated\": state.last_updated.isoformat(),\n        }\n        descriptor.update(_DOMAIN_FIELDS.get(state.domain, _no_fields)(state, entry))\n        return descriptor\n\n    def create_many(\n        self, entity_ids: list[str], names: Mapping[str, str] | None = None\n    ) -> list[dict[str, Any]]:\n        \"\"\"Return descriptors with configured names, skipping entities without a state.\"\"\"\n        names = names or {}\n        states = (self._hass.states.get(entity_id) for entity_id in entity_ids)\n        return [\n            self.create(state, names.get(state.entity_id)) for state in states if state is not None\n        ]\n\n    def _area_name(self, entry: er.RegistryEntry | None) -> str | None:\n        \"\"\"Return the HA area of the entity, or of its device if the entity has none.\"\"\"\n        if entry is None:\n            return None\n        area_id = entry.area_id\n        if area_id is None and entry.device_id is not None:\n            device = dr.async_get(self._hass).async_get(entry.device_id)\n            area_id = device.area_id if device else None\n        if area_id is None:\n            return None\n        area = ar.async_get(self._hass).async_get_area(area_id)\n        return area.name if area else None\n","custom_components/haac_bridge/entities/subscription.py":"\"\"\"Live state subscription of one app connection (concept 9.2, 11.2).\n\nEvents use HA's compressed format (`a` added, `c` changed, `r` removed) and, whenever the\nexposed set changes, an `exposure_changed` event with the new revision. When the user deactivates or\nactivates an entity (concept 7.5), `disabled_changed` carries their full list.\n\"\"\"\n\nfrom collections.abc import Callable\nfrom typing import Any\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.components.websocket_api import ActiveConnection\nfrom homeassistant.const import EVENT_STATE_CHANGED\nfrom homeassistant.core import Event, EventStateChangedData, HomeAssistant, callback\nfrom homeassistant.helpers.dispatcher import async_dispatcher_connect\n\nfrom ..const import SIGNAL_EXPOSURE_CHANGED\nfrom ..core.attributes import compressed_state\nfrom ..core.runtime import get_data\nfrom ..core.subscriptions import async_end_subscriptions_of\nfrom ..disabling.manager import SIGNAL_DISABLED_CHANGED, disabled_list\nfrom ..exposure.exposure import compute_revision\n\nADDED = \"a\"\nCHANGED = \"c\"\nREMOVED = \"r\"\nEXPOSURE_CHANGED = \"exposure_changed\"\nDISABLED_CHANGED = \"disabled_changed\"\n\n\nclass EntitySubscription:\n    \"\"\"Sends state changes of the entities exposed to one user to one WebSocket subscription.\"\"\"\n\n    def __init__(\n        self,\n        hass: HomeAssistant,\n        connection: ActiveConnection,\n        msg_id: int,\n        user: User,\n    ) -> None:\n        \"\"\"Keep everything needed to filter and send events; nothing is subscribed yet.\"\"\"\n        self._hass = hass\n        self._connection = connection\n        self._msg_id = msg_id\n        self._user = user\n        self._data = get_data(hass)\n        self._entity_ids: set[str] = set()\n        self._unsubs: list[Callable[[], None]] = []\n\n    @callback\n    def async_start(self) -> dict[str, Any]:\n        \"\"\"Start listening and return the initial event with the states of all exposed entities.\n\n        A previous entity subscription of the same connection ends first (one per connection).\n        \"\"\"\n        async_end_subscriptions_of(self._connection, EntitySubscription)\n        self._entity_ids = set(self._data.exposure.exposed_entity_ids(self._hass, self._user))\n        self._unsubs = [\n            self._hass.bus.async_listen(\n                EVENT_STATE_CHANGED,\n                self._async_on_state_changed,\n                event_filter=self._async_is_relevant,\n            ),\n            async_dispatcher_connect(\n                self._hass, SIGNAL_EXPOSURE_CHANGED, self._async_on_exposure_changed\n            ),\n            async_dispatcher_connect(\n                self._hass, SIGNAL_DISABLED_CHANGED, self._async_on_disabled_changed\n            ),\n        ]\n        return {ADDED: self._compressed_states(self._entity_ids)}\n\n    @callback\n    def async_stop(self) -> None:\n        \"\"\"Stop listening; called by HA when the app unsubscribes or the connection closes.\"\"\"\n        for unsub in self._unsubs:\n            unsub()\n        self._unsubs = []\n\n    @callback\n    def _async_is_relevant(self, event_data: EventStateChangedData) -> bool:\n        \"\"\"Return True for entities already sent to the app or exposed to its user.\"\"\"\n        entity_id = event_data[\"entity_id\"]\n        return entity_id in self._entity_ids or self._data.exposure.is_exposed(\n            self._user, entity_id\n        )\n\n    @callback\n    def _async_on_state_changed(self, event: Event[EventStateChangedData]) -> None:\n        \"\"\"Forward a change, or report an entity that appeared in or left the exposed set.\"\"\"\n        entity_id = event.data[\"entity_id\"]\n        new_state = event.data[\"new_state\"]\n        known = entity_id in self._entity_ids\n        exposed = new_state is not None and self._data.exposure.is_exposed(self._user, entity_id)\n        if known and exposed:\n            self._connection.send_message(self._data.responses.state_diff(self._msg_id, event))\n            return\n        if exposed:\n            self._entity_ids.add(entity_id)\n            self._send({ADDED: self._compressed_states({entity_id})})\n        else:\n            self._entity_ids.discard(entity_id)\n            self._send({REMOVED: [entity_id]})\n        self._send_exposure_changed()\n\n    @callback\n    def _async_on_exposure_changed(self) -> None:\n        \"\"\"After a reload: send entities added to or removed from the set, then the new revision.\"\"\"\n        current = set(self._data.exposure.exposed_entity_ids(self._hass, self._user))\n        if added := current - self._entity_ids:\n            self._send({ADDED: self._compressed_states(added)})\n        if removed := self._entity_ids - current:\n            self._send({REMOVED: sorted(removed)})\n        self._entity_ids = current\n        self._send_exposure_changed()\n\n    @callback\n    def _async_on_disabled_changed(self, user_id: str) -> None:\n        \"\"\"Send the caller's full list of deactivated entities after they changed it (concept 7.5).\"\"\"\n        if user_id == self._user.id:\n            self._send({DISABLED_CHANGED: {\"disabled\": disabled_list(self._hass, user_id)}})\n\n    def _send_exposure_changed(self) -> None:\n        \"\"\"Tell the app to run its revision check (concept 9.2).\"\"\"\n        names = self._data.exposure.configured_names(self._user)\n        revision = compute_revision(list(self._entity_ids), names)\n        self._send({EXPOSURE_CHANGED: {\"revision\": revision}})\n\n    def _send(self, payload: dict[str, Any]) -> None:\n        \"\"\"Send one event of this subscription.\"\"\"\n        self._connection.send_message(self._data.responses.event(self._msg_id, payload))\n\n    def _compressed_states(self, entity_ids: set[str]) -> dict[str, Any]:\n        \"\"\"Return HA's compressed state for each entity that still has a state.\"\"\"\n        states = (self._hass.states.get(entity_id) for entity_id in sorted(entity_ids))\n        return {state.entity_id: compressed_state(state) for state in states if state is not None}\n","custom_components/haac_bridge/exposure/__init__.py":"\"\"\"Per-user exposure: entity filters, exposed set and revision.\"\"\"\n","custom_components/haac_bridge/exposure/exposure.py":"\"\"\"Per-user set of exposed entities and its revision hash (concept 10.2, 10.3).\"\"\"\n\nfrom collections.abc import Callable, Mapping\nfrom dataclasses import dataclass\nimport hashlib\n\nfrom homeassistant.auth.models import User\nfrom homeassistant.core import HomeAssistant, callback, split_entity_id\n\nfrom ..config.schema import UserEntry\nfrom ..config.users import entry_matches\nfrom ..const import SUPPORTED_DOMAINS\nfrom .filter_factory import EntityPredicate, FilterFactory\n\n\n@dataclass(frozen=True, slots=True)\nclass ExposureSnapshot:\n    \"\"\"The entities exposed to one user at one moment, their configured names and revision.\"\"\"\n\n    entity_ids: list[str]\n    names: dict[str, str]\n    revision: str\n\n\n@dataclass(frozen=True, slots=True)\nclass _UserRule:\n    \"\"\"A configured user entry together with its built filter.\"\"\"\n\n    entry: UserEntry\n    predicate: EntityPredicate\n\n\nCACHE_LIMIT = 10_000\n\"\"\"Most cached (user, entity) answers; the cache starts over when it is full.\"\"\"\n\n\ndef _nothing_excluded(entity_id: str) -> bool:\n    \"\"\"Exclude no entity; the default when the caller has no entities of its own to hide.\"\"\"\n    return False\n\n\nclass Exposure:\n    \"\"\"Decides which entities a HA user sees; deny by default for users not configured.\"\"\"\n\n    def __init__(\n        self,\n        entries: list[UserEntry],\n        filters: FilterFactory,\n        is_own_entity: Callable[[str], bool] = _nothing_excluded,\n    ) -> None:\n        \"\"\"Build one filter per configured user entry; `is_own_entity` marks entities never exposed.\n\n        Answers are cached (review finding P1, P3): the rule per user, the decision per user and\n        entity, and the exposed set per user. The `async_invalidate_*` methods clear them.\n        \"\"\"\n        self._rules = [_UserRule(entry, filters.create(entry)) for entry in entries]\n        self._is_own_entity = is_own_entity\n        self._rule_by_user: dict[str, _UserRule | None] = {}\n        self._decisions: dict[tuple[str, str], bool] = {}\n        self._exposed_sets: dict[str, list[str]] = {}\n\n    @callback\n    def async_invalidate_users(self) -> None:\n        \"\"\"Forget everything; a HA user was added, changed or removed (login names can change).\"\"\"\n        self._rule_by_user.clear()\n        self.async_invalidate_registry()\n\n    @callback\n    def async_invalidate_registry(self) -> None:\n        \"\"\"Forget decisions and sets; the entity registry changed (own entities, renamed IDs).\"\"\"\n        self._decisions.clear()\n        self._exposed_sets.clear()\n\n    @callback\n    def async_invalidate_states(self) -> None:\n        \"\"\"Forget the exposed sets; an entity appeared in or left the state machine.\"\"\"\n        self._exposed_sets.clear()\n\n    def is_configured(self, user: User) -> bool:\n        \"\"\"Return True if the user has an entry in the YAML or the UI configuration.\"\"\"\n        return self._rule_for(user) is not None\n\n    def is_exposed(self, user: User, entity_id: str) -> bool:\n        \"\"\"Return True if the entity is in a v1 domain, passes the user's filter and is not the bridge's own.\n\n        The domain is checked first: it is the cheapest test and rejects most state changes.\n        \"\"\"\n        if split_entity_id(entity_id)[0] not in SUPPORTED_DOMAINS:\n            return False\n        key = (user.id, entity_id)\n        if (decision := self._decisions.get(key)) is not None:\n            return decision\n        rule = self._rule_for(user)\n        decision = (\n            rule is not None and rule.predicate(entity_id) and not self._is_own_entity(entity_id)\n        )\n        if len(self._decisions) >= CACHE_LIMIT:\n            self._decisions.clear()\n        self._decisions[key] = decision\n        return decision\n\n    def filter_exposed(self, user: User, entity_ids: list[str]) -> list[str]:\n        \"\"\"Return the requested IDs the user may see, sorted and without duplicates.\"\"\"\n        return sorted({entity_id for entity_id in entity_ids if self.is_exposed(user, entity_id)})\n\n    def exposed_entity_ids(self, hass: HomeAssistant, user: User) -> list[str]:\n        \"\"\"Return the sorted IDs of all current entities exposed to the user.\"\"\"\n        rule = self._rule_for(user)\n        if rule is None:\n            return []\n        if (cached := self._exposed_sets.get(user.id)) is None:\n            cached = sorted(\n                state.entity_id\n                for state in hass.states.async_all(SUPPORTED_DOMAINS)\n                if rule.predicate(state.entity_id) and not self._is_own_entity(state.entity_id)\n            )\n            self._exposed_sets[user.id] = cached\n        return list(cached)\n\n    def configured_names(self, user: User) -> dict[str, str]:\n        \"\"\"Return the names from `entity_config` that apply to the user (global, then own).\"\"\"\n        rule = self._rule_for(user)\n        return dict(rule.entry.names) if rule else {}\n\n    def snapshot(self, hass: HomeAssistant, user: User) -> ExposureSnapshot:\n        \"\"\"Return the user's exposed entities with their configured names and revision.\"\"\"\n        entity_ids = self.exposed_entity_ids(hass, user)\n        names = self.configured_names(user)\n        exposed = {entity_id: names[entity_id] for entity_id in entity_ids if entity_id in names}\n        return ExposureSnapshot(entity_ids, exposed, compute_revision(entity_ids, names))\n\n    def _rule_for(self, user: User) -> _UserRule | None:\n        \"\"\"Return the first rule whose entry refers to the user, looked up once per user.\"\"\"\n        try:\n            return self._rule_by_user[user.id]\n        except KeyError:\n            rule = next((rule for rule in self._rules if entry_matches(rule.entry, user)), None)\n            self._rule_by_user[user.id] = rule\n            return rule\n\n\ndef compute_revision(entity_ids: list[str], names: Mapping[str, str] | None = None) -> str:\n    \"\"\"Return a stable hash of an exposed set and its configured names.\n\n    It changes when entities are added or removed or a configured name changes; without\n    names it equals the hash of the bare set.\n    \"\"\"\n    names = names or {}\n    digest = hashlib.sha256()\n    for entity_id in sorted(entity_ids):\n        digest.update(entity_id.encode())\n        if (name := names.get(entity_id)) is not None:\n            digest.update(b\"\\t\" + name.encode())\n        digest.update(b\"\\n\")\n    return digest.hexdigest()\n","custom_components/haac_bridge/exposure/filter_factory.py":"\"\"\"FilterFactory: builds the entity filter of each configured user (concept 10.2, 18.2).\"\"\"\n\nfrom collections.abc import Callable\nimport logging\n\nfrom homeassistant.helpers.entityfilter import (\n    CONF_INCLUDE_DOMAINS,\n    CONF_INCLUDE_ENTITIES,\n    CONF_INCLUDE_ENTITY_GLOBS,\n    convert_filter,\n)\n\nfrom ..config.schema import UserEntry\n\n_LOGGER = logging.getLogger(__name__)\n\n_INCLUDE_KEYS = (CONF_INCLUDE_DOMAINS, CONF_INCLUDE_ENTITIES, CONF_INCLUDE_ENTITY_GLOBS)\n\nEntityPredicate = Callable[[str], bool]\n\n\ndef _deny_all(entity_id: str) -> bool:\n    \"\"\"Expose no entity; used for entries without any include rule.\"\"\"\n    return False\n\n\nclass FilterFactory:\n    \"\"\"Creates entity filters with HA's entityfilter helper, so rules match the HomeKit Bridge.\"\"\"\n\n    def create(self, entry: UserEntry) -> EntityPredicate:\n        \"\"\"Return the filter for one user entry; without an include rule it exposes nothing.\"\"\"\n        if not any(entry.filter.get(key) for key in _INCLUDE_KEYS):\n            _LOGGER.warning(\n                \"User %s has no include rule in the haac_bridge filter and sees no entities\",\n                entry.label,\n            )\n            return _deny_all\n        return convert_filter(entry.filter)\n","custom_components/haac_bridge/exposure/own_entities.py":"\"\"\"Recognises the entities HAAC Bridge creates itself, which are never exposed (concept 10.2, 19.5).\"\"\"\n\nfrom collections.abc import Callable\n\nfrom homeassistant.core import Event, HomeAssistant, callback\nfrom homeassistant.helpers import entity_registry as er\nfrom homeassistant.util.hass_dict import HassKey\n\nfrom ..const import DOMAIN\n\n\nclass _DeletedOwnEntities:\n    \"\"\"Entity IDs of deleted entities of the platform `haac_bridge`, rebuilt after registry changes.\"\"\"\n\n    def __init__(self, hass: HomeAssistant) -> None:\n        \"\"\"Start empty and follow the entity registry; the set is built on first use.\"\"\"\n        self._registry = er.async_get(hass)\n        self._ids: frozenset[str] | None = None\n        hass.bus.async_listen(er.EVENT_ENTITY_REGISTRY_UPDATED, self._async_invalidate)\n\n    @callback\n    def _async_invalidate(self, _event: Event[er.EventEntityRegistryUpdatedData]) -> None:\n        \"\"\"Forget the set; an entity was created, removed or changed.\"\"\"\n        self._ids = None\n\n    def contains(self, entity_id: str) -> bool:\n        \"\"\"Return True if a deleted registry entry of the bridge's platform had this entity ID.\"\"\"\n        if self._ids is None:\n            self._ids = frozenset(\n                entry.entity_id\n                for entry in self._registry.deleted_entities.values()\n                if entry.platform == DOMAIN\n            )\n        return entity_id in self._ids\n\n\n_DELETED_KEY: HassKey[_DeletedOwnEntities] = HassKey(f\"{DOMAIN}_deleted_own_entities\")\n\"\"\"Where the one set of deleted own entities of this HA instance is kept.\"\"\"\n\n\ndef own_entity_checker(hass: HomeAssistant) -> Callable[[str], bool]:\n    \"\"\"Return a function that tells whether an entity ID belongs to the platform `haac_bridge`.\n\n    Deleted entities of the platform count as well, so the history of a removed schedule's\n    entities is never exposed (review finding S3).\n    \"\"\"\n    registry = er.async_get(hass)\n    if (deleted := hass.data.get(_DELETED_KEY)) is None:\n        deleted = hass.data[_DELETED_KEY] = _DeletedOwnEntities(hass)\n\n    def _is_own(entity_id: str) -> bool:\n        \"\"\"Return True if the registry lists the entity, now or deleted, under the bridge's platform.\"\"\"\n        entry = registry.async_get(entity_id)\n        if entry is not None:\n            return entry.platform == DOMAIN\n        return deleted.contains(entity_id)\n\n    return _is_own\n","custom_components/haac_bridge/history/__init__.py":"\"\"\"History and long-term statistics, read from the recorder for exposed entities only.\"\"\"\n","custom_components/haac_bridge/history/queries.py":"\"\"\"Recorder queries for haac_bridge/history and haac_bridge/statistics (concept 8.1, 8.3, 10.3).\n\nCallers pass only entity IDs that already passed the exposure filter. Both queries run in the\nrecorder's executor, like Home Assistant's own history and statistics commands.\n\"\"\"\n\nimport asyncio\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\nfrom datetime import datetime, timedelta\nfrom functools import partial\nfrom typing import Any, Final\n\nfrom homeassistant.components.recorder import get_instance, history, statistics\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.exceptions import HomeAssistantError\nimport homeassistant.util.dt as dt_util\nfrom sqlalchemy.exc import SQLAlchemyError\nimport voluptuous as vol\n\nfrom ..const import (\n    DOMAIN,\n    MAX_CONCURRENT_QUERIES,\n    MAX_HISTORY_PERIOD,\n    MAX_HOURLY_STATISTICS_PERIOD,\n    MAX_STATISTICS_PERIOD,\n)\nfrom ..core.attributes import has_hidden, shareable_attributes\nfrom ..core.errors import ErrorCode, HistoryError, RequestError\n\n_GATE_KEY: Final = f\"{DOMAIN}_query_gate\"\n\"\"\"Key in `hass.data` of the semaphore that limits parallel recorder queries.\"\"\"\n\nPERIODS: Final = (\"hour\", \"day\", \"week\", \"month\")\n\"\"\"Statistic periods the app may request (concept 11.2).\"\"\"\n\nSTATISTIC_TYPES: Final = (\"mean\", \"min\", \"max\", \"sum\")\n\"\"\"Statistic values the app may request (concept 11.2).\"\"\"\n\n\ndef utc_datetime(value: Any) -> datetime:\n    \"\"\"Voluptuous validator: parse an ISO 8601 string into an aware UTC datetime.\"\"\"\n    if isinstance(value, str) and (parsed := dt_util.parse_datetime(value)) is not None:\n        return dt_util.as_utc(parsed)\n    raise vol.Invalid(\"expected an ISO 8601 date and time\")\n\n\n@dataclass(frozen=True, slots=True)\nclass TimeRange:\n    \"\"\"Requested period in UTC; `end` None means up to now.\"\"\"\n\n    start: datetime\n    end: datetime | None\n\n    def __post_init__(self) -> None:\n        \"\"\"Reject a period that ends before it starts (HAB-WS-001).\"\"\"\n        if self.end is not None and self.end < self.start:\n            raise RequestError(ErrorCode.WS_INVALID_REQUEST)\n\n    @property\n    def length(self) -> timedelta:\n        \"\"\"Return the length of the period; an open end counts up to now.\"\"\"\n        return (self.end or dt_util.utcnow()) - self.start\n\n    def check_length(self, maximum: timedelta) -> None:\n        \"\"\"Raise HAB-HIST-002 if the period is longer than `maximum`.\"\"\"\n        if self.length > maximum:\n            raise HistoryError(ErrorCode.HIST_TOO_LONG)\n\n    @property\n    def in_future(self) -> bool:\n        \"\"\"Return True if the period starts after now, so there is nothing recorded.\"\"\"\n        return self.start > dt_util.utcnow()\n\n\nasync def async_history(\n    hass: HomeAssistant,\n    entity_ids: list[str],\n    period: TimeRange,\n    minimal_response: bool,\n) -> dict[str, list[dict[str, Any]]]:\n    \"\"\"Return significant state changes per entity in HA's compressed state format, without hidden attributes.\"\"\"\n    period.check_length(MAX_HISTORY_PERIOD)\n    result: dict[str, list[dict[str, Any]]] = await _async_run(\n        hass,\n        partial(\n            history.get_significant_states,\n            hass,\n            period.start,\n            period.end,\n            entity_ids,\n            None,\n            include_start_time_state=True,\n            significant_changes_only=True,\n            minimal_response=minimal_response,\n            no_attributes=False,\n            compressed_state_format=True,\n        ),\n    )\n    for rows in result.values():\n        for row in rows:\n            if (attributes := row.get(\"a\")) and has_hidden(attributes):\n                row[\"a\"] = shareable_attributes(attributes)\n    return result\n\n\nasync def async_statistics(\n    hass: HomeAssistant,\n    entity_ids: list[str],\n    period: TimeRange,\n    resolution: str,\n    types: list[str],\n) -> dict[str, list[dict[str, Any]]]:\n    \"\"\"Return long-term statistics per entity; `start` and `end` of each row in milliseconds.\"\"\"\n    period.check_length(\n        MAX_HOURLY_STATISTICS_PERIOD if resolution == \"hour\" else MAX_STATISTICS_PERIOD\n    )\n    return await _async_run(\n        hass, partial(_statistics_in_ms, hass, set(entity_ids), period, resolution, set(types))\n    )\n\n\ndef _statistics_in_ms(\n    hass: HomeAssistant,\n    statistic_ids: set[str],\n    period: TimeRange,\n    resolution: Any,\n    types: Any,\n) -> dict[str, list[dict[str, Any]]]:\n    \"\"\"Query statistics in the executor and convert row timestamps to ms, as HA's own API does.\"\"\"\n    result: dict[str, list[dict[str, Any]]] = statistics.statistics_during_period(\n        hass, period.start, period.end, statistic_ids, resolution, None, types\n    )  # type: ignore[assignment]\n    for rows in result.values():\n        for row in rows:\n            row[\"start\"] = int(row[\"start\"] * 1000)\n            row[\"end\"] = int(row[\"end\"] * 1000)\n    return result\n\n\nasync def _async_run(hass: HomeAssistant, query: Callable[[], Any]) -> Any:\n    \"\"\"Run a recorder query in its executor; database or recorder errors become HAB-HIST-001.\n\n    At most MAX_CONCURRENT_QUERIES queries of the bridge run at once; further ones wait, so many\n    parallel requests of one user cannot occupy the recorder (review finding S1).\n    \"\"\"\n    gate = hass.data.setdefault(_GATE_KEY, asyncio.Semaphore(MAX_CONCURRENT_QUERIES))\n    try:\n        async with gate:\n            return await get_instance(hass).async_add_executor_job(query)\n    except (SQLAlchemyError, HomeAssistantError) as err:\n        raise HistoryError(ErrorCode.HIST_UNAVAILABLE) from err\n","custom_components/haac_bridge/instance/__init__.py":"\"\"\"Identity of the Home Assistant instance: instance ID and the addresses it is reachable at.\"\"\"\n","custom_components/haac_bridge/instance/addresses.py":"\"\"\"Instance ID and configured addresses of this Home Assistant instance (concept 4.3, 11.2).\"\"\"\n\nfrom collections.abc import Callable\nfrom typing import Any\n\nfrom homeassistant.core import HomeAssistant\nfrom homeassistant.helpers import instance_id\nfrom homeassistant.helpers.network import NoURLAvailableError, get_url\n\n\nasync def async_instance_identity(hass: HomeAssistant) -> dict[str, Any]:\n    \"\"\"Return the instance ID and the internal, external and cloud address (each `None` if unset).\"\"\"\n    return {\n        \"instance_id\": await instance_id.async_get(hass),\n        \"urls\": {\n            \"internal\": _url_or_none(\n                lambda: get_url(hass, allow_external=False, allow_cloud=False, allow_ip=True)\n            ),\n            \"external\": _url_or_none(\n                lambda: get_url(hass, allow_internal=False, allow_cloud=False, allow_ip=True)\n            ),\n            \"cloud\": _url_or_none(lambda: get_url(hass, require_cloud=True)),\n        },\n    }\n\n\ndef _url_or_none(resolve: Callable[[], str]) -> str | None:\n    \"\"\"Return the URL `resolve` finds, or `None` if Home Assistant has none of that kind.\"\"\"\n    try:\n        return resolve()\n    except NoURLAvailableError:\n        return None\n","custom_components/haac_bridge/logbook.py":"\"\"\"Describes the `haac_bridge_action` events for the Home Assistant Activity page (concept 21.4).\"\"\"\n\nfrom collections.abc import Callable\n\nfrom homeassistant.components.logbook import (\n    LOGBOOK_ENTRY_ENTITY_ID,\n    LOGBOOK_ENTRY_MESSAGE,\n    LOGBOOK_ENTRY_NAME,\n)\nfrom homeassistant.core import Event, HomeAssistant, callback\n\nfrom .audit.describe import describe\nfrom .const import DOMAIN, EVENT_ACTION\n\n\n@callback\ndef async_describe_events(\n    hass: HomeAssistant,\n    async_describe_event: Callable[[str, str, Callable[[Event], dict[str,
