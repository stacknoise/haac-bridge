[project]
name = "haac-bridge"
version = "0.3.0"
description = "HAAC Bridge – HACS integration for the HA Android Client"
license = "Apache-2.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "BLE",   # blind except (only allowed in core/command.py, 18.3)
    "C4",    # comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "PL",    # pylint
    "RUF",   # ruff specific
    "S",     # bandit rules
    "SIM",   # simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D202",    # blank line after function docstring (nested functions)
    "E501",    # line length is handled by ruff format
    "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.haac_bridge"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR0913"]
"scripts/**" = ["S101", "RUF001"]  # en dashes in generated Markdown headers

[tool.bandit]
exclude_dirs = ["tests"]
